include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

// Generated by `cap sync`, not committed — see .gitignore. Fail with an
// actionable message rather than an opaque `apply from` error.
def capacitorSettings = file('capacitor.settings.gradle')
if (!capacitorSettings.exists()) {
    throw new GradleException(
        "capacitor.settings.gradle is missing. It is generated by `cap sync`, not committed.\n" +
        "Generate it with:\n" +
        "  pnpm --filter @intake/web cap:export\n" +
        "  pnpm --filter @intake/native sync"
    )
}
apply from: capacitorSettings