<style>
/* ---------- stage / harness frame ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#16181b;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;overflow:auto}
#frame{position:relative;margin:auto;flex:none;width:100vw;height:100vh;height:100dvh;overflow:hidden;container-type:inline-size}
.vp-390 #frame{width:390px;height:min(844px,100dvh)}
.vp-1280 #frame{width:1280px;height:min(800px,100dvh)}

/* ---------- tokens ----------
   Domain hues sit ~35-50deg apart on the OKLCH wheel at matched lightness per theme
   (dark L~.75-.86, light L~.47-.62). Bathroom is deliberately achromatic (stone). */
.theme-dark{--bg:#030507;--ch:#0B0F14;--well:#131A21;--rule:#1F2831;--fg:#E8EDF2;--muted:#8A97A4;--on:#030507;
  --water:#49BDFF;--sodium:#F4CF08;--sugar:#FF72B7;--caffeine:#FE8C2C;--alcohol:#BF83FE;--bp:#FC4447;--weight:#49DF6E;--bath:#BEB6A9;--meds:#09E0DB;--ai:#C1C0FE;--potassium:#D2D8DE;--aon:#030507;color-scheme:dark}
.theme-light{--bg:#DDE2E7;--ch:#FFFFFF;--well:#F0F3F5;--rule:#D2D8DE;--fg:#0B0E11;--muted:#535D67;--on:#FFFFFF;
  --aon:#0B0E11;--water-a:#49BDFF;--sodium-a:#F4CF08;--sugar-a:#FF72B7;--caffeine-a:#FE8C2C;--alcohol-a:#BF83FE;--potassium-a:#AEB6BE;
  --water:#036EAE;--sodium:#A68003;--sodium-b:#8A6900;--sugar:#B8196F;--caffeine:#AF5504;--alcohol:#7F36BC;--bp:#AC002A;--weight:#02853C;--bath:#696257;--meds:#0A8282;--ai:#554DA0;--potassium:#3D454D;color-scheme:light}
#frame{--fs:15px;--numw:104px;--numsz:44px}
#frame.big{--fs:17px}

/* ---------- type ---------- */
#app,#listen{font-family:'Barlow',system-ui,sans-serif;font-size:var(--fs);line-height:1.3;color:var(--fg);-webkit-font-smoothing:antialiased}
.lab{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:13px;line-height:1.1}
.sc{font-weight:500;font-variant-numeric:tabular-nums}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:0}
.mut{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
#frame :focus{outline:none}
#frame :focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.ic{width:20px;height:20px;flex:none;display:block}
.ic-s{width:16px;height:16px}
.chrome,.sys,.log,.apps,.tabstrip,.ph,.annun,.key,.itabs,.seg{user-select:none;-webkit-user-select:none}
.pb,.sheet-b{user-select:text;-webkit-user-select:text}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app shell ---------- */
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.sys{flex:none;display:flex;align-items:stretch;gap:2px;height:calc(40px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(4px,env(safe-area-inset-right)) 0 max(4px,env(safe-area-inset-left));background:var(--ch)}
.sys>*{display:flex;align-items:center}
.sb-btn{min-width:40px;justify-content:center;padding:0 4px;border-radius:2px}
.sb-btn:hover,.sb-dose:hover,.sb-sync:hover,.acct:hover{background:var(--well)}
.sb-clock{flex-direction:column;align-items:flex-start;justify-content:center;padding:0 6px;min-width:0}
.sb-time{font-size:14px;font-weight:500;white-space:nowrap;line-height:1.15;font-variant-numeric:tabular-nums}
.sb-sub{font-size:13px;color:var(--muted);line-height:1.15;white-space:nowrap}
.sb-dose{flex-direction:column;align-items:flex-start;justify-content:center;padding:0 6px;border-radius:2px}
.sb-dose .v{font-size:17px;color:var(--meds);line-height:1}
.sb-task{flex:1;min-width:0;gap:2px;overflow:hidden;justify-content:center}
.sb-sync{gap:6px;padding:0 6px;border-radius:2px;font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--weight);flex:none}
.dot.off{background:transparent;border:2px solid var(--muted)}
.acct{gap:6px;padding:0 6px;border-radius:2px;white-space:nowrap}
.ini{width:28px;height:28px;display:grid;place-items:center;background:var(--fg);color:var(--bg);border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em}
.aion{font-size:13px;font-weight:600;color:var(--ai);white-space:nowrap}
.signin{flex-direction:column;align-items:flex-start;justify-content:center;outline:1px solid var(--fg);outline-offset:-1px;border-radius:2px;padding:0 10px;margin:4px 0;line-height:1.1;white-space:nowrap}
.signin b{font-weight:600;font-size:14px}
.signin span{font-size:12px;color:var(--muted)}
.nm,.wide-only{display:none}
.task{height:32px;align-self:center;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:2px;font-size:14px;font-weight:500;white-space:nowrap;position:relative}
.task:hover{background:var(--well)}
.task.on{background:var(--rule)}
.task.open::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--fg)}
.task .ti{color:var(--muted);display:flex}
.task.open .ti{color:var(--fg)}
.task .n{color:var(--muted);font-size:15px}
.due{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--meds);outline:1px solid var(--meds);outline-offset:-1px;padding:2px 4px 1px;border-radius:2px;line-height:1.05;white-space:nowrap;font-size:13px}

.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:4px;padding:4px max(4px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
.col{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;position:relative}
.work{flex:1;min-height:0;display:none;position:relative}

/* ---------- Today gadget: the monitor (one instrument, channels split by hairlines) ---------- */
.today{flex:none;display:flex;flex-direction:column;gap:1px;background:var(--bg);border-radius:2px;overflow:hidden}
.th{flex:none;height:24px;display:grid;grid-template-columns:minmax(0,1fr) var(--numw);column-gap:10px;align-items:center;padding:0 10px;background:var(--ch)}
.th .days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.th .days span{text-align:center}
.th .days span.t{color:var(--fg)}
.th .tl{text-align:right}
.ch{flex:none;height:88px;display:grid;grid-template-columns:minmax(0,1fr) var(--numw);grid-template-rows:18px minmax(0,1fr) 17px;column-gap:10px;row-gap:2px;padding:5px 10px 4px;background:var(--ch);color:var(--fg);--ink:var(--c);overflow:hidden;width:100%;text-align:left}
button.ch:hover{background:var(--well)}
.ch-top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap}
.ch-top .ic{color:var(--c)}
.ch-top .nmx{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.ch-top .u{font-size:13px;color:var(--muted)}
.ch-top .lim{margin-left:auto;font-size:13px;color:var(--muted)}
.ch-top .lim b{color:var(--fg);font-weight:600}
.ch-lim2{display:none;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-lim2 b{color:var(--fg);font-weight:600}
.ch-trend{grid-column:1;grid-row:2;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-height:0}
.tc{display:flex;flex-direction:column;min-width:0;min-height:0}
.tc .v{height:14px;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:13px;line-height:14px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.tc .bw{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center;margin-top:2px}
.tc .b{width:62%;min-height:2px;background:var(--ink)}
.tc .bw::after{content:"";position:absolute;left:-2px;right:-2px;bottom:var(--lp);border-top:1px dashed var(--fg);opacity:.55;pointer-events:none}
.ch.nolim .tc .bw::after{display:none}
.tc.over .v{color:var(--fg);font-weight:600}
.tc.now .bw{background:color-mix(in srgb,var(--fg) 9%,transparent);box-shadow:0 2px 0 0 var(--fg)}
.tc.fut .b{display:none}
.ch-stat{grid-column:1;grid-row:3;font-size:14px;font-weight:500;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-num{grid-column:2;grid-row:2/4;align-self:end;justify-self:end;font-size:var(--numsz);color:var(--c);white-space:nowrap}
.ch-num.zero{color:var(--muted)}
.ovr{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.06em;padding:0 5px;margin-right:6px;background:var(--aon);color:var(--cb,var(--c));border-radius:1px}
/* over the limit: the whole channel inverts */
.ch.alarm{background:var(--cb,var(--c));color:var(--aon);--ink:var(--aon)}
button.ch.alarm:hover{background:var(--cb,var(--c));filter:brightness(1.06)}
.ch.alarm .ch-num,.ch.alarm .lim,.ch.alarm .lim b,.ch.alarm .u,.ch.alarm .ch-top .ic,.ch.alarm .tc .v,.ch.alarm .ch-lim2,.ch.alarm .ch-lim2 b{color:var(--aon)}
.ch.alarm .tc .bw::after{border-top-color:var(--aon);opacity:.8}
.ch.alarm .tc.now .bw{background:color-mix(in srgb,var(--aon) 12%,transparent);box-shadow:0 2px 0 0 var(--aon)}
.ch.alarm .tc .b{background:transparent;box-shadow:inset 0 0 0 2px var(--aon)}
/* no limit and nothing logged: collapse to one line */
.ch.strip{height:36px;grid-template-rows:1fr;padding:0 4px 0 10px;align-items:center}
.ch.strip .ch-top{grid-row:1}
.ch.strip .ch-top .u{overflow:hidden;text-overflow:ellipsis;min-width:0}
.lk{margin-left:auto;flex:none;min-height:34px;padding:0 8px;font-size:13px;font-weight:600;border-radius:2px;text-decoration:underline;text-underline-offset:3px}
.lk:hover{background:var(--well)}

/* annunciator (phone, pane view) */
.annun{display:none;flex:none;height:44px;gap:1px;grid-template-columns:repeat(var(--n),1fr);width:100%;background:var(--bg);border-radius:2px;overflow:hidden}
.an{display:flex;flex-direction:column;justify-content:center;padding:0 6px;background:var(--ch);min-width:0}
.an .lab{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an .num{font-size:20px;color:var(--c);white-space:nowrap}
.an.alarm{background:var(--cb,var(--c))}
.an.alarm .lab,.an.alarm .num{color:var(--aon)}

/* ---------- Log gadget: one keypad, neutral keys, coloured glyphs ---------- */
.log{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(44px,1fr));gap:1px;background:var(--bg);border-radius:2px;overflow:hidden}
.key{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:6px 10px;background:var(--ch);min-width:0;overflow:hidden;text-align:left}
.key:hover{background:var(--well)}
.key:active{background:var(--rule)}
.key .kt{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px;white-space:nowrap}
.key .kt .ic{color:var(--c)}
.key .kv{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.key .ku{font-size:13px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mic{touch-action:none;-webkit-touch-callout:none}
.mic .ic{color:var(--ai)}
.mic.held{background:var(--ai)!important;color:var(--on)}
.mic.held .ic,.mic.held .ku,.mic.held span{color:var(--on)}
.mic-row{display:none;grid-column:1/-1;flex-direction:row;align-items:center;justify-content:center;gap:10px}
.mic-row .kt2{font-weight:600;font-size:15px}

/* app dock (phone) */
.apps{flex:none;height:56px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.apps.has-mic{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.3fr)}
.appk.mic{background:var(--ch);font-weight:600;color:var(--fg)}
.appk.mic .ic{width:24px;height:24px}
.appk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;border-radius:2px}
.appk:hover{background:var(--ch)}
.appk .ic{color:var(--muted)}
.appk.open .ic{color:var(--fg)}
.appk.open::after{content:"";position:absolute;left:38%;right:38%;bottom:1px;height:2px;background:var(--fg)}
.appk .due{position:absolute;top:4px;left:calc(50% + 12px)}

/* ---------- confirmation line ---------- */
.toast{position:absolute;z-index:26;left:4px;right:4px;bottom:max(4px,env(safe-area-inset-bottom));height:56px;display:flex;align-items:center;gap:2px;padding:0 4px 0 12px;background:var(--fg);color:var(--bg);border-radius:2px;font-size:14px;font-weight:500}
.toast .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{min-height:40px;padding:0 10px;font-weight:600;text-decoration:underline;text-underline-offset:3px;border-radius:2px;white-space:nowrap}
.toast button:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
#app.has-tray .toast{display:none}
#app.si.view-home .toast{right:calc(8px + (100% - 24px) * .2453)} /* phone home: leave the talk key free */

/* ---------- phone tab strip ---------- */
.tabstrip{flex:none;display:none;gap:4px;height:52px;position:relative}
.ts-home{width:44px;flex:none;display:grid;place-items:center;background:var(--ch);border-radius:2px}
.ts-tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.ts-tab{position:relative;flex:0 0 auto;min-width:52px;display:flex;background:var(--ch);border-radius:2px}
.ts-tab.on{flex:1 1 auto;min-width:0;background:var(--rule)}
.ts-go{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:4px 10px}
.ts-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-t .n{font-family:'Barlow Condensed',sans-serif;color:var(--muted);margin-right:4px}
.ts-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-x{width:40px;flex:none;display:grid;place-items:center;color:var(--muted)}
.ts-x:hover{color:var(--fg)}
.ts-mic{width:66px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--ch);border-radius:2px;color:var(--ai);touch-action:none;-webkit-touch-callout:none}
.ts-mic .ku{font-size:12px;font-weight:600;line-height:1.05;text-align:center;color:var(--fg)}
.ts-mic.held{background:var(--ai);color:var(--on)}
.ts-mic.held .ku{color:var(--on)}

/* switcher list */
.switcher{position:absolute;left:4px;right:4px;bottom:calc(52px + 8px + env(safe-area-inset-bottom));z-index:22;background:var(--well);outline:4px solid var(--bg);border-radius:2px;padding:8px}
.switcher h2{margin:2px 4px 6px}
.sw-row{display:flex;gap:4px;margin-top:4px}
.sw-go{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;justify-content:center;padding:4px 12px;background:var(--ch);border-radius:2px}
.sw-go.on{background:var(--rule)}
.sw-go b{font-weight:600}
.sw-go span{font-size:13px;color:var(--muted)}
.sw-x{width:64px;flex:none;background:var(--ch);border-radius:2px;display:grid;place-items:center;font-size:14px}

/* ---------- panes ---------- */
.pane{display:none;flex-direction:column;min-width:0;min-height:0;background:var(--ch);border-radius:2px;overflow:hidden;container-type:inline-size}
@container (max-width: 380px){.ph-c[data-act="swap"],.ph-c[data-act="max"]{display:none!important}}
.pane.fade{animation:fade 100ms linear}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ph{flex:none;height:40px;display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
.ph-title{display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph-title .ic{color:var(--c)}
.ph-title .n,.ptab .n{font-family:'Barlow Condensed',sans-serif;color:var(--muted);font-weight:600}
.ph-tabs{display:flex;min-width:0;overflow:hidden}
.ptab{display:flex;align-items:center;gap:5px;padding:0 12px;font-size:14px;white-space:nowrap;color:var(--muted);position:relative}
.ptab.on{color:var(--fg);font-weight:600}
.ptab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--fg)}
.ph-sp{flex:1}
.ph-c{display:none;align-items:center;padding:0 10px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.ph-c:hover{color:var(--fg);background:var(--well)}
.pb{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;position:relative}
.empty{display:none;align-items:center;justify-content:center;background:var(--ch);border-radius:2px;color:var(--muted);padding:20px;text-align:center;font-size:15px}
.split-v,.split-h{display:none}

/* inner tabs, sections, rows */
.itabs{position:sticky;top:0;z-index:2;display:flex;background:var(--ch);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.itab{flex:1 0 auto;min-height:44px;padding:0 12px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.itab.on{color:var(--fg)}
.itab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--fg)}
.sec{padding:12px 12px 4px}
.sec-h{margin:0 0 8px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.row>span.grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);line-height:1.35}
p{margin:0 0 8px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:2px;background:var(--well);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--rule)}
.btn.pri{background:var(--bb,var(--c,var(--fg)));color:var(--on)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.line{background:transparent;outline:1px solid var(--rule);outline-offset:-1px}
.btn.line:hover{background:var(--well)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn[disabled],.btn.pri[disabled]{background:transparent;color:var(--fg);font-weight:500;outline:1px dashed var(--muted);outline-offset:-1px;cursor:not-allowed;filter:none}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap}
.tag.solid{background:var(--c);color:var(--on)}
.tag.hol{outline:1px solid var(--c);outline-offset:-1px;color:var(--c)}
.tag.plain{background:var(--well);color:var(--fg)}
.notice{display:block;width:100%;text-align:left;padding:12px;background:var(--well);border-radius:2px;margin:0 0 4px}
.notice .lab{color:var(--c)}
button.notice:hover{background:var(--rule)}
.seg{display:inline-flex;gap:2px;background:var(--bg);padding:2px;border-radius:2px;flex-wrap:wrap}
.seg button{min-height:40px;min-width:44px;padding:0 12px;border-radius:2px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-checked=true]{background:var(--ch);color:var(--fg);font-weight:600;outline:1px solid var(--fg);outline-offset:-1px}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600}
.sw .tr{width:38px;height:22px;border-radius:2px;background:var(--rule);position:relative;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--muted);border-radius:1px}
.sw[aria-checked=true] .tr{background:var(--fg)}
.sw[aria-checked=true] .tr::after{left:19px;background:var(--bg)}
input.tf,select.tf,textarea.tf{width:100%;min-height:44px;padding:8px 10px;background:var(--bg);border:0;border-bottom:2px solid var(--rule);border-radius:2px 2px 0 0;font-size:var(--fs)}
input.tf:focus,select.tf:focus,textarea.tf:focus{border-bottom-color:var(--fg)}
#frame input.tf:focus-visible,#frame select.tf:focus-visible,#frame .fld:focus-visible{outline:none}
.fl{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.frow{display:flex;gap:8px;align-items:flex-end}
.frow>*{flex:1;min-width:0}

/* chart */
.chart{position:relative;background:var(--well);border-radius:2px;padding:8px 6px 4px;margin:0 0 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:'Barlow Condensed',sans-serif;font-size:12px;fill:var(--muted)}
.chart .cap{font-size:13px;color:var(--muted);margin:4px 4px 2px}
.big-n{font-size:30px}
.itab-note{font-size:14px;color:var(--muted);margin:0}
.irow{padding:8px 0;border-bottom:1px solid var(--rule)}
.irow:last-child{border-bottom:0}
.irow .top{display:flex;align-items:baseline;gap:10px}
.irow svg{display:block;width:100%;height:12px;margin-top:6px}

/* pill identity */
.pill{flex:none;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:.02em;color:#3a3150;line-height:1}
.pill.oval{width:44px;height:24px;border-radius:50%;background:#D9CCEB}
.pill.round{width:26px;height:26px;border-radius:50%;background:#F4F4F1;outline:1px solid #b9b9b3;outline-offset:-1px;color:#555}

/* ---------- tray (quick entry, max half the screen) ---------- */
.tray{position:absolute;left:4px;right:4px;bottom:max(4px,env(safe-area-inset-bottom));z-index:20;height:50%;display:flex;flex-direction:column;background:var(--well);outline:4px solid var(--bg);border-radius:2px}
.tray.rise{animation:rise 150ms linear}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.tr-h{flex:none;display:flex;align-items:center;gap:6px;min-height:50px;padding:2px 4px 0 12px}
.tr-h>.ic{color:var(--c)}
.tr-h .tt{flex:1;min-width:0}
.tr-h .tt b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.tr-h .tt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-b{flex:1;min-height:0;overflow:auto;padding:0 12px 10px}
.fld{width:100%;min-height:50px;padding:4px 8px;background:var(--bg);border:0;border-bottom:3px solid var(--rule);border-radius:2px 2px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:32px;font-variant-numeric:tabular-nums;color:var(--fg)}
.fld.act,.fld:focus{border-bottom-color:var(--c);background:var(--ch)}
.fldl{display:block;font-size:13px;color:var(--muted);margin:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-sep{flex:0 0 auto!important;font-family:'Barlow Condensed',sans-serif;font-size:32px;color:var(--muted);padding-bottom:6px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.kp button{min-height:44px;background:var(--ch);border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.kp button.w{font-family:'Barlow',sans-serif;font-size:14px}
.kp button:hover{background:var(--rule)}
.kp button:active{background:var(--rule)}
.save{width:100%;margin-top:8px;min-height:48px;font-size:16px}
.conv{font-weight:600;font-size:17px;margin:0;line-height:1.2}
.ref{font-size:13px;color:var(--muted);margin:4px 0 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.preset{display:flex;flex-direction:column;justify-content:center;min-height:52px;padding:4px 10px;background:var(--ch);border-radius:2px;text-align:left;min-width:0}
.preset:hover{background:var(--rule)}
.preset .pt{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
.preset .pt .ic{color:var(--c)}
.preset .sc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset[aria-expanded=true]{outline:2px solid var(--fg);outline-offset:-2px}
.stepper{display:flex;gap:4px;align-items:stretch}
.stepper .btn{min-width:64px;font-family:'Barlow Condensed',sans-serif;font-size:18px}
.aib{color:var(--ai);outline:1px solid var(--ai);outline-offset:-1px;background:transparent}
.aib:hover{background:var(--well)}
.quiet{color:var(--muted);font-size:13px;margin-top:8px}
.saved{font-size:14px;margin:8px 0 0;color:var(--muted)}
.linkbtn{min-height:36px;padding:0 2px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;gap:4px}

/* ---------- popover / sheets ---------- */
.pop{position:absolute;z-index:40;top:calc(40px + env(safe-area-inset-top));right:4px;width:280px;background:var(--well);outline:4px solid var(--bg);border-radius:2px;padding:6px}
.pop.left{right:auto;left:4px}
.pop .it{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border-radius:2px;font-size:15px}
.pop .it:hover{background:var(--ch)}
.pop .hd{padding:8px 10px 8px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.sheet{position:absolute;z-index:30;top:calc(40px + env(safe-area-inset-top));left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg)}

  for(const r of (byDay().get(iso)||[]))v+=contrib(r)[d]||0;
  return d==='alcohol'?Math.round(v*10)/10:Math.round(v);}
function lim(d){const v=+S.settings.limits[d];return v>0?v:0;}
function domains(){const a=['water','sodium'];if(S.settings.trackers.sugar)a.push('sugar');a.push('caffeine','alcohol');if(S.settings.trackers.potassium)a.push('potassium');return a;}
function weekSum(d){return Math.round(weekDates().reduce((a,i)=>a+(dayVal(d,i)||0),0)*10)/10;}
/* one number per domain: the limit. Over it = the channel inverts. Alcohol also has a weekly limit. */
function chInfo(d){const v=dayVal(d,NOW_ISO);const L=lim(d);let st=L?(v>L?'alarm':'ok'):'none';let wk=null,WL=0;
  if(d==='alcohol'){WL=lim('alcoholWeek');wk=weekSum('alcohol');if(WL&&wk>WL)st='alarm';else if(st==='none'&&WL)st='ok';}
  return{v,L,st,wk,WL};}
function dayOver(d,x){const L=lim(d);return !!(L&&x!=null&&x>L);}
function statusText(d,I){const f=DM[d].fmt,u=DM[d].unit,A=DM[d].aria;
  if(I.st==='none')return{short:'No limit set',long:'no limit set'};
  if(d==='alcohol'){
    const wk=I.WL?`week ${f(I.wk)} of ${f(I.WL)}`:'';
    if(I.st==='alarm'){if(I.L&&I.v>I.L)return{short:`by ${f(I.v-I.L)} today${wk?' · '+wk:''}`,long:`over today’s limit by ${f(I.v-I.L)} standard drinks${wk?', '+wk:''}`};
      return{short:`this week · ${wk}`,long:`over the weekly limit, ${wk}`};}
    const today=I.L?(I.v?`${f(I.L-I.v)} left today`:`none today`):'';
    return{short:[today,wk].filter(Boolean).join(' · '),long:[today,wk].filter(Boolean).join(', ')};}
  if(I.st==='alarm')return{short:`by ${f(I.v-I.L)} ${u}`,long:`over the limit by ${f(I.v-I.L)} ${A}`};
  const near=I.v>=0.9*I.L?' · near the limit':'';
  return{short:`${f(I.L-I.v)} ${u} left${near}`,long:`${f(I.L-I.v)} ${A} left${near?', near the limit':''}`};}
function limText(d,I){const f=DM[d].fmt;if(d==='alcohol'){const p=[];if(I.L)p.push(`<b>${f(I.L)}</b> a day`);if(I.WL)p.push(`<b>${f(I.WL)}</b> a week`);return p.length?'Limit '+p.join(' · '):'No limit set';}
  return I.L?`Limit <b>${f(I.L)}</b> ${DM[d].unit} a day`:'No limit set';}
function sodiumOf(src,unit,amt){const a=parseFloat(amt);if(!(a>0))return 0;const g=unit==='g'?a:a/1000;return Math.round(src==='salt'?g*393:src==='msg'?g*123:g*1000);}
function srcName(s){return s==='salt'?'salt':s==='msg'?'MSG':'sodium';}
function lastOf(type){const r=S.records.filter(x=>x.type===type).sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time));return r[r.length-1];}
function whenTxt(r){return(r.day===NOW_ISO?'today':dlabel(r.day))+' '+tm(r.time);}
function domOfRec(r){switch(r.type){case'water':return'water';case'drink':return r.std?'alcohol':r.caffeine?'caffeine':'water';case'food':return'sodium';case'bp':return'bp';case'weight':return'weight';default:return'bath';}}
function recDesc(r){switch(r.type){
  case'water':return`Water · ${fi(r.ml)} ml`;
  case'drink':{let s=`${r.name} · ${fi(r.ml)} ml`;if(r.caffeine)s+=` · ${r.caffeine} mg caffeine`;if(r.std)s+=` · ${r.std.toFixed(1)} standard drinks`;if(r.sugar)s+=` · ${r.sugar} g sugar`;return s;}
  case'food':{let s=`${r.desc||'Food'} · `;s+=r.src&&r.src!=='sodium'?`${r.amt} ${r.unit} ${srcName(r.src)} = ${fi(r.sodium)} mg sodium`:`${fi(r.sodium)} mg sodium`;if(r.sugar)s+=` · ${r.sugar} g sugar`;return s;}
  case'bp':return`BP ${r.sys}/${r.dia}${r.hr?` · pulse ${r.hr}`:''} · ${r.pos.toLowerCase()}, ${r.arm.toLowerCase()} arm${r.irregular?' · irregular heartbeat':''}${r.note?` · “${r.note}”`:''}`;

function defaultWinState(k){switch(k){
  case'medications':return{tab:'schedule',skipFor:'',stockEdit:'',stockMode:'',stockVal:''};
  case'metrics':return{range:'30d'};
  case'history':return{filter:'all',edit:'',ev:{}};
  default:return{};}}
function win(id){return S.wins.find(w=>w.id===id);}
function tileOf(id){return S.tiles.findIndex(t=>t.wins.includes(id));}
function openWin(kind,init){
  let w=win(kind);
  if(w){if(init)Object.assign(w.st,init);focusWin(kind);return w;}
  if(S.wins.length>=6){toast('Six panes are open. Close one to open another.');return null;}
  w={id:kind,kind,st:Object.assign(defaultWinState(kind),init||{})};S.wins.push(w);
  if(S.tiles.length<3)S.tiles.push({wins:[w.id],active:w.id});
  else{const t=S.tiles[2];t.wins.push(w.id);t.active=w.id;}
  S.max=null;S.phoneView=w.id;S.switcher=false;anim.pane=w.id;
  if(S.tray&&!isWide())S.tray=null;
  return w;}
function focusWin(id){const ti=tileOf(id);if(ti<0)return;S.tiles[ti].active=id;if(S.max!=null&&S.max!==ti)S.max=null;S.phoneView=id;S.switcher=false;anim.pane=id;if(S.tray&&!isWide())S.tray=null;}
function closeWin(id){const i=S.wins.findIndex(w=>w.id===id);if(i<0)return;S.wins.splice(i,1);
  const ti=tileOf(id);if(ti>=0){const t=S.tiles[ti];t.wins=t.wins.filter(x=>x!==id);if(!t.wins.length){S.tiles.splice(ti,1);if(S.max!=null)S.max=null;}else if(t.active===id)t.active=t.wins[t.wins.length-1];}
  if(S.max!=null&&S.max>=S.tiles.length)S.max=null;
  if(S.phoneView===id){const nx=S.wins[Math.min(i,S.wins.length-1)];S.phoneView=nx?nx.id:'home';}
  if(!S.wins.length)S.switcher=false;}
function winTitle(w){return APPS[w.kind].title;}
function winShort(w){return APPS[w.kind].short;}
function winColor(w){return cv(APPS[w.kind].c);}
function winState(w){const st=w.st;switch(w.kind){

function bpIn(days){const set=new Set(days);return S.records.filter(r=>r.type==='bp'&&set.has(dayOf(r))).sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time));}
function bpAvg(days){const b=bpIn(days);if(!b.length)return{txt:'—',n:0};const s=Math.round(b.reduce((a,r)=>a+r.sys,0)/b.length),d=Math.round(b.reduce((a,r)=>a+r.dia,0)/b.length);return{txt:`${s}/${d}`,n:b.length,s,d};}

function render(){
  IDX=null;
  const app=$('#app'),frame=$('#frame');
  const ae=document.activeElement;let fk=null,sel=null;
  if(ae&&app.contains(ae)&&ae!==app){fk=focusKey(ae);try{if(typeof ae.selectionStart==='number')sel=[ae.selectionStart,ae.selectionEnd];}catch(e){}}
  const theme=S.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.theme;
  frame.className=`theme-${theme}${S.settings.bigText?' big':''}${S.settings.reduceMotion?' rm':''}`;
  $('#stage').className='vp-'+S.vp;
  const pv=S.phoneView!=='home'&&win(S.phoneView)?'view-pane':'view-home';
  if(pv==='view-home')S.phoneView='home';
  app.className=`${pv}${S.tray?' has-tray':''}${S.wins.length?' has-wins':''}${S.signedIn?' si':' so'}`;
  app.innerHTML=sysbar()+`<div class="body">${colHTML()}${workHTML()}${tabstripHTML()}${trayHTML()}${switcherHTML()}${toastHTML()}</div>${popHTML()}${sheetHTML()}`;
  placeTray();
  app.querySelectorAll('[data-scroll]').forEach(el=>{const v=scrolls[el.dataset.scroll];if(v){el.scrollTop=v.t||0;el.scrollLeft=v.l||0;}});
  let target=null;
  if(focusNext){target=app.querySelector(focusNext);focusNext=null;}
  else if(fk){target=app.querySelector(fk);}
  if(target){target.focus({preventScroll:true});if(sel&&target.setSelectionRange){try{target.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
  anim={};
  save();renderHarness();
}
/* phone: the tray's top edge sits on the first channel boundary at or below half height, so no channel is cut */
function placeTray(){const tr=$('#app .tray');if(!tr)return;if(isWide()){tr.style.height='';return;}
  const body=$('#app .body').getBoundingClientRect();const half=body.top+body.height*0.5;
  const bounds=[...document.querySelectorAll('#app .today .ch')].map(c=>c.getBoundingClientRect().bottom).filter(y=>y>0);
  let b=bounds.filter(y=>y>=half-1).sort((x,y)=>x-y)[0];
  if(b==null){const lg=$('#app .log');b=lg&&lg.getBoundingClientRect().top>0?lg.getBoundingClientRect().top-4:half;}
  const bottomPad=parseFloat(getComputedStyle(tr).bottom)||4;
  tr.style.height=Math.max(220,Math.round(body.bottom-bottomPad-(b+4)))+'px';}
function focusKey(el){if(el.id)return'#'+CSS.escape(el.id);
  const a=el.closest('[data-act]');if(a){let k=`[data-act="${a.dataset.act}"]`;if(a.dataset.arg!=null)k+=`[data-arg="${CSS.escape(a.dataset.arg)}"]`;return k;}
  if(el.dataset&&el.dataset.split)return`[data-split="${el.dataset.split}"]`;return null;}

/* ---------- left column: monitor, annunciator, log keypad, app dock ---------- */
function colHTML(){return`<div class="col">${annunHTML()}${todayHTML()}${logHTML()}${appsHTML()}</div>`;}
function todayHTML(){
  const days=weekDates();const ds=domains();
  const head=`<div class="th chrome" aria-hidden="true"><div class="days">${days.map(i=>`<span class="lab mut${i===NOW_ISO?' t':''}">${dow(i)}</span>`).join('')}</div><div class="tl lab">Today</div></div>`;
  const chs=ds.map(d=>{
    const I=chInfo(d);const tx=statusText(d,I);const L=I.L;
    const vals=days.map(i=>dayVal(d,i));
    if(I.st==='none'&&!vals.some(x=>x>0)){

function doseRow(d,w){const D=DRUGS[d.drug];const dose=d.drug==='bisoprolol'?bisoDose():D.dose;
  let right='';
  if(d.status==='taken')right=`<span class="tag solid" style="--c:var(--meds)">Taken ${tm(d.at)}</span>`;
  else if(d.status==='skipped')right=`<span class="tag hol" style="--c:var(--muted)">Skipped · ${esc(d.reason)}</span>`;
  else if(d.status==='missed')right=`<span class="tag plain">Missed</span>`;
  else right=`<span class="btns"><button class="btn pri sm" style="--c:var(--meds)" data-act="take" data-arg="${d.id}" aria-label="Take ${D.name} ${dose} now">Take</button><button class="btn sm line" data-act="skip" data-arg="${d.id}" aria-expanded="${w.st.skipFor===d.id}">Skip</button></span>`;
  const reasons=w.st.skipFor===d.id?`<div class="btns" style="padding:0 0 10px" role="group" aria-label="Skip reason">${SKIP_REASONS.map(r=>`<button class="btn sm line" data-act="skipReason" data-arg="${d.id}|${r}">${r}</button>`).join('')}</div>`:'';
  return`<div class="row"><div class="grow"><b>${D.name}</b><div class="sub">${D.generic} · ${dose}${D.note?' · '+D.note:''}${d.status==='due'?' · due':''}</div></div>${right}</div>${reasons}`;}
function medsBody(w){const st=w.st;const M=S.meds;
  const tabs=['schedule','prescriptions','stock','titrations'];
  let h=`<div class="itabs chrome" role="tablist" aria-label="Medications sections">${tabs.map(t=>`<button role="tab" aria-selected="${t===st.tab}" class="itab${t===st.tab?' on':''}" data-act="wset" data-arg="medications|tab|${t}">${cap(t)}${t==='titrations'&&M.titration==='ready'?' <span class="due" aria-label="1 ready">1 ready</span>':''}</button>`).join('')}</div>`;
  let b='';
  if(st.tab==='schedule'){
    const by=t=>M.doses.filter(d=>d.time===t);
    b+=M.titration==='ready'?`<div class="sec" style="padding-bottom:0"><button class="notice" style="--c:var(--meds)" data-act="wset" data-arg="medications|tab|titrations"><span class="lab">Ready to start</span><div style="font-weight:600;margin-top:2px">Bisoprolol step-up to 5 mg</div><div class="sub">Planned for today · open Titrations to start it</div></button></div>`:'';
    b+=`<div class="sec"><h3 class="lab sec-h">Today · Sun 27 Sep</h3>
      ${['08:00','20:00'].map(t=>`<div style="display:flex;gap:12px"><div class="num" style="font-size:26px;width:58px;padding-top:12px;color:var(--meds)">${tm(t)}</div><div class="grow">${by(t).map(d=>doseRow(d,w)).join('')}</div></div>`).join('')}</div>
      <div class="sec"><h3 class="lab sec-h">Recent</h3>${M.recent.map(r=>{const D=DRUGS[r.drug];const tag=r.status==='taken'?`<span class="tag solid" style="--c:var(--meds)">Taken ${tm(r.at)}</span>`:r.status==='missed'?`<span class="tag plain">Missed</span>`:`<span class="tag hol" style="--c:var(--muted)">Skipped · ${r.reason}</span>`;
        return`<div class="row"><span class="num" style="font-size:17px;width:92px">${r.when} ${tm(r.time)}</span><span class="grow">${D.name.split(' (')[0]}</span>${tag}</div>`;}).join('')}</div>`;}
  if(st.tab==='prescriptions'){b+=`<div class="sec"><h3 class="lab sec-h">Active prescriptions · 2</h3>
    <div class="row"><div class="grow"><b>Sacubitril/Valsartan</b><div class="sub">Entresto 49/51 mg · for heart failure (HFrEF)</div><div class="sub">2× daily · ${tm('08:00')} and ${tm('20:00')} · 1 tablet (100 mg)</div></div><span class="tag hol" style="--c:var(--meds)">Maintenance</span></div>
    <div class="row"><div class="grow"><b>Bisoprolol</b><div class="sub">Concor ${bisoDose()} · for heart failure / rate control</div><div class="sub">1× daily · ${tm('08:00')} · after food</div></div><span class="tag hol" style="--c:var(--meds)">${M.titration==='started'?'Titration step 2':'Titrating'}</span></div></div>`;}
  if(st.tab==='stock'){const rows=[['entresto','Entresto 49/51 mg','oval','NVR<br>L1','oval, pale violet, “NVR / L1”',2],['concor','Concor 2.5 mg','round','','round, white',1]];
    b+=`<div class="sec"><h3 class="lab sec-h">Stock on hand</h3>${rows.map(([k,n,shape,mark,idt,perDay])=>{const c=M.stock[k];const days=Math.floor(c/perDay);const low=days<=10;const ed=st.stockEdit===k;
      return`<div class="row" style="flex-wrap:wrap"><span class="pill ${shape}" role="img" aria-label="Pill: ${idt}">${mark}</span><div class="grow"><b>${n}</b><div class="sub">${idt} · ${perDay} a day</div></div>
        <div style="text-align:right"><div><span class="num" style="font-size:28px">${c}</span> <span class="sc mut">left</span></div><div class="sub">about ${days} days</div></div>
        <div style="width:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:4px">${low?`<span class="tag hol" style="--c:var(--meds)">Refill soon</span>`:''}<span class="ph-sp"></span>
        ${ed?`<label class="sr" for="stk-${k}">${st.stockMode==='refill'?'Tablets added':'Correct count'}</label><input id="stk-${k}" class="tf" style="width:90px" inputmode="numeric" data-bind="w:medications.stockVal" value="${esc(st.stockVal)}"><button class="btn sm pri" style="--c:var(--meds)" data-act="stockSave" data-arg="${k}">${st.stockMode==='refill'?'Add tablets':'Set count'}</button><button class="btn sm line" data-act="stockCancel">Cancel</button>`
          :`<button class="btn sm line" data-act="stockOpen" data-arg="${k}|refill">Log refill</button><button class="btn sm line" data-act="stockOpen" data-arg="${k}|correct">Correct count</button>`}</div></div>`;}).join('')}</div>`;}
  if(st.tab==='titrations'){const t=M.titration;let card='';
    if(t==='ready')card=`<div class="notice" style="--c:var(--meds)" role="region" aria-label="Titration ready to start"><span class="lab">Ready to start</span><p style="font-size:18px;font-weight:600;margin:4px 0">Bisoprolol step-up to 5 mg</p><p>Planned for today. Your current doses stay in effect until you start it.</p><div class="btns"><button class="btn pri" style="--c:var(--meds)" data-act="titr" data-arg="start">Start now</button><button class="btn line" data-act="titr" data-arg="notnow">Not now</button></div></div>`;
    if(t==='confirm')card=`<div class="notice" style="--c:var(--meds)" role="region" aria-label="Confirm titration start"><span class="lab">Confirm start</span><p style="font-size:18px;font-weight:600;margin:4px 0">Start Bisoprolol 5 mg from today?</p><p>Bisoprolol changes from 2.5 mg to 5 mg once daily. Your next dose, Mon ${tm('08:00')}, will be 5 mg. Today’s 2.5 mg dose stays logged.</p><div class="btns"><button class="btn pri" style="--c:var(--meds)" data-act="titr" data-arg="confirm">Confirm start</button><button class="btn line" data-act="titr" data-arg="back">Back</button></div></div>`;
    if(t==='started')card=`<div class="notice" style="--c:var(--meds)"><span class="lab">Started</span><p style="font-size:18px;font-weight:600;margin:4px 0">Bisoprolol 5 mg once daily</p><p>Started Sun 27 Sep ${tm(NOW_T)}. First 5 mg dose Mon ${tm('08:00')}, after food.</p></div>`;
    if(t==='snoozed')card=`<div class="notice" style="--c:var(--muted)"><span class="lab">Not started</span><p style="margin:4px 0">Bisoprolol step-up to 5 mg is still planned. Your current 2.5 mg dose stays in effect.</p><button class="btn line sm" data-act="titr" data-arg="again">Show the prompt again</button></div>`;
    b+=`<div class="sec">${card}</div><div class="sec"><h3 class="lab sec-h">Plan · Bisoprolol (Concor)</h3>
      <div class="row"><span class="num" style="width:60px;font-size:18px">Step 1</span><span class="grow">2.5 mg once daily</span><span class="tag ${t==='started'?'plain':'solid'}" style="--c:var(--meds)">${t==='started'?'Done':'Current'}</span></div>
      <div class="row"><span class="num" style="width:60px;font-size:18px">Step 2</span><span class="grow">5 mg once daily · planned 27 Sep</span><span class="tag ${t==='started'?'solid':'hol'}" style="--c:var(--meds)">${t==='started'?'Current':'Planned'}</span></div></div>
      <div class="sec"><h3 class="lab sec-h">Warning signs · contact your doctor</h3>
      <div class="row"><span class="grow">Resting pulse below 50</span><span class="sub">last pulse ${lastOf('bp')?.hr||'—'}</span></div>
      <div class="row"><span class="grow">Dizziness or fainting</span></div>
      <div class="row"><span class="grow">Weight gain over 2 kg in 3 days</span><span class="sub">last ${lastOf('weight')?.kg.toFixed(2)} kg</span></div></div>`;}
  return h.replace('<div class="itabs','<div class="pb" data-scroll="medications:'+st.tab+'" data-swipe="1"><div class="itabs')+b+'</div>';}

/* ---------- Metrics: what the Home gadget can't show (BP/weight trends, 30/90 days, links) ---------- */
function metricsBody(w){const r=w.st.range;const days=rangeDays(r);const dd=days.filter(hasData);
  const seg2=`<div class="itabs chrome" role="radiogroup" aria-label="Range">${['7d','30d','90d'].map(x=>`<button role="radio" aria-checked="${x===r}" class="itab${x===r?' on':''}" data-act="wset" data-arg="metrics|range|${x}">${rangeName(x)}</button>`).join('')}</div>`;
  const b=`<div class="sec" style="padding-bottom:0"><p class="itab-note">Trends for the last ${rangeName(r)} (${dmon(days[0])} – ${dmon(NOW_ISO)}). Today and this week are on Home.</p></div>
    <div class="sec"><h3 class="lab sec-h"><span>Blood pressure</span><span>mmHg</span></h3>${chartBP(days)}</div>
    <div class="sec"><h3 class="lab sec-h"><span>Weight</span><span>kg</span></h3>${chartWeight(days)}</div>
    <div class="sec"><h3 class="lab sec-h"><span>Intake · daily average</span><span>${dd.length} days</span></h3>${intakeTable(days)}</div>
    <div class="sec"><h3 class="lab sec-h">Links between records</h3>${corrRows(days)}</div>
    <div class="sec">${S.signedIn?aiInsights(days):`<p class="quiet">Sign in to use AI features</p>`}</div>`;
  return`<div class="pb" data-scroll="metrics:${r}" data-swipe="1">${seg2}${b}</div>`;}
function xLabels(days,X,H){const n=days.length;const every=n<=7?1:n<=30?7:14;return days.map((iso,i)=>(n-1-i)%every===0?`<text class="ax" x="${X(i)}" y="${H-5}" text-anchor="middle">${n<=7?dow(iso)+' '+dnum(iso):dmon(iso)}</text>`:'').join('');}
function chartBP(days){const W=340,H=176,l=30,rt=6,t=12,bt=20,pw=W-l-rt,ph=H-t-bt;const n=days.length;const lo=60,hi=140;const Y=v=>t+ph*(1-(v-lo)/(hi-lo));const X=i=>l+pw*(i+.5)/n;
  const rs=bpIn(days);const sz=n<=7?8:n<=30?6:4;let m='';const flagged=[];
  rs.forEach(r=>{const i=days.indexOf(dayOf(r));const same=rs.filter(x=>dayOf(x)===dayOf(r));const k=same.indexOf(r);const x=X(i)+(k-(same.length-1)/2)*(sz+2);
    m+=`<line x1="${x}" x2="${x}" y1="${Y(r.sys)}" y2="${Y(r.dia)}" style="stroke:var(--bp)" stroke-width="${n<=30?2:1.5}"/><rect x="${x-sz/2}" y="${Y(r.sys)-sz/2}" width="${sz}" height="${sz}" style="fill:var(--bp)"/><rect x="${x-sz/2+.75}" y="${Y(r.dia)-sz/2+.75}" width="${sz-1.5}" height="${sz-1.5}" style="fill:var(--well);stroke:var(--bp)" stroke-width="1.5"/>`;
    if(r.irregular){m+=`<text class="ax" x="${x}" y="${Y(r.sys)-sz}" text-anchor="middle" style="fill:var(--fg);font-weight:600">▲</text>`;flagged.push(r);}});
  const ticks=[60,80,100,120,140].map(v=>`<text class="ax" x="${l-4}" y="${Y(v)+4}" text-anchor="end">${v}</text><line x1="${l}" x2="${W-rt}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--rule)"/>`).join('');
  const a=bpAvg(days);const hiR=rs.slice().sort((x,y)=>y.sys-x.sys)[0];
  const aria=`Blood pressure, ${rs.length} readings over ${n} days, average ${a.s} over ${a.d}${hiR?`, highest ${hiR.sys} over ${hiR.dia} on ${dlabel(hiR.day)}`:''}`;
  return`<figure class="chart" style="margin:0"><div style="display:flex;gap:14px;align-items:baseline;margin:0 4px 6px;flex-wrap:wrap"><span><span class="num big-n" style="color:var(--bp)">${a.txt}</span> <span class="sub">average of ${rs.length} readings</span></span>${hiR?`<span class="sub">highest ${hiR.sys}/${hiR.dia} · ${dlabel(hiR.day)}</span>`:''}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${ticks}${m}${xLabels(days,X,H)}</svg>
    <figcaption class="cap">Filled square = top number (systolic) · hollow = bottom (diastolic)${flagged.length?' · ▲ = irregular heartbeat noted':''}</figcaption>
    ${flagged.slice(-2).map(r=>`<figcaption class="cap">▲ ${dlabel(r.day)} ${tm(r.time)} · ${r.pos.toLowerCase()} · ${r.sys}/${r.dia}${r.note?` · “${esc(r.note)}”`:''}</figcaption>`).join('')}</figure>`;}
function chartWeight(days){const W=340,H=140,l=40,rt=6,t=12,bt=20,pw=W-l-rt,ph=H-t-bt;const rs=wtIn(days);if(!rs.length)return'<p class="sub">No weigh-ins in this range.</p>';const n=days.length;
  const lo=Math.min(...rs.map(r=>r.kg))-0.15,hi=Math.max(...rs.map(r=>r.kg))+0.15;const Y=v=>t+ph*(1-(v-lo)/(hi-lo));const X=i=>l+pw*(i+.5)/n;const XR=r=>X(days.indexOf(dayOf(r)));
  const path=rs.map((r,i)=>`${i?'L':'M'}${XR(r).toFixed(1)},${Y(r.kg).toFixed(1)}`).join(' ');
  const tv=[lo+0.05,(lo+hi)/2,hi-0.05];const ticks=tv.map(v=>`<text class="ax" x="${l-4}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(1)}</text><line x1="${l}" x2="${W-rt}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--rule)"/>`).join('');
  const ch=rs[rs.length-1].kg-rs[0].kg;let jump=0;rs.forEach(r=>{const prev=rs.filter(x=>x.day<r.day&&x.day>=addDays(r.day,-3));prev.forEach(p=>{jump=Math.max(jump,r.kg-p.kg);});});
  const sq=n<=30?7:5;
  return`<figure class="chart" style="margin:0"><div style="display:flex;gap:14px;align-items:baseline;margin:0 4px 6px;flex-wrap:wrap"><span><span class="num big-n" style="color:var(--weight)">${rs[rs.length-1].kg.toFixed(2)}</span> <span class="sub">kg now</span></span><span class="sub">${ch>=0?'+':'−'}${Math.abs(ch).toFixed(2)} kg over ${rangeName(w0(days))} · largest 3-day rise ${jump.toFixed(2)} kg${jump>2?' ▲ over 2 kg':' (warning at 2 kg)'}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight, ${rs.length} weigh-ins, from ${rs[0].kg.toFixed(2)} to ${rs[rs.length-1].kg.toFixed(2)} kilograms">${ticks}<path d="${path}" fill="none" style="stroke:var(--weight)" stroke-width="1.5"/>${rs.map(r=>`<rect x="${XR(r)-sq/2}" y="${Y(r.kg)-sq/2}" width="${sq}" height="${sq}" style="fill:var(--weight)"/>`).join('')}${xLabels(days,X,H)}</svg></figure>`;}
function w0(days){return days.length===7?'7d':days.length===30?'30d':'90d';}
function intakeTable(days){const dd=days.filter(hasData);if(!dd.length)return'<p class="sub">No intake recorded in this range.</p>';
  const rows=domains().filter(d=>d!=='potassium'||lim(d)).map(d=>{const vals=days.map(i=>hasData(i)?dayVal(d,i):null);const tot=vals.reduce((a,v)=>a+(v||0),0);const avg=tot/dd.length;const L=lim(d);const over=vals.filter(v=>dayOver(d,v)).length;
    const n=days.length,cw=340/n;const cells=vals.map((v,i)=>`<rect x="${(i*cw+(n<=30?1:0.3)).toFixed(2)}" y="0" width="${Math.max(1,cw-(n<=30?2:0.6)).toFixed(2)}" height="12" style="fill:${v==null?'transparent':dayOver(d,v)?cv(d):'var(--rule)'}"/>`).join('');
    return`<div class="irow"><div class="top"><span class="grow"><b>${DM[d].name}</b> <span class="sub">${L?`${over} of ${dd.length} days over the ${DM[d].fmt(L)} ${DM[d].unit} limit`:'no limit set'}</span></span><span><span class="num" style="font-size:24px;color:${cv(d)}">${d==='alcohol'?avg.toFixed(1):fi(avg)}</span> <span class="sub">${DM[d].unit} a day</span></span></div>
      <svg viewBox="0 0 340 12" preserveAspectRatio="none" role="img" aria-label="${DM[d].name}: ${over} of ${dd.length} days over the limit">${cells}</svg></div>`;}).join('');
  return rows+`<p class="cap sub" style="margin-top:6px">Each strip is one square per day, oldest on the left. Coloured = a day over the limit.</p>`;}
function mornings(days){const m={};bpIn(days).forEach(r=>{const d=dayOf(r);if(!m[d])m[d]=r;});return m;}
function corrRows(days){const m=mornings(days);const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const split=pred=>{const a=[],b=[];for(const[iso,r]of Object.entries(m)){const p=addDays(iso,-1);if(!hasData(p))continue;(pred(p)?a:b).push(r.sys);}return{a,b};};
  const row=(title,s,la,lb)=>{if(s.a.length<3||s.b.length<3)return`<div class="row"><span class="grow"><b>${title}</b><div class="sub">Not enough readings in ${rangeName(w0(days))} to compare (needs 3 mornings of each). Try 30 or 90 days.</div></span></div>`;
    const da=avg(s.a),db=avg(s.b);return`<div class="row"><span class="grow"><b>${title}</b><div class="sub">Mornings after ${la}: top number averaged <b style="color:var(--fg)">${Math.round(da)}</b>, against <b style="color:var(--fg)">${Math.round(db)}</b> after ${lb} (${s.a.length} and ${s.b.length} readings). ${Math.abs(da-db)>=3?'A difference worth mentioning to your doctor.':'No clear difference.'}</div></span></div>`;};
  const cf=split(p=>dayVal('caffeine',p)>200),al=split(p=>dayVal('alcohol',p)>0);
  const L=lim('sodium');const wts=wtIn(days);const up=[],dn=[];for(let i=1;i<wts.length;i++){const p=addDays(dayOf(wts[i]),-1);const dlt=wts[i].kg-wts[i-1].kg;(L&&dayVal('sodium',p)>L?up:dn).push(dlt);}
  const wrow=up.length>=3&&dn.length>=3?`<div class="row"><span class="grow"><b>Sodium and weight</b><div class="sub">After a day over the sodium limit, weight changed by <b style="color:var(--fg)">${avg(up)>=0?'+':'−'}${Math.abs(avg(up)).toFixed(2)} kg</b> on average, against <b style="color:var(--fg)">${avg(dn)>=0?'+':'−'}${Math.abs(avg(dn)).toFixed(2)} kg</b> otherwise (${up.length} and ${dn.length} weigh-ins).</div></span></div>`
    :`<div class="row"><span class="grow"><b>Sodium and weight</b><div class="sub">Not enough weigh-ins in this range to compare.</div></span></div>`;
  return row('Caffeine and blood pressure',cf,'more than 200 mg caffeine','less')+row('Alcohol and blood pressure',al,'any alcohol','none')+wrow;}
function aiInsights(days){const wk=weekDates().filter(i=>i<=NOW_ISO);const L=lim('sodium');const ov=wk.filter(i=>dayOver('sodium',dayVal('sodium',i))).length;const mx=wk.reduce((a,i)=>dayVal('sodium',i)>dayVal('sodium',a)?i:a,wk[0]);const cf=corrRowsPlain(days);
  return`<h3 class="lab sec-h" style="color:var(--ai)"><span style="display:flex;gap:6px;align-items:center">${ic('ai','ic-s')}AI summary</span></h3>
  <div class="notice"><p style="margin:0 0 4px">${L?`Sodium was over the ${fi(L)} mg limit on ${ov} of ${wk.length} days this week; ${dow(mx)} reached ${fi(dayVal('sodium',mx))} mg.`:'No sodium limit is set.'} ${cf}</p><p class="sub" style="margin:0">From your records only. Not medical advice.</p></div>`;}
function corrRowsPlain(days){const m=mornings(days);const a=[],b=[];for(const[iso,r]of Object.entries(m)){const p=addDays(iso,-1);if(!hasData(p))continue;(dayVal('sodium',p)>(lim('sodium')||1e9)?a:b).push(r.sys);}
  if(a.length<3||b.length<3)return'';const av=x=>Math.round(x.reduce((s,y)=>s+y,0)/x.length);return`Morning top numbers ran ${av(a)} after high-sodium days and ${av(b)} after the others.`;}

/* ---------- History ---------- */
const EDIT_FIELDS={water:[['ml','Millilitres']],drink:[['ml','Millilitres'],['sugar','Sugar, g']],food:[['sodium','Sodium, mg'],['sugar','Sugar, g']],bp:[['sys','Top'],['dia','Bottom'],['hr','Pulse']],weight:[['kg','Kilograms']],wee:[['note','Note']],bowel:[['note','Note']]};
function historyBody(w){const f=w.st.filter;const F=['all','water','sodium','sugar','caffeine','alcohol','food','bp','weight','wee','bowel'];
  const chips=`<div class="chips chrome" role="group" aria-label="Filter by type" data-scroll="history-chips" data-noswipe="1">${F.map(x=>`<button class="chip" aria-pressed="${x===f}" data-act="wset" data-arg="history|filter|${x}">${x==='all'?'All':histName(x)}</button>`).join('')}</div>`;
  const recs=histRecords(f).slice().sort((a,b)=>(dayOf(b)+b.time).localeCompare(dayOf(a)+a.time));
  const groups={};recs.forEach(r=>{(groups[dayOf(r)]=groups[dayOf(r)]||[]).push(r);});
  let body=Object.keys(groups).sort().reverse().map(iso=>`<div class="sec" style="padding-top:10px"><h3 class="lab sec-h"><span>${dlabel(iso)}${iso===NOW_ISO?' · today':''}</span><span>${groups[iso].length} record${groups[iso].length===1?'':'s'}</span></h3>${groups[iso].map(r=>histRow(r,w)).join('')}</div>`).join('');
  if(!recs.length)body=`<div class="sec"><p class="mut">No ${histName(f).toLowerCase()} records yet.</p></div>`;
  return`<div class="pb" data-scroll="history:${f}" data-swipe="1">${chips}<div class="sec" style="padding-bottom:0"><div class="btns" style="align-items:center"><span class="sub grow">${recs.length} records · ${f==='all'?'everything':histName(f)} · tap a record to edit or delete it</span><button class="btn sm line" data-act="exportCsv">Export CSV</button></div></div>${body}</div>`;}
function histRow(r,w){const d=domOfRec(r);const ed=w.st.edit===r.id;const g=d==='bath'?'bath':d;
  const row=`<button class="hrow" style="${cs(d)}" data-act="hedit" data-arg="${r.id}" aria-expanded="${ed}" aria-label="${esc(recDesc(r))} at ${r.time}. ${ed?'Close editor':'Edit or delete'}">${ic(g)}<span class="t">${tm(r.time)}</span><span class="grow">${esc(recDesc(r))}</span>${ic(ed?'chev':'right','ic-s chev')}</button>`;
  if(!ed)return row;
  const ev=w.st.ev;const fields=EDIT_FIELDS[r.type];
