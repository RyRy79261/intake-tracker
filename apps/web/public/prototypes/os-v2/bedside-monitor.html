/* =========================================================
   Actions
   ========================================================= */
function setPath(path,val){let o;let parts;
  if(path.startsWith('w:')){parts=path.slice(2).split('.');o=win(parts.shift());if(!o)return;o=o.st;}else{parts=path.split('.');o=S;}
  const last=parts.pop();for(const p of parts)o=o[p];o[last]=val;}
function getPath(path){let o;let parts;if(path.startsWith('w:')){parts=path.slice(2).split('.');o=win(parts.shift()).st;}else{parts=path.split('.');o=S;}for(const p of parts)o=o[p];return o;}
function parseVal(v){if(v.startsWith('b:'))return v==='b:true';if(v.startsWith('n:'))return+v.slice(2);if(v.startsWith('s:'))return v.slice(2);return v;}

function logPreset(id){const p=PRESETS.find(x=>x.id===id);const r=addRec({type:'drink',name:p.name,ml:p.ml,caffeine:p.caffeine||0,std:p.std||0,sugar:0});
  const label=`${p.name} · ${p.ml} ml`;
  logged([r],label,{label:'Add sugar',fn:()=>{S.drafts.sugar={amt:'',rid:r.id,_field:'amt'};S.tray={kind:'sugar'};anim.tray=true;focusNext='#tray-sugar-amt';}});
  return r;}
function act(a,arg,el){
  switch(a){
  case'home':if(isWide()){S.popover=S.popover==='launch'?null:'launch';invoker='[data-act="home"]';}else{S.phoneView='home';S.switcher=false;S.popover=null;}break;
  case'launch':S.popover=null;openWin(arg);break;
  case'chan':S.popover=null;openWin('history',{filter:arg,edit:''});break;
  case'setLimit':S.popover=null;S.sheet='settings';S.sgroups.tracking=true;invoker='[data-act="settings"]';focusNext='#lim-'+arg;break;
  case'focus':case'tab':
    if(a==='tab'&&S.phoneView===arg&&!isWide()){S.switcher=!S.switcher;break;}
    focusWin(arg);break;
  case'close':closeWin(arg);break;
  case'swap':{const i=+arg,n=S.tiles.length;if(n<2)break;const j=n===2?1-i:(i+1)%n;const t=S.tiles[i];S.tiles[i]=S.tiles[j];S.tiles[j]=t;anim.pane=S.tiles[i].active;break;}
  case'max':{const i=+arg;S.max=S.max===i?null:i;anim.pane=S.tiles[i].active;break;}
  case'water':{const r=addRec({type:'water',ml:+arg});logged([r],`${arg} ml water`);break;}
  case'quick':{const r=addRec({type:arg,size:'',note:''});S.drafts[arg]={size:'',note:'',rid:r.id};const label=arg==='wee'?'urination':'bowel movement';
    const ids=[r.id];toast(`Logged ${label} · ${tm(NOW_T)}`,()=>{S.records=S.records.filter(x=>!ids.includes(x.id));toast(`Removed ${label}`);},{label:'Add details',fn:()=>{S.tray={kind:arg};anim.tray=true;focusNext='.tray .seg button';}});break;}
  case'tray':{if(win('log-'+arg)){openWin('log-'+arg);break;}S.popover=null;S.tray={kind:arg};anim.tray=true;invoker=`[data-act="tray"][data-arg="${arg}"]`;
    const f={bp:`#tray-bp-${S.drafts.bp._field||'sys'}`,weight:'#tray-weight-val',water:'#tray-water-amt',food:'#tray-food-desc',drink:'.tray .preset'}[arg];if(f)focusNext=f;break;}
  case'trayClose':S.tray=null;if(invoker)focusNext=invoker;break;
  case'trayPane':{const k=S.tray.kind;S.tray=null;openWin('log-'+k);break;}
  case'kp':{const[k,key]=arg.split('|');const d=S.drafts[k];const f=d._field||Object.keys(d)[0];let v=String(d[f]||'');
    if(key==='next'){d._field=f==='sys'?'dia':f==='dia'?'hr':'sys';focusNext=`#tray-bp-${d._field}`;break;}
    if(key==='del')v=v.slice(0,-1);else if(key==='.'){if(!v.includes('.')&&k!=='water')v=(v||'0')+'.';}else v=(v+key).slice(0,k==='weight'?6:4);
    d[f]=v;if(k==='bp'&&key!=='del'){if(f==='sys'&&v.length>=3)d._field='dia';else if(f==='dia'&&v.length>=3)d._field='hr';}
    focusNext=`#tray-${k}-${d._field||f}`;break;}
  case'step':{const[k,dv]=arg.split('|');const d=S.drafts[k];if(k==='weight'){const v=(parseFloat(d.val)||78.35)+parseFloat(dv);d.val=v.toFixed(2);}else{const v=Math.max(0,(parseInt(d.amt,10)||0)+parseInt(dv,10));d.amt=String(v);}break;}
  case'save':{const[k,where]=arg.split('|');saveForm(k,where);break;}
  case'set':{const i=arg.lastIndexOf('|');const p=arg.slice(0,i);let v=parseVal(arg.slice(i+1));if(p==='settings.weightStep')v=+v;setPath(p,v);break;}
  case'toggle':setPath(arg,!getPath(arg));break;
  case'wset':{const[id,k,v]=arg.split('|');const w=win(id);if(w){w.st[k]=v;if(id==='medications')w.st.skipFor='';if(id==='history')w.st.edit='';}break;}
  case'preset':{const d=S.drafts.drink;if(arg==='other'){d.other=!d.other;break;}
    const inPane=!!(el&&el.closest('.pane'));logPreset(arg);
    if(!inPane){S.tray=null;focusNext=invoker;}else{const p=PRESETS.find(x=>x.id===arg);d._saved=`Logged ${p.name} at ${tm(NOW_T)}. Tap another drink to log it too.`;}break;}
  case'aiFood':{const d=S.drafts.food;if(!d.desc.trim()){d._ai='Type what you ate first, then ask AI.';break;}d.src='salt';d.unit='g';d.amt='1.2';d._ai=`AI estimate for “${d.desc}”: about 1.2 g salt. Check and adjust before logging.`;break;}
  case'aiDrink':{const d=S.drafts.drink;const n=(d.oname||'').trim();if(!n){d._ai='Type the drink name first.';break;}d.ovol=d.ovol||'330';d.osugar=d.osugar||'35';d._ai=`AI per 100 ml for “${n}”: about 10 mg caffeine, 10.6 g sugar. Filled for ${d.ovol} ml.`;break;}
  case'undo':if(T&&T.undo){const u=T.undo;T=null;u();}break;
  case'toastx':if(T&&T.extra){const f=T.extra.fn;T=null;f();}break;
  case'nextdose':S.popover=null;openWin('medications',{tab:'schedule'});break;
  case'take':{const d=S.meds.doses.find(x=>x.id===arg);d.status='taken';d.at=NOW_T;S.meds.stock.entresto=Math.max(0,S.meds.stock.entresto-1);
    toast(`Logged Entresto 100 mg taken ${tm(NOW_T)}`,()=>{d.status='due';delete d.at;S.meds.stock.entresto++;toast('Dose marked as due again');});break;}
  case'skip':{const w=win('medications');w.st.skipFor=w.st.skipFor===arg?'':arg;break;}
  case'skipReason':{const[id,reason]=arg.split('|');const d=S.meds.doses.find(x=>x.id===id);d.status='skipped';d.reason=reason;win('medications').st.skipFor='';
    toast(`Logged Entresto skipped · ${reason}`,()=>{d.status='due';delete d.reason;toast('Dose marked as due again');});break;}
  case'titr':{const M=S.meds;if(arg==='start')M.titration='confirm';else if(arg==='back')M.titration='ready';else if(arg==='notnow')M.titration='snoozed';else if(arg==='again')M.titration='ready';
    else if(arg==='confirm'){M.titration='started';toast('Started Bisoprolol 5 mg · from Mon '+tm('08:00'),()=>{M.titration='ready';toast('Titration start undone');});}
    focusNext='[data-act="titr"]';break;}
  case'stockOpen':{const[k,m]=arg.split('|');const w=win('medications');w.st.stockEdit=k;w.st.stockMode=m;w.st.stockVal=m==='refill'?(k==='concor'?'28':'56'):String(S.meds.stock[k]);focusNext='#stk-'+k;break;}
  case'stockCancel':win('medications').st.stockEdit='';break;
  case'stockSave':{const w=win('medications');const v=parseInt(w.st.stockVal,10);if(v>=0){const prev=S.meds.stock[arg];S.meds.stock[arg]=w.st.stockMode==='refill'?prev+v:v;const nm=arg==='concor'?'Concor':'Entresto';
    toast(w.st.stockMode==='refill'?`Logged refill · ${nm} +${v}`:`Corrected ${nm} to ${v}`,()=>{S.meds.stock[arg]=prev;toast('Stock change undone');});}w.st.stockEdit='';break;}
  case'hedit':{const w=win('history');if(w.st.edit===arg){w.st.edit='';break;}const r=S.records.find(x=>x.id===arg);w.st.edit=arg;const ev={};EDIT_FIELDS[r.type].forEach(([k])=>ev[k]=r[k]==null?'':String(k==='kg'?r[k].toFixed(2):r[k]));w.st.ev=ev;focusNext=`#he-${arg}-${EDIT_FIELDS[r.type][0][0]}`;break;}
  case'hcancel':{const w=win('history');const id=w.st.edit;w.st.edit='';focusNext=`[data-act="hedit"][data-arg="${id}"]`;break;}
  case'hsave':{const w=win('history');const r=S.records.find(x=>x.id===arg);const prev=Object.assign({},r);for(const[k,v]of Object.entries(w.st.ev)){r[k]=k==='note'?v:(parseFloat(v)||0);}w.st.edit='';toast(`Updated ${recDesc(r)}`,()=>{Object.assign(r,prev);toast('Edit undone');});focusNext=`[data-act="hedit"][data-arg="${arg}"]`;break;}
  case'hdel':{const i=S.records.findIndex(x=>x.id===arg);const r=S.records[i];S.records.splice(i,1);win('history').st.edit='';toast(`Deleted ${recDesc(r)}`,()=>{S.records.splice(i,0,r);toast('Record restored');});break;}
  case'exportCsv':exportCsv();break;
  case'settings':S.popover=null;S.switcher=false;S.sheet=S.sheet==='settings'?null:'settings';invoker='[data-act="settings"]';if(S.sheet)focusNext='.sheet [data-act="sheetClose"]';else focusNext=invoker;break;
  case'sheetClose':S.sheet=null;S.confirmDelete=false;focusNext=invoker||'[data-act="settings"]';break;
  case'sgrp':S.sgroups[arg]=!S.sgroups[arg];break;
  case'acct':S.popover=S.popover==='acct'?null:'acct';invoker='[data-act="acct"]';if(S.popover)focusNext='.pop .it';break;
  case'sync':S.popover=S.popover==='sync'?null:'sync';invoker='[data-act="sync"]';if(S.popover)focusNext='.pop .it';break;
  case'popSync':S.popover='sync';focusNext='.pop .it';break;
  case'popClose':S.popover=null;focusNext=invoker;break;
  case'signin':S.popover=null;S.sheet='signin';invoker=S.signedIn?'[data-act="settings"]':'[data-act="signin"]';focusNext='#si-email';break;
  case'signinSubmit':S.signedIn=true;S.sheet=null;toast('Signed in as Ryan · AI features on');focusNext='[data-act="acct"]';break;
  case'signout':S.signedIn=false;S.popover=null;cancelListen();toast('Signed out · logging keeps working on this device');focusNext='[data-act="signin"]';break;
  case'acctDel':if(arg==='ask')S.confirmAcctDel=true;else if(arg==='no')S.confirmAcctDel=false;else{S.confirmAcctDel=false;S.signedIn=false;toast('Account deleted · records on this device kept');}break;
  case'delData':if(arg==='ask')S.confirmDelete=true;else if(arg==='no')S.confirmDelete=false;else{const keep=S.records;S.records=[];S.confirmDelete=false;toast('Deleted all records on this device',()=>{S.records=keep;toast('Records restored');});}break;
  }
  render();}

function saveForm(k,where){const d=S.drafts[k];let recs=[],label='';
  if(k==='bp'){const r=addRec({type:'bp',sys:+d.sys,dia:+d.dia,hr:d.hr?+d.hr:null,pos:d.pos,arm:d.arm,irregular:d.irregular,note:d.note});recs=[r];label=`BP ${r.sys}/${r.dia}${r.hr?' · pulse '+r.hr:''}`;S.drafts.bp=blankDrafts().bp;}
  if(k==='weight'){const r=addRec({type:'weight',kg:+(+d.val).toFixed(2)});recs=[r];label=`${r.kg.toFixed(2)} kg`;S.drafts.weight=Object.assign(blankDrafts().weight,{val:r.kg.toFixed(2)});}
  if(k==='water'){const r=addRec({type:'water',ml:parseInt(d.amt,10)});recs=[r];label=`${fi(r.ml)} ml water`;S.drafts.water=blankDrafts().water;}
  if(k==='food'){const mg=sodiumOf(d.src,d.unit,d.amt);const r=addRec({type:'food',desc:d.desc.trim()||'Food',sodium:mg,sugar:parseFloat(d.sugar)||0,src:d.src,unit:d.unit,amt:d.amt});recs=[r];label=`${r.desc} · ${fi(mg)} mg sodium`;S.drafts.food=blankDrafts().food;}
  if(k==='drink'){const r=addRec({type:'drink',name:d.oname.trim()||'Drink',ml:parseFloat(d.ovol)||0,caffeine:0,std:0,sugar:parseFloat(d.osugar)||0});recs=[r];label=recDesc(r);S.drafts.drink=blankDrafts().drink;}
  if(k==='sugar'){const r=S.records.find(x=>x.id===d.rid);const g=parseFloat(d.amt)||0;if(r){const prev=r.sugar||0;r.sugar=prev+g;S.tray=null;toast(`Added ${g} g sugar to ${r.name}`,()=>{r.sugar=prev;toast('Sugar removed');});}S.drafts.sugar=blankDrafts().sugar;focusNext='[data-act="tray"][data-arg="drink"]';return;}
  if(k==='wee'||k==='bowel'){const r=S.records.find(x=>x.id===d.rid);if(r){r.size=d.size;r.note=d.note;}S.tray=null;toast(`Saved details · ${r?recDesc(r):''}`);S.drafts[k]=blankDrafts()[k];return;}
  logged(recs,label);
  if(where==='tray'){S.tray=null;focusNext=invoker;}else{S.drafts[k]._saved=`Logged ${label} at ${tm(NOW_T)}. This pane stays open for the next entry.`;}}

function exportCsv(){const rows=[['date','time','type','description']].concat(S.records.map(r=>[dayOf(r),r.time,r.type,recDesc(r)]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='intake-records-2026-09-27.csv';document.body.appendChild(a);a.click();a.remove();}catch(e){}
  toast(`Exported ${S.records.length} records as CSV`);}

/* =========================================================
   AI hold-to-talk
   ========================================================= */
const WORDS='two coffees this morning and a ham sandwich'.split(' ');
const L={mode:null,t0:0,words:0,level:0,armed:false,sx:0,sy:0,pid:null,timer:null,entries:[],src:null,demo:false};
function visMic(){return[...document.querySelectorAll('#app [data-mic]')].find(x=>x.offsetParent)||null;}
function micDown(e,btn){if(!S.signedIn||L.mode==='listen')return;L.mode='listen';L.t0=performance.now();L.words=0;L.level=0;L.armed=false;L.sx=e.clientX||0;L.sy=e.clientY||0;L.pid=e.pointerId;L.src=btn.classList.contains('ts-mic')?'.ts-mic':btn.classList.contains('appk')?'.appk.mic':'.mic-row';L.demo=false;
  btn.classList.add('held');renderListen();clearInterval(L.timer);L.timer=setInterval(tick,100);}
function tick(){const el=performance.now()-L.t0;const w=Math.min(WORDS.length,Math.floor(el/320));
  if(w>L.words){L.words=w;L.level=0.55+((w*37)%10)/22;}else L.level=Math.max(0.06,L.level*0.7);updateListen();if(el>30000)micUp();}
function micUp(){if(L.mode!=='listen')return;clearInterval(L.timer);document.querySelectorAll('.held').forEach(x=>x.classList.remove('held'));
  if(L.armed){cancelListen();return;}
  if(L.words<2){L.mode='empty';renderListen();return;}
  L.mode='review';L.entries=[{d:'caffeine',name:'Coffee',ml:'250',caffeine:'95'},{d:'caffeine',name:'Coffee',ml:'250',caffeine:'95'},{d:'sodium',name:'Ham sandwich',salt:'1.2'}];renderListen();
  const b=$('#listen [data-lact="log"]');if(b)b.focus();}
function cancelListen(){clearInterval(L.timer);document.querySelectorAll('.held').forEach(x=>x.classList.remove('held'));const had=!!L.mode;L.mode=null;renderListen();if(had){const m=visMic();if(m)m.focus({preventScroll:true});}}
function renderListen(){const el=$('#listen');if(!L.mode){el.hidden=true;el.innerHTML='';return;}el.hidden=false;
  if(L.mode==='listen'){el.innerHTML=`<div class="lp${L.armed?' armed':''}" role="dialog" aria-label="AI logger listening" aria-live="polite"><div class="lp-h">${ic('mic')}<span class="lab">Listening · AI logger</span><span class="num lp-t">0:00.0</span></div>
    <div class="meter" aria-hidden="true">${'<i></i>'.repeat(24)}</div><p class="lp-tr"></p><p class="lp-hint"></p></div>`;updateListen();return;}
  if(L.mode==='empty'){el.innerHTML=`<div class="lp" role="dialog" aria-label="AI logger"><div class="lp-h">${ic('mic')}<span class="lab">Nothing heard</span></div><p class="lp-tr" style="font-size:16px;margin-top:8px">Keep holding while you speak, then let go.</p><button class="btn line" data-lact="discard">Close</button></div>`;el.querySelector('button').focus();return;}
  const n=L.entries.length;
  el.innerHTML=`<div class="lp" role="dialog" aria-label="Check AI entries"><div class="lp-h">${ic('ai')}<span class="lab">Check ${n} entr${n===1?'y':'ies'} before logging</span></div>
    <p class="lp-tr" style="font-size:15px;color:var(--muted);margin:6px 0 4px">“${WORDS.join(' ')}”</p>
    ${L.entries.map((e,i)=>e.d==='caffeine'?`<div class="ent" style="${cs('caffeine')}"><span class="dm">${ic('caffeine','ic-s')}Drink · caffeine</span><b>${e.name}</b><input id="le-${i}-ml" data-lbind="${i}.ml" inputmode="numeric" value="${esc(e.ml)}" aria-label="${e.name} volume in ml"><span>ml ·</span><input id="le-${i}-c" data-lbind="${i}.caffeine" inputmode="numeric" value="${esc(e.caffeine)}" aria-label="${e.name} caffeine in mg"><span>mg caffeine</span><button class="rm" data-lact="rm" data-i="${i}" aria-label="Remove ${e.name}">${ic('x','ic-s')}</button></div>`
      :`<div class="ent" style="${cs('sodium')}"><span class="dm">${ic('sodium','ic-s')}Food · sodium</span><b>${e.name}</b><input id="le-${i}-s" data-lbind="${i}.salt" inputmode="decimal" value="${esc(e.salt)}" aria-label="${e.name} salt in grams"><span>g salt = <b class="le-mg">${fi(sodiumOf('salt','g',e.salt))}</b> mg sodium</span><button class="rm" data-lact="rm" data-i="${i}" aria-label="Remove ${e.name}">${ic('x','ic-s')}</button></div>`).join('')}
    <div class="btns" style="margin-top:12px"><button class="btn pri" style="--c:var(--ai);flex:1" data-lact="log" ${n?'':'disabled'}>Log ${n} entr${n===1?'y':'ies'}</button><button class="btn line" data-lact="discard">Discard</button></div></div>`;}
function updateListen(){const el=$('#listen');if(L.mode!=='listen')return;const lp=el.querySelector('.lp');if(!lp)return;lp.classList.toggle('armed',L.armed);
  const s=((L.demo?2600:performance.now()-L.t0)/1000);lp.querySelector('.lp-t').textContent=`0:${pad(Math.floor(s))}.${Math.floor((s%1)*10)}`;
  const on=Math.round(L.level*24);lp.querySelectorAll('.meter i').forEach((x,i)=>x.classList.toggle('on',i<on));
  lp.querySelector('.lp-tr').textContent=L.words?`“${WORDS.slice(0,L.words).join(' ')}”`:'Listening…';
  lp.querySelector('.lp-hint').textContent=L.armed?'Let go to cancel · slide back to keep talking':'Let go to check what was heard · slide away to cancel';}
$('#listen').addEventListener('click',e=>{const b=e.target.closest('[data-lact]');if(!b)return;const a=b.dataset.lact;
  if(a==='rm'){L.entries.splice(+b.dataset.i,1);renderListen();return;}
  if(a==='discard'){cancelListen();return;}
  if(a==='log'){const recs=L.entries.map(e=>e.d==='caffeine'?addRec({type:'drink',name:e.name,ml:parseFloat(e.ml)||0,caffeine:parseFloat(e.caffeine)||0,std:0,sugar:0}):addRec({type:'food',desc:e.name,sodium:sodiumOf('salt','g',e.salt),sugar:0,src:'salt',unit:'g',amt:e.salt}));
    const n=recs.length;L.mode=null;renderListen();logged(recs,`${n} entr${n===1?'y':'ies'} from AI`);render();const m=visMic();if(m)m.focus({preventScroll:true});}});
$('#listen').addEventListener('input',e=>{const b=e.target.dataset.lbind;if(!b)return;const[i,k]=b.split('.');L.entries[+i][k]=e.target.value;const mg=e.target.closest('.ent').querySelector('.le-mg');if(mg)mg.textContent=fi(sodiumOf('salt','g',L.entries[+i].salt));});

/* =========================================================
   Events
   ========================================================= */
const app=$('#app');
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!app.contains(b)||b.disabled)return;if(b.dataset.mic)return;act(b.dataset.act,b.dataset.arg,b);});
app.addEventListener('input',e=>{const el=e.target;const p=el.dataset.bind;if(!p)return;let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.num)v=v===''?0:(parseFloat(v)||0);setPath(p,v);render();});
app.addEventListener('change',e=>{if(e.target.dataset.actChange==='import'){toast(`Import preview: ${e.target.files[0]?e.target.files[0].name:'no file'} · nothing changed in this prototype`);render();}});
app.addEventListener('focusin',e=>{const f=e.target.dataset&&e.target.dataset.field;if(!f)return;const[k,n]=f.split(':');if(S.drafts[k]._field!==n){S.drafts[k]._field=n;document.querySelectorAll(`[data-field^="${k}:"]`).forEach(x=>x.classList.toggle('act',x.dataset.field===f&&!!x.closest('.tray')));save();}});
app.addEventListener('pointerdown',e=>{const m=e.target.closest('[data-mic]');if(m){e.preventDefault();micDown(e,m);return;}
  const sp=e.target.closest('[data-split]');if(sp){e.preventDefault();startSplit(e,sp.dataset.split);return;}
  const sw=e.target.closest('[data-swipe]');if(sw&&!e.target.closest('[data-noswipe]')&&!isWide()){swipe={x:e.clientX,y:e.clientY,t:performance.now()};}});
app.addEventListener('contextmenu',e=>{if(e.target.closest('[data-mic]'))e.preventDefault();});
let swipe=null;
document.addEventListener('pointermove',e=>{if(L.mode==='listen'&&!L.demo&&(L.pid==null||e.pointerId===L.pid)){const d=Math.hypot(e.clientX-L.sx,e.clientY-L.sy);const a=d>70;if(a!==L.armed){L.armed=a;updateListen();}}});
document.addEventListener('pointerup',e=>{if(L.mode==='listen'&&!L.demo){micUp();return;}
  if(swipe){const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;const dt=performance.now()-swipe.t;swipe=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<50&&dt<700&&S.phoneView!=='home'){const i=S.wins.findIndex(w=>w.id===S.phoneView);const j=i+(dx<0?1:-1);if(j>=0&&j<S.wins.length){focusWin(S.wins[j].id);render();}}}});
document.addEventListener('pointercancel',()=>{if(L.mode==='listen'&&!L.demo){L.armed=true;micUp();}swipe=null;});
app.addEventListener('keydown',e=>{const m=e.target.closest&&e.target.closest('[data-mic]');if(m&&(e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat&&L.mode!=='listen')micDown({clientX:0,clientY:0,pointerId:null},m);}
  const sp=e.target.dataset&&e.target.dataset.split;if(sp&&/Arrow/.test(e.key)){e.preventDefault();const k=sp==='v'?'x':'y';const dlt=(e.key==='ArrowLeft'||e.key==='ArrowUp')?-5:5;S.split[k]=Math.max(25,Math.min(75,S.split[k]+dlt));render();}});
app.addEventListener('keyup',e=>{const m=e.target.closest&&e.target.closest('[data-mic]');if(m&&(e.key===' '||e.key==='Enter')&&L.mode==='listen'&&!L.demo){e.preventDefault();micUp();}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(L.mode){cancelListen();return;}
  if(S.popover){S.popover=null;focusNext=invoker;render();return;}
  if(S.sheet){act('sheetClose');return;}
  if(S.switcher){S.switcher=false;render();return;}
  if(S.tray){act('trayClose');return;}});
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.scroll){scrolls[t.dataset.scroll]={t:t.scrollTop,l:t.scrollLeft};}},true);
document.addEventListener('pointerdown',e=>{if(S.popover&&!e.target.closest('.pop')&&!e.target.closest('[data-act="acct"],[data-act="sync"],[data-act="home"]')&&app.contains(e.target)){S.popover=null;render();}},true);
function startSplit(e,dir){const work=app.querySelector('.work');const r=work.getBoundingClientRect();const el=e.target.closest('[data-split]');el.setPointerCapture&&el.setPointerCapture(e.pointerId);
  const mv=ev=>{if(dir==='v'){S.split.x=Math.max(25,Math.min(75,(ev.clientX-r.left)/r.width*100));work.style.setProperty('--x',S.split.x+'%');}else{S.split.y=Math.max(25,Math.min(75,(ev.clientY-r.top)/r.height*100));work.style.setProperty('--y',S.split.y+'%');}};
  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);render();};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);}
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.theme==='system')render();});
window.addEventListener('resize',()=>{if(S.tray)placeTray();});

/* =========================================================
   Reviewer harness (outside the product UI)
   ========================================================= */
let hxOpen=false;
function renderHarness(){const h=$('#hx');const b=(a,v,label,on)=>`<button class="o" data-hx="${a}" data-v="${v}" aria-pressed="${!!on}">${label}</button>`;
  const th=S.theme==='system'?'system':S.theme;
  h.innerHTML=`<div class="hx-p"${hxOpen?'':' hidden'}>
    <div style="display:flex;justify-content:space-between;align-items:center"><b>REVIEW HARNESS</b><span class="note" style="margin:0">not part of the app</span></div>
    <h3>Viewport</h3><div class="r">${b('vp','fit','Fit window',S.vp==='fit')}${b('vp','390','390×844',S.vp==='390')}${b('vp','1280','1280×800',S.vp==='1280')}</div>
    <h3>Theme</h3><div class="r">${b('theme','light','Light',th==='light')}${b('theme','dark','Dark',th==='dark')}</div>
    <h3>Account</h3><div class="r">${b('si','1','Signed in',S.signedIn)}${b('si','0','Signed out',!S.signedIn)}</div>
    <h3>Demo</h3><div class="r">${b('reset','1','Reset demo',false)}</div>
    <h3>Jump to state</h3><ol>
      <li><button data-hx="demo" data-v="1">Home · 390 · dark · signed in</button></li>
      <li><button data-hx="demo" data-v="2">Home · 390 · light · signed out</button></li>
      <li><button data-hx="demo" data-v="3">390 · 3 panes + switcher</button></li>
      <li><button data-hx="demo" data-v="4">1280 · Medications + Metrics</button> · <button data-hx="demo" data-v="4b">3 panes</button></li>
      <li><button data-hx="demo" data-v="5">Food · 1.5 g salt → 590 mg</button></li>
      <li><button data-hx="demo" data-v="6">Mic held (listening)</button> · <button data-hx="demo" data-v="6b">let go (check)</button></li>
      <li><button data-hx="demo" data-v="7">Settings over a pane · 390</button> · <button data-hx="demo" data-v="7b">1280</button></li>
      <li><button data-hx="demo" data-v="8">Titration “Ready to start”</button></li></ol>
    <h3>Concepts</h3><div class="r"><a href="ward-console.html">ward-console</a><a href="bedside-monitor.html" aria-current="page" style="background:#111;color:#FFE14D">bedside-monitor</a><a href="flight-deck.html">flight-deck</a><a href="stage-manager.html">stage-manager</a><a href="field-instrument.html">field-instrument</a><a href="index.html">index</a></div>
  </div><button class="hx-t" data-hx="toggle" aria-expanded="${hxOpen}" title="Review harness and concept links (not part of the app)" aria-label="Review harness and concept links">${hxOpen?'×':'R'}</button>`;}
function demo(v){const keepVp=S.vp;S=initialState();T=null;scrolls={};L.mode=null;clearInterval(L.timer);renderListen();
  const vp={1:'390',2:'390',3:'390',4:'1280','4b':'1280',5:'390',6:'390','6b':'390',7:'390','7b':'1280',8:'390'}[v]||keepVp;S.vp=vp;
  if(v==='2'){S.theme='light';S.signedIn=false;}
  if(v==='3'){openWin('medications',{tab:'stock'});openWin('metrics',{range:'30d'});S.drafts.bp.sys='128';S.drafts.bp._field='dia';openWin('log-bp');S.switcher=true;}
  if(v==='4'){openWin('medications');openWin('metrics');}
  if(v==='4b'){openWin('medications');openWin('metrics');openWin('history');}
  if(v==='5'){Object.assign(S.drafts.food,{desc:'Tomato soup',src:'salt',unit:'g',amt:'1.5'});S.tray={kind:'food'};}
  if(v==='7'||v==='7b'){openWin('medications',{tab:'stock'});openWin('metrics',{range:'30d'});S.sheet='settings';}
  if(v==='8'){openWin('medications',{tab:'titrations'});}
  anim={};render();
  if(v==='6'||v==='6b'){L.mode='listen';L.demo=true;L.words=WORDS.length;L.level=0.62;L.armed=false;L.src='.appk.mic';renderListen();if(v==='6b'){L.demo=false;L.mode='listen';L.armed=false;micUp();}}}
$('#hx').addEventListener('click',e=>{const b=e.target.closest('[data-hx]');if(!b)return;const a=b.dataset.hx,v=b.dataset.v;
  if(a==='toggle'){hxOpen=!hxOpen;renderHarness();return;}
  if(a==='vp')S.vp=v;if(a==='theme')S.theme=v;if(a==='si'){S.signedIn=v==='1';if(!S.signedIn)cancelListen();}
  if(a==='reset'){try{localStorage.removeItem(KEY);}catch(x){}S=initialState();T=null;scrolls={};}
  if(a==='demo'){demo(v);return;}
  render();});
document.addEventListener('keydown',e=>{if(L.demo&&L.mode==='listen'&&(e.key==='Enter')){L.demo=false;micUp();}});

render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.tray)placeTray();});
</script>
