<!doctype html>
<!-- PROTOTYPE (throwaway): Ward Console (404 OS structure, re-dressed clinical) — intake-tracker app-OS concept -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward Console · intake-tracker prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#050608;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:0;text-align:inherit}
input,select,textarea{border-radius:0}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---------- stage (viewport harness) ---------- */
.stage{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.stage.fit .app{width:100vw;height:100vh;height:100dvh}
.stage.v390,.stage.v1280{background:#2b2b2b;padding-top:8px}
.stage.v390 .app{width:390px;height:844px;flex:none;transform-origin:top center}
.stage.v1280 .app{width:1280px;height:800px;flex:none;transform-origin:top center}

/* ---------- app tokens ---------- */
.app{--sans:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sbh:calc(44px + env(safe-area-inset-top));
  position:relative;overflow:hidden;container:app / size;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:.9375rem;line-height:1.4}
.app[data-theme=night]{color-scheme:dark;--bg:#10121C;--panel:#181B28;--chrome:#242838;--line:#353A4E;--fg:#EDEFF6;--muted:#979CB3;--shadow:rgba(0,0,0,.5);--onD:#10121C;
  --water:#4AAEFF;--sodium:#F4B73E;--sugar:#FF80BA;--caffeine:#CF9468;--alcohol:#B48BFF;--bp:#FF5E5A;--weight:#52D38F;--bath:#C7BA5E;--meds:#2FD1C2;--ai:#8E9CFF;--grid:rgba(237,239,246,.05)}
.app[data-theme=day]{color-scheme:light;--bg:#E9E7E1;--panel:#FAF9F5;--chrome:#D8D4C9;--line:#B7B2A5;--fg:#14161F;--muted:#5D6070;--shadow:rgba(20,22,31,.22);--onD:#FFFFFF;
  --water:#0A68B8;--sodium:#8D5A00;--sugar:#B81F66;--caffeine:#84502B;--alcohol:#6A3FD0;--bp:#C0262A;--weight:#177A4A;--bath:#716610;--meds:#08786F;--ai:#3F4BD1;--grid:rgba(20,22,31,.07)}
.app ::selection{background:var(--fg);color:var(--bg)}
.px{font-family:var(--sans);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;line-height:1.15;font-weight:600}
.px.l{font-size:.75rem}
.px.xl{font-size:.8125rem}
/* sentence-case labels for controls (tabs, titles, keys, icons) */
.tabs .px,.wt.px,.dicon .px,.key .px,.bcell .px,.task .px,.sb-start .px,.chip.px,.wb-back .px,.swrow .px,.setsec .px,.tb .px{text-transform:none;letter-spacing:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.c{color:var(--c)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app :focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app :focus:not(:focus-visible){outline:none}
.os{position:absolute;inset:0;display:flex;flex-direction:column}
.os *{user-select:none;-webkit-user-select:none}
.os .wbody,.os .wbody *,.os input,.os textarea{user-select:text;-webkit-user-select:text}
.ico{width:24px;height:24px;flex:none;display:block}
.ico.s16{width:16px;height:16px}.ico.s20{width:20px;height:20px}.ico.s28{width:28px;height:28px}.ico.s32{width:32px;height:32px}

/* ---------- system bar ---------- */
.sysbar{flex:none;height:var(--sbh);padding:env(safe-area-inset-top) 6px 0;background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;position:relative;z-index:50}
.sb-start{height:32px;display:flex;align-items:center;gap:6px;padding:0 9px 0 7px;font-size:.8125rem;border:1px solid var(--line);background:var(--panel);position:relative;flex:none}
.sb-start[aria-expanded=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sb-date{display:flex;flex-direction:column;font-size:.75rem;line-height:1.15;flex:none;white-space:nowrap;padding-left:2px}
.sb-date b{font-weight:600}
.taskbar{display:none}
.tray{margin-left:auto;display:flex;align-items:center;gap:3px}
.tb{height:32px;min-width:32px;display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);background:var(--panel);padding:0 5px;position:relative;flex:none;font-size:.75rem}
.tb::before,.sb-start::before,.bcell::before{content:"";position:absolute;inset:-6px -2px}
.tb[aria-expanded=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tb.dose .ico{color:var(--meds)} .tb[aria-expanded=true] .ico{color:inherit}
.tb.offline{border-style:dashed}
.ndd{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.ndd .px{font-size:.5625rem;color:var(--muted)}
.tb .lbl{display:none}
.tb.acct{padding:0 4px 0 0;gap:5px}
.av{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--fg);color:var(--bg);font-family:var(--mono);font-weight:600;font-size:.75rem;border-radius:50%}
.tb.acct .av{width:24px;height:24px;margin-left:3px;font-size:.6875rem}
.aichip .w{display:none}
.aichip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--ai);color:var(--ai);padding:0 4px;height:18px;line-height:1;font-family:var(--sans);font-size:.6875rem;font-weight:600;letter-spacing:.02em;text-transform:none}
.aichip .ico{width:12px;height:12px}
.tb.signin{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:0 5px;border-color:var(--muted)}
.tb.signin small{font-size:.6875rem;color:var(--muted);line-height:1}
.tb.mic{color:var(--ai);border-color:var(--ai);touch-action:none}
.clock{display:none}

/* ---------- desk ---------- */
.desk{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:10px;padding:10px 14px 10px 12px;overflow:hidden}
.desk.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.dock{display:contents}
.gadget{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.ghead{height:32px;flex:none;background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 4px 0 10px}
.ghead .wkr{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.ghead .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.g-today{order:1;flex:none}
.icons{order:2;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none}
.g-log{order:3;margin-top:auto;flex:none}
@container app (max-width:767.98px){.desk.form-open .icons{display:none}}
.desk.form-open .g-log{flex:1 1 auto;margin-top:0}

/* today gadget: one visual per metric = label | Mon-Sun mini columns (today wider) | today's value */
.g-today{--lc:62px;--vc:124px;--mh:24px}
.tg{padding:0 10px}
/* header doubles as the day-label row: Today | M T W T F S S | week range */
.ghead.tgh{display:grid;grid-template-columns:var(--lc) minmax(0,1fr) var(--vc);gap:8px;padding:0 10px}
.ghead.tgh .wkr{text-align:right;white-space:nowrap;overflow:hidden}
.ghead.tgh .dl{font-family:var(--mono);font-size:.6875rem;color:var(--muted)}
.tg-row{display:grid;grid-template-columns:var(--lc) minmax(0,1fr) var(--vc);gap:8px;align-items:center}
.dl{display:flex;gap:3px}
.dl span{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;overflow:hidden}
.dl .t{flex-grow:1.9;color:var(--fg);font-weight:600}
.tg-row{width:100%;min-height:40px;padding:4px 0;border-top:1px solid var(--line);text-align:left}
.tg-row:hover,.tg-half:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.tg-row:focus-visible,.tg-half:focus-visible{outline-offset:-2px}
.tg-l{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;line-height:1.15}
.mc{display:flex;gap:3px;height:var(--mh)}
.dc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.dc.t{flex-grow:1.9}
.dc>i{flex:1;display:block;position:relative;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.dc.t>i{box-shadow:0 0 0 1.5px var(--fg)}
.dc>i>b{position:absolute;left:0;right:0;bottom:0;display:block;background:color-mix(in srgb,var(--c) 55%,transparent)}
.dc.t>i>b{background:var(--c)}
.dc>i>b.h{background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 3.5px);box-shadow:inset 0 0 0 1px var(--c)}
.dc>i>b.x{background:var(--c);box-shadow:inset 0 3px 0 var(--fg)}
.dc.fut>i{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.dc>i>u{position:absolute;left:-2px;right:-2px;height:0;border-top:1px dashed var(--fg);opacity:.75;pointer-events:none}
.dc.t>i>u{border-top:2px solid var(--fg);opacity:1;left:-3px;right:-3px}
.dc em{display:none;font-style:normal;font-family:var(--mono);font-size:.6875rem;line-height:1;text-align:center;color:var(--muted);white-space:nowrap}
.dc.t em{color:var(--fg);font-weight:600}
.tg-v{text-align:right;font-family:var(--mono);line-height:1.15;white-space:nowrap;min-width:0}
.tg-v b{font-size:1rem;font-weight:600;color:var(--c)}
.tg-v .of{font-size:.6875rem;color:var(--muted)}
.tg-s{display:block;font-family:var(--sans);font-size:.6875rem;line-height:1.25;color:var(--muted)}
.tg-s.over{color:var(--fg);font-weight:600}
.inv{background:var(--c);color:var(--onD);font-weight:600;padding:0 4px;line-height:15px;display:inline-block}
.tg-pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.tg-half{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:8px;align-items:center;padding:4px 10px;min-height:40px;text-align:left}
.tg-half+.tg-half{border-left:1px solid var(--line)}
.tg-half .mc{--mh:22px;gap:2px}
.tg-hv{display:block;white-space:nowrap;margin-top:2px;font-family:var(--mono);font-size:.75rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.tg-hv b{color:var(--c);font-weight:600;font-size:.9375rem}
.tg-key{display:flex;flex-wrap:wrap;gap:2px 12px;padding:5px 10px 6px;line-height:1.3;border-top:1px solid var(--line);font-size:.6875rem;color:var(--muted)}
.tg-key span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tg-key i{display:inline-block;width:10px;height:10px;--c:var(--muted)}
.k-tl{height:0!important;border-top:2px solid var(--fg)}
.k-h{background:repeating-linear-gradient(135deg,var(--fg) 0 1.5px,transparent 1.5px 3.5px);box-shadow:inset 0 0 0 1px var(--fg)}
.k-x{background:var(--muted);box-shadow:inset 0 3px 0 var(--fg)}
.k-t{box-shadow:inset 0 0 0 1.5px var(--fg)}
/* collapsed strip while a log form is open (phone) */
.strip{display:flex;justify-content:space-between;gap:6px;padding:5px 10px 6px}
.strip button{display:flex;flex-direction:column;align-items:flex-start;min-height:36px;justify-content:center;text-align:left}
.strip .sl{font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.strip .sv{font-family:var(--mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.strip .sv b{color:var(--c);font-size:.875rem;font-weight:600}
.bar{flex:1;display:flex;gap:2px;padding:2px;border:1px solid var(--muted);height:12px;position:relative;min-width:60px}
.bar.lg{height:16px}
.sg{flex:1;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.sg.f{background:var(--c)}

/* desktop icons */
.dicon{height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;color:var(--fg);border:1px solid transparent}
.dicon:hover{border-color:var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.dicon .ico{width:30px;height:30px}
.dicon .px{max-width:100%;text-align:center;font-size:.8125rem;font-weight:500}
.pip{position:absolute;min-width:16px;height:16px;padding:0 3px;background:var(--c);color:var(--onD);font-family:var(--mono);font-size:.625rem;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1}
.dicon .pip{top:8px;left:calc(50% + 10px)}

/* keys + log gadget */
.lk{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.lk-r1{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.lk-r2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{background:var(--chrome);border:1px solid var(--line);min-height:48px;display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:0 10px;color:var(--fg);position:relative}
.key:hover{border-color:var(--muted)}
.key:active{background:color-mix(in srgb,var(--fg) 14%,var(--chrome))}
.key .px{font-size:.875rem;font-weight:500}
.key.wide{justify-content:center;gap:5px;min-height:48px;padding:0 6px}
.key.wide .mono{font-size:1.0625rem;font-weight:600;color:var(--water)}
.key.wide .px{color:var(--muted);font-size:.8125rem}
.key .ico{color:var(--c)}
.key.sq{width:48px;min-height:48px;flex:none;font-size:1.25rem;font-family:var(--mono);justify-content:center;padding:0}
.form{display:flex;flex-direction:column;min-height:0;flex:1}
.fbody{padding:10px 12px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1}
.fsave{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--panel);flex:none}
.fsave .btn-p{flex:1}
.fsave .btn{flex:none}
.g-log .form{max-height:100%}
.desk.form-open .g-log .form{overflow:hidden}
.flabel{font-size:.8125rem;color:var(--muted);display:block;margin-bottom:4px}
.frow{display:flex;gap:8px;align-items:flex-end}
.frow>*{flex:1;min-width:0}
.frow>.seg:not(.full){flex:none}
.field{width:100%;background:var(--bg);border:1px solid var(--muted);color:var(--fg);height:40px;padding:0 10px;font-size:.9375rem}
.field.mono{font-family:var(--mono)}
.field.big{font-size:1.25rem;font-weight:600;height:48px;text-align:center}
textarea.field{height:64px;padding:8px 10px;resize:vertical}
select.field{padding-right:4px}
.help{font-size:.8125rem;color:var(--muted)}
.ref{font-size:.8125rem;color:var(--muted);border-left:3px solid var(--c);padding:2px 0 2px 8px}
.ref .mono{color:var(--fg)}
.conv{font-family:var(--mono);font-size:.875rem;padding:8px 10px;border:1px dashed var(--muted);color:var(--fg)}
.conv b{color:var(--sodium);font-weight:600}
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper .field{flex:1}
.unitfield{position:relative}
.unitfield .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.8125rem;color:var(--muted);pointer-events:none;font-family:var(--mono)}
.unitfield .field{padding-right:42px}
.err{font-size:.8125rem;color:var(--fg);border-left:3px solid var(--bp);padding-left:8px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-top:1px solid var(--line);text-align:left}
.prow:first-child{border-top:0}
.prow .pd{margin-left:auto;font-size:.75rem;color:var(--muted);text-align:right}
.prow[aria-checked=true]{background:var(--fg);color:var(--bg)}
.prow[aria-checked=true] .pd{color:var(--bg)}
.mark{width:10px;height:10px;background:var(--c);flex:none;display:inline-block}
.mark.o{background:none;border:2px solid var(--c)}

/* buttons */
.btn-p{background:var(--fg);color:var(--bg);border:2px solid var(--fg);min-height:44px;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p:active{background:color-mix(in srgb,var(--fg) 82%,var(--bg))}
.btn-p[disabled]{background:transparent;color:var(--muted);border:1.5px dashed var(--muted);font-weight:500;cursor:not-allowed}
.btn{border:1px solid var(--muted);background:transparent;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.875rem;font-weight:500}
.btn:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.btn.sm{min-height:32px;padding:0 10px;font-size:.8125rem}
.btn.ai{border-color:var(--ai);color:var(--ai)}
.btn .ico{width:18px;height:18px}
.seg{display:inline-flex;border:1px solid var(--muted)}
.seg button{min-height:36px;padding:0 12px;font-size:.8125rem;border-left:1px solid var(--muted);font-weight:500}
.seg button:first-child{border-left:0}
.seg button[aria-checked=true]{background:var(--fg);color:var(--bg)}
.seg.full{display:flex}.seg.full button{flex:1}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:.9375rem}
.chk .bx{width:20px;height:20px;border:1px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.chk[aria-checked=true] .bx{background:var(--fg);color:var(--bg)}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;padding:4px 0}
.tog-t{flex:1;display:flex;flex-direction:column}
.tog-t small{font-size:.8125rem;color:var(--muted)}
.swt{width:38px;height:22px;border:1px solid var(--muted);position:relative;flex:none;background:var(--bg)}
.swt i{position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--muted)}
.tog[aria-checked=true] .swt{background:var(--fg);border-color:var(--fg)}
.tog[aria-checked=true] .swt i{left:19px;background:var(--bg)}
.sw-w{font-size:.75rem;width:2.2em;color:var(--muted)}
.quiet{font-size:.8125rem;color:var(--muted);padding:6px 0}
.aimark{color:var(--ai);display:inline-flex;align-items:center;gap:4px}

/* section label */
.sec{display:flex;align-items:center;gap:8px;color:var(--muted);margin:14px 0 6px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:2px}

/* ---------- windows ---------- */
.winlayer{position:absolute;inset:0;z-index:20;display:none;background:var(--bg)}
.desk.has-active .winlayer{display:block}
.win{position:absolute;display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line)}
@container app (max-width:767.98px){.win.active{display:flex;inset:0!important;width:auto!important;height:auto!important;border:0;box-shadow:none}}
.tb.wide-mic,.tb.wide-log{display:none}
.tbar{height:48px;flex:none;display:flex;align-items:center;background:var(--chrome);color:var(--fg);border-bottom:0;box-shadow:inset 0 -2px 0 var(--c,var(--fg));touch-action:pan-y;position:relative}
.tbar :focus-visible{outline-offset:-4px}
.wb-back{height:48px;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;border-right:1px solid currentColor;flex:none}
.wt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 12px;font-size:.9375rem;font-weight:600}
.wt-ic{display:none}
.wt-n{font-size:.75rem;padding-right:4px;color:var(--muted)}
.wctl{display:none}
.wc{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.cb{width:22px;height:22px;border:1.5px solid currentColor;position:relative;display:block}
.wc-close .cb::before,.wc-close .cb::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
.wc-close .cb::after{transform:translate(-50%,-50%) rotate(-45deg)}
.wc-min .cb::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:2px;background:currentColor}
.wc-max .cb::after{content:"";position:absolute;inset:3px;border:1.5px solid currentColor;border-top-width:3px}

/* ============================================================ derived metrics */
function contrib(r){const o={water:0,sodium:0,sugar:0,caffeine:0,alcohol:0,potassium:0};
  if(r.kind==='water')o.water=r.ml;
  if(r.kind==='drink'){o.water=r.ml||0;o.caffeine=r.caffeine||0;o.alcohol=r.alcohol||0;o.sugar=r.sugar||0;}
  if(r.kind==='food'){o.sodium=r.sodium||0;o.sugar=r.sugar||0;}
  return o;}
const todayKey=()=>dayKeyOfTs(NOW_TS);
function totals(k){
  if(k>todayKey())return null;
  const recs=S.records.filter(r=>dayKeyOfTs(r.ts)===k);
  const b=BASE[k];
  if(!b&&!recs.some(r=>['water','drink','food'].includes(r.kind)))return null;
  const o={water:0,sodium:0,sugar:0,caffeine:0,alcohol:0,potassium:0,...(b||{})};
  recs.forEach(r=>{const c=contrib(r);for(const x in c)o[x]+=c[x];});
  o.alcohol=Math.round(o.alcohol*10)/10;
  return o;}
function weekDays(){const t=todayKey();const off=(dowOf(t)-S.settings.weekStart+7)%7;const s=addDays(t,-off);return [0,1,2,3,4,5,6].map(i=>addDays(s,i));}
function last7(){const t=todayKey();return [6,5,4,3,2,1,0].map(i=>addDays(t,-i));}
const LIM=d=>S.settings.limits[d]||null;
function status(d,v){const L=LIM(d),u=UNIT[d]||'';
  if(!L)return {s:'none',text:'no limit set',long:'no limit set'};
  if(v<=L.limit)return {s:'ok',text:`${fmt(L.limit-v)} ${u} left`,long:`${fmt(L.limit-v)} ${u} left of the target`};
  if(v<=L.limit+L.buffer)return {s:'over',text:`${fmt(v-L.limit)} ${u} over target`,long:`${fmt(v-L.limit)} ${u} over target`};
  return {s:'lim',text:`▲ ${fmt(v-L.limit-L.buffer)} ${u} over limit`,long:`${fmt(v-L.limit-L.buffer)} ${u} over the limit, ${fmt(v-L.limit)} ${u} over target`};}
const visTrk=()=>TRK.filter(t=>!t.opt||S.settings.trackers[t.opt]);
function nextDose(){const d=S.meds.doses['pm-entresto'];return d.status==='due'?{t:'20:00',label:'20:00',day:'',drug:'Entresto 100 mg'}:{t:'08:00',label:'Mon 08:00',day:'Mon ',drug:'Entresto 100 mg and Bisoprolol'};}

/* ============================================================ UI pieces */
function unitWord(t){return {ml:'millilitres',mg:'milligrams',g:'grams','std drinks':'standard drinks'}[t.unit];}
function scaleFor(d,vals){const L=LIM(d),mx=Math.max(...vals,0);return L?Math.max(L.limit+L.buffer,mx)*1.08:Math.max(mx,0.1)*1.12;}
/* seven mini columns, Mon-Sun (week start from settings); today's column wider, outlined, with a solid target tick */
function dayCells(t,days,wtots,tk){
  const vals=wtots.map(o=>o?o[t.k]:0),sc=scaleFor(t.k,vals),L=LIM(t.k);
  const tl=L?`<u style="bottom:${(L.limit/sc*100).toFixed(1)}%"></u>`:'';
  return days.map((k,i)=>{const o=wtots[i],today=k===tk;
    if(!o)return `<span class="dc fut ${today?'t':''}"><i>${tl}</i><em>—</em></span>`;
    const v=o[t.k],st=status(t.k,v).s,cls=st==='over'?'h':st==='lim'?'x':'';
    const hp=v>0?Math.max(5,Math.min(100,v/sc*100)):0;
    return `<span class="dc ${today?'t':''}"><i>${hp?`<b class="${cls}" style="height:${hp.toFixed(1)}%"></b>`:''}${tl}</i><em>${st==='lim'?'▲':''}${t.val(v)}</em></span>`;}).join('');}
function tval(t,v){const L=LIM(t.k),s=status(t.k,v);
  const of=L?`<span class="of"> / ${fmt(L.limit)} ${t.unit}</span>`:`<span class="of"> ${t.unit}</span>`;
  const st=s.s==='lim'?`<span class="tg-s"><span class="inv">${esc(s.text)}</span></span>`:`<span class="tg-s ${s.s==='over'?'over':''}">${esc(s.text)}</span>`;
  return `<span class="tg-v"><span><b>${t.val(v)}</b>${of}</span>${st}</span>`;}
function weekAria(t,days,wtots){return days.map((k,i)=>{const o=wtots[i];if(!o)return `${DOW[dowOf(k)]} no data yet`;const st=status(t.k,o[t.k]);return `${DOW[dowOf(k)]} ${t.val(o[t.k])}${st.s==='over'?' over target':st.s==='lim'?' over limit':''}`;}).join(', ');}
function weekRange(days){return `${parseKey(days[0]).getUTCDate()}${days[0].slice(5,7)!==days[6].slice(5,7)?' '+MON[parseKey(days[0]).getUTCMonth()]:''}–${parseKey(days[6]).getUTCDate()} ${MON[parseKey(days[6]).getUTCMonth()]}`;}

function todayHtml(){
  const tk=todayKey(),tot=totals(tk)||{},days=weekDays(),wide=isWide();
  const wtots=days.map(k=>totals(k));
  const trk=visTrk();
  const dayLbls=`<span class="dl" aria-hidden="true">${days.map(k=>`<span class="${k===tk?'t':''}">${wide?`${DOW[dowOf(k)]} ${parseKey(k).getUTCDate()}`:DOW[dowOf(k)].slice(0,1)}</span>`).join('')}</span>`;
  let h=`<div class="ghead tgh"><h2 class="px">Today</h2>${dayLbls}<span class="wkr">week ${esc(weekRange(days))}</span></div>`;
  // while a log form is open on a phone, Today collapses to one line of values
  if(S.ui.logForm&&!wide){
    return `<div class="ghead"><h2 class="px">Today</h2><span class="wkr">· week ${esc(weekRange(days))}</span></div>`+`<div class="strip">${trk.map(t=>`<button style="--c:${cv(t.c||t.k)}" data-act="openHistory" data-arg="${t.k}" aria-label="${esc(`${t.label} today ${t.val(tot[t.k]||0)} ${unitWord(t)}, ${status(t.k,tot[t.k]||0).long}`)}"><span class="sl">${t.label}</span><span class="sv"><b>${t.val(tot[t.k]||0)}</b> ${t.unit}</span></button>`).join('')}</div>`;}
  const row=t=>{const v=tot[t.k]||0,s=status(t.k,v),L=LIM(t.k);
    const aria=`${t.label} today ${t.val(v)}${L?` of ${fmt(L.limit)}`:''} ${unitWord(t)}, ${s.long}. This week: ${weekAria(t,days,wtots)}. Open ${t.label} history`;
    return `<button class="tg-row" style="--c:${cv(t.c||t.k)}" data-act="openHistory" data-arg="${t.k}" aria-label="${esc(aria)}"><span class="tg-l">${t.label}</span><span class="mc" aria-hidden="true">${dayCells(t,days,wtots,tk)}</span>${tval(t,v)}</button>`;};
  const half=t=>{const v=tot[t.k]||0;
    const aria=`${t.label} today ${t.val(v)} ${unitWord(t)}, no limit set. This week: ${weekAria(t,days,wtots)}. Open ${t.label} history`;
    return `<button class="tg-half" style="--c:${cv(t.c||t.k)}" data-act="openHistory" data-arg="${t.k}" aria-label="${esc(aria)}"><span class="tg-l">${t.label}<span class="tg-hv"><b>${t.val(v)}</b> ${t.unit}</span></span><span class="mc" aria-hidden="true">${dayCells(t,days,wtots,tk)}</span></button>`;};
  h+=`<div class="tg">`;

function drinkAdds(d){const p=PRESETS.find(x=>x.id===d.preset);if(!p||p.id==='other')return '';

  parts.push(`${p.ml} ml water`);
  return `Adds <span class="mono">${parts.slice(0,-1).join(', ')}${parts.length>1?' and ':''}${parts[parts.length-1]}</span>.`;}

/* ============================================================ windows */
function winTitle(w){return APPS[w.app].title;}
function winState(w){
  switch(w.app){
    case 'meds':{const tab={schedule:'Today',rx:'Meds',stock:'Stock',titr:'Titration'}[w.st.tab];return `${tab} · ${dueCount()?'20:00 due':'next Mon 08:00'}`;}
    case 'metrics':return `Range ${w.st.range==='today'?'Today':w.st.range} · avg BP ${bpAvg(rangeKeys(w.st.range)).txt}`;
    case 'history':{const n=filteredRecs(w.st.filter).length;return `${w.st.filter==='all'?'All records':'Filter: '+FILTERS.find(f=>f[0]===w.st.filter)[1]} · ${n} records`;}
    case 'profile':return 'Ryan · Heart failure (HFrEF)';
  }}
function areaSize(){const l=$('#winlayer');const w=l.clientWidth,h=l.clientHeight;if(isWide()&&w>200)return {w,h};return {w:928,h:756};}
/* window placement. On wide the window layer starts right of the app icons, so windows never cover them.
   Windows shrink to fit rather than shifting left; two or three untouched windows tile in columns. */
function defaultRect(app,n){const [sw,sh]=SIZES[APPS[app].size];const A=areaSize();
  const x=Math.min(16+n*28,Math.max(8,A.w-368)),y=Math.min(12+n*28,Math.max(8,A.h-268));
  return {x,y,w:Math.max(Math.min(360,A.w-16),Math.min(sw,A.w-8-x)),h:Math.min(sh,A.h-8-y)};}
function tileCols(vis){const A=areaSize(),g=8,n=vis.length,cw=Math.floor((A.w-g*(n+1))/n);
  vis.sort((a,b)=>S.wins.indexOf(a)-S.wins.indexOf(b)).forEach((w,i)=>{w.max=false;w.x=g+i*(cw+g);w.y=g;w.w=cw;w.h=A.h-2*g;w.tiled=true;});}
function autoLayout(){if(!isWide())return;const A=areaSize();const vis=S.wins.filter(w=>!w.min&&!w.max);
  if(vis.some(w=>w.moved))return;
  if(vis.length>=2&&vis.length<=3&&A.w>=900){tileCols(vis);return;}
  if(vis.length===1&&vis[0].tiled){const w=vis[0];Object.assign(w,defaultRect(w.app,0));w.tiled=false;}}
function openApp(app,st){
  let w=S.wins.find(x=>x.app===app);
  if(w){if(st)Object.assign(w.st,st);if(w.min){w.min=false;autoLayout();}focusWin(w.id);S.showHome=false;return w;}
  if(S.wins.length>=6){toast('Six windows are open. Close one to open another.');return null;}
  const n=S.wins.filter(x=>!x.min).length;
  const defaults={meds:{tab:'schedule'},metrics:{range:'7d'},history:{filter:'all'},profile:{}};
  w={id:'w'+(S.nextId++),app,...defaultRect(app,n),z:++S.z,min:false,max:false,moved:false,tiled:false,st:Object.assign(defaults[app],st||{})};
  S.wins.push(w);S.focus=w.id;S.showHome=false;autoLayout();return w;}
function focusWin(id){const w=S.wins.find(x=>x.id===id);if(!w)return;w.z=++S.z;S.focus=id;}
function closeWin(id){const i=S.wins.findIndex(x=>x.id===id);if(i<0)return;S.wins.splice(i,1);
  if(S.focus===id){const top=S.wins.filter(w=>!w.min).sort((a,b)=>b.z-a.z)[0];S.focus=top?top.id:null;if(!top&&!isWide())S.showHome=true;}
  delete SCROLL['w-'+id];autoLayout();}
function tidy(){const A=areaSize();const vis=S.wins.filter(w=>!w.min);const n=vis.length;if(!n)return;
  vis.forEach(w=>{w.moved=false;w.max=false;});
  if(n===1){Object.assign(vis[0],defaultRect(vis[0].app,0));return;}
  if(n<=3&&A.w>=900){tileCols(vis);return;}
  const g=8;let cells;
  if(n<=4)cells=[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]];
  else cells=[0,1,2,3,4,5].map(i=>[(i%3)/3,Math.floor(i/3)/2,1/3,.5]);
  vis.sort((a,b)=>S.wins.indexOf(a)-S.wins.indexOf(b)).forEach((w,i)=>{const c=cells[i];w.tiled=true;w.x=Math.round(g+c[0]*(A.w-g));w.y=Math.round(g+c[1]*(A.h-g));w.w=Math.round(c[2]*(A.w-g)-g);w.h=Math.round(c[3]*(A.h-g)-g);});}
const GRIPS=['n','s','e','w','ne','nw','sw','se'].map(g=>`<div class="grip ${g}" data-grip="${g}" aria-hidden="true"></div>`).join('');
function tbarHtml(w){const A=APPS[w.app],t=winTitle(w),i=S.wins.indexOf(w)+1;
  return `<button class="wb-back" data-act="home" data-k="back-${w.id}" aria-label="Back to home">${ic('back','s20')}<span class="px">Home</span></button>

/* tablet seen side-on (top face + edge), so a round white tablet can't read as a radio button */
function pill(shape){const oval=shape==='oval',rx=oval?13:8.5,cx=15,top=oval?'#CDBDEA':'#ECEBE6',edge=oval?'#9C8BC0':'#B9B7AE';

function doseRow(name,sub,shape,d,id){

/* ----- Metrics ----- */
function rangeKeys(r){if(r==='today')return [todayKey()];return last7();}
function bpAvg(keys){const rs=S.records.filter(r=>r.kind==='bp'&&keys.includes(dayKeyOfTs(r.ts)));if(!rs.length)return {n:0,txt:'—'};
  const s=Math.round(rs.reduce((a,r)=>a+r.sys,0)/rs.length),d=Math.round(rs.reduce((a,r)=>a+r.dia,0)/rs.length);return {n:rs.length,txt:`${s}/${d}`,rs};}
function wtAvg(keys){const rs=S.records.filter(r=>r.kind==='weight'&&keys.includes(dayKeyOfTs(r.ts)));if(!rs.length)return {n:0,txt:'—'};
  return {n:rs.length,txt:fmt(rs.reduce((a,r)=>a+r.kg,0)/rs.length,2),rs};}
function metricsBody(w){
  const r=w.st.range,keys=rangeKeys(r),tots=keys.map(k=>totals(k)).filter(Boolean),n=tots.length||1;
  const ranges=[['today','Today'],['7d','7d'],['30d','30d'],['90d','90d'],['all','All']];
  let h=`<div class="tabs" role="tablist" aria-label="Range">${ranges.map(([k,l])=>`<button role="tab" class="px l" aria-selected="${r===k}" data-act="wset" data-wid="${w.id}" data-path="range" data-v='"${k}"'>${l}</button>`).join('')}</div><div class="wpad">`;

    ${kpi('caffeine','Caffeine',fmt(avg('caffeine')),'mg','no limit set')}
    ${kpi('alcohol','Alcohol',one?fx(sum('alcohol'),1):fx(sum('alcohol'),1),'std drinks',one?'no limit set':`total · on ${tots.filter(o=>o.alcohol>0).length} of ${n} days`)}

  else{const sod=last7().map(k=>totals(k)).filter(Boolean);const ot=sod.filter(o=>o.sodium>LIM('sodium').limit).length;
    h+=`<div class="card" style="--c:var(--ai)"><p class="px aimark" style="margin-bottom:8px">${ic('ai','s16')} AI summary</p><ul style="display:flex;flex-direction:column;gap:6px;font-size:.9375rem">

  return h+'</div>';}
function weekTable(){const days=weekDays(),tk=todayKey(),tots=days.map(k=>totals(k));
  return `<div style="overflow-x:auto"><table class="wtab"><thead><tr><th>Per day</th>${days.map(k=>`<th class="${k===tk?'tcol':''}">${DOW[dowOf(k)]} ${parseKey(k).getUTCDate()}</th>`).join('')}</tr></thead><tbody>
  ${visTrk().map(t=>`<tr style="--c:${cv(t.c||t.k)}"><td style="white-space:nowrap"><span class="mark"></span> ${t.label} <span class="muted">(${t.unit})</span></td>${days.map((k,i)=>{const o=tots[i];if(!o)return `<td class="muted">—</td>`;const s=status(t.k,o[t.k]).s;return `<td class="${s==='over'?'h':s==='lim'?'x':''} ${k===tk?'tcol':''}">${s==='lim'?'▲':''}${t.val(o[t.k])}</td>`;}).join('')}</tr>`).join('')}
  </tbody></table></div><p class="note" style="margin-top:4px">Hatched: over target. Solid with ▲: over limit (target + buffer). Outlined: today.</p>`;}
let chartSeq=0;
/* charts are drawn at the pixel width they will occupy (viewBox = real size), so text never scales up */
function winInner(w){let cw;if(!isWide())cw=$('#app').clientWidth;else if(w.max)cw=$('#winlayer').clientWidth;else cw=w.w-2;return Math.max(240,cw-28-12);}
function axisY(x0,x1,ys,fmtf,y){return ys.map(v=>`<line x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${x0-5}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)">${fmtf(v)}</text>`).join('');}
function fluidChart(W){const id='hw'+(++chartSeq);const ks=last7(),L=LIM('water');const H=170,l=44,r=8,t=14,b=26;const max=1600;const y=v=>t+(H-t-b)*(1-v/max);const bw=(W-l-r)/7;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Water in per day, last 7 days, with ${L?fmt(L.limit)+' ml target':'no target'}"><defs><pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="4" fill="var(--water)"/></pattern></defs>`;
  s+=axisY(l,W-r,[0,500,1000,1500],v=>fmt(v),y);
  ks.forEach((k,i)=>{const o=totals(k);if(!o)return;const v=o.water,st=L?status('water',v).s:'ok';const w=Math.min(bw*.6,44),x=l+i*bw+(bw-w)/2;
    s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" fill="${st==='ok'?'var(--water)':`url(#${id})`}" stroke="var(--water)" stroke-width="${st==='ok'?0:1}"/>`;
    s+=`<text class="ax" x="${x+w/2}" y="${H-9}" text-anchor="middle" fill="${k===todayKey()?'var(--fg)':'var(--muted)'}" font-weight="${k===todayKey()?600:400}">${dayTick(k,W)}</text>`;});
  if(L){s+=`<line x1="${l}" x2="${W-r}" y1="${y(L.limit)}" y2="${y(L.limit)}" stroke="var(--fg)" stroke-width="1.5"/><text x="${W-r}" y="${y(L.limit)-4}" text-anchor="end" fill="var(--fg)" paint-order="stroke" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round">target ${fmt(L.limit)} ml</text>`;}
  s+=`</svg>`;
  return `<figure class="chart span2" style="margin:0"><h4>Water in per day <span class="muted mono">(ml)</span></h4>${s}<p class="note">Hatched bars went over the ${L?fmt(L.limit)+' ml':''} target. Urination is logged as counts, not volume, so this is intake only.</p></figure>`;}
function dayTick(k,W){return W>=520?dayLabel(k,false):`${DOW[dowOf(k)][0]}${parseKey(k).getUTCDate()}`;}
function bpChart(W){const ks=last7();const rs=S.records.filter(r=>r.kind==='bp'&&ks.includes(dayKeyOfTs(r.ts)));const H=170,l=40,r=8,t=14,b=26;const y=v=>t+(H-t-b)*(1-(v-60)/80);const bw=(W-l-r)/7;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Blood pressure readings, last 7 days: ${rs.map(x=>`${dayLabel(dayKeyOfTs(x.ts))} ${x.sys}/${x.dia}${x.irr?' irregular':''}`).join(', ')}">`;
  s+=axisY(l,W-r,[60,80,100,120,140],v=>v,y);
  ks.forEach((k,i)=>{s+=`<text class="ax" x="${l+i*bw+bw/2}" y="${H-9}" text-anchor="middle" fill="var(--muted)">${dayTick(k,W)}</text>`;});
  rs.forEach(x=>{const i=ks.indexOf(dayKeyOfTs(x.ts));const cx=l+i*bw+bw/2;
    s+=`<line x1="${cx}" x2="${cx}" y1="${y(x.sys)}" y2="${y(x.dia)}" stroke="var(--bp)" stroke-width="1.5"/><rect x="${cx-4}" y="${y(x.sys)-4}" width="8" height="8" fill="var(--bp)"/><rect x="${cx-3.5}" y="${y(x.dia)-3.5}" width="7" height="7" fill="var(--bg)" stroke="var(--bp)" stroke-width="1.5"/>`;
    const lx=cx+7+52>W?cx-7:cx+7;s+=`<text x="${lx}" y="${y(x.sys)+4}" text-anchor="${lx<cx?'end':'start'}" fill="var(--fg)">${x.sys}/${x.dia}</text>`;
    if(x.irr)s+=`<rect x="${cx-8}" y="${y(x.sys)-8}" width="16" height="${y(x.dia)-y(x.sys)+16}" fill="none" stroke="var(--fg)" stroke-width="1" stroke-dasharray="2 2"/><text x="${cx}" y="${y(x.sys)-11}" text-anchor="middle" font-weight="600" fill="var(--fg)">!</text>`;});
  s+=`</svg>`;
  const flag=rs.find(x=>x.irr);
  return `<figure class="chart" style="margin:0"><h4>Blood pressure <span class="muted mono">(mmHg · ■ systolic □ diastolic)</span></h4>${s}${flag?`<p class="note"><b>! ${dayLabel(dayKeyOfTs(flag.ts))} ${tf(hm(flag.ts))}</b> · ${flag.pos.toLowerCase()} · irregular heartbeat · “${esc(flag.note)}”</p>`:''}</figure>`;}
function weightChart(W){const ks=last7();const rs=S.records.filter(r=>r.kind==='weight'&&ks.includes(dayKeyOfTs(r.ts))).sort((a,b)=>a.ts<b.ts?-1:1);const H=170,l=48,r=8,t=18,b=26;
  const lo=78.2,hi=78.5;const y=v=>t+(H-t-b)*(1-(Math.min(hi,Math.max(lo,v))-lo)/(hi-lo));const bw=(W-l-r)/7;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Weight, last 7 days: ${rs.map(x=>`${dayLabel(dayKeyOfTs(x.ts))} ${fmt(x.kg,2)} kg`).join(', ')}">`;
  s+=axisY(l,W-r,[78.2,78.3,78.4,78.5],v=>fmt(v,2),y);
  ks.forEach((k,i)=>{s+=`<text class="ax" x="${l+i*bw+bw/2}" y="${H-9}" text-anchor="middle" fill="var(--muted)">${dayTick(k,W)}</text>`;});
  const pts=rs.map(x=>[l+ks.indexOf(dayKeyOfTs(x.ts))*bw+bw/2,y(x.kg),x.kg]);
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--weight)" stroke-width="1.5"/>`;
  pts.forEach(p=>{s+=`<rect x="${p[0]-4}" y="${p[1]-4}" width="8" height="8" fill="var(--weight)"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" fill="var(--fg)">${fmt(p[2],2)}</text>`;});
  s+=`</svg>`;
  return `<figure class="chart" style="margin:0"><h4>Weight <span class="muted mono">(kg)</span></h4>${s}<p class="note">Alert threshold: gain over 2 kg in 3 days.</p></figure>`;}

/* ----- History ----- */
const FILTERS=[['all','All','fg'],['water','Water','water'],['sodium','Sodium','sodium'],['sugar','Sugar','sugar'],['caffeine','Caffeine','caffeine'],['alcohol','Alcohol','alcohol'],['food','Food','sodium'],['bp','BP','bp'],['weight','Weight','weight'],['wee','Urination','bath'],['bowel','Bowel','bath']];
function filteredRecs(f){return S.records.filter(r=>{const c=contrib(r);switch(f){case 'all':return true;case 'water':return c.water>0;case 'sodium':return c.sodium>0;case 'sugar':return c.sugar>0;case 'caffeine':return c.caffeine>0;case 'alcohol':return c.alcohol>0;case 'food':return r.kind==='food';default:return r.kind===f;}});}
function recInfo(r){switch(r.kind){
  case 'water':return {c:'water',t:'Water',d:`${fmt(r.ml)} ml`};
  case 'drink':{const p=[`${fmt(r.ml)} ml`];if(r.caffeine)p.push(`${r.caffeine} mg caffeine`);if(r.alcohol)p.push(`${fx(r.alcohol,1)} std drinks`);if(r.sugar)p.push(`${r.sugar} g sugar`);return {c:r.alcohol?'alcohol':r.caffeine?'caffeine':'water',t:r.name,d:p.join(' · ')};}
  case 'food':return {c:'sodium',t:r.name||'Food',d:`${fmt(r.sodium)} mg sodium${r.src?` (${r.src})`:''}${r.sugar?` · ${r.sugar} g sugar`:''}`};
  case 'bp':return {c:'bp',t:'Blood pressure',d:`${r.sys}/${r.dia} mmHg${r.hr?` · HR ${r.hr}`:''} · ${r.pos.toLowerCase()} · ${r.arm.toLowerCase()} arm${r.irr?' · irregular heartbeat':''}${r.note?` · “${esc(r.note)}”`:''}`};
  case 'weight':return {c:'weight',t:'Weight',d:`${fmt(r.kg,2)} kg`};
  case 'wee':return {c:'bath',t:'Urination',d:[r.size,r.note].filter(Boolean).join(' · ')||'logged'};
  case 'bowel':return {c:'bath',t:'Bowel movement',d:[r.size,r.note].filter(Boolean).join(' · ')||'logged'};}}
function historyBody(w){
  const f=w.st.filter,recs=filteredRecs(f).slice().sort((a,b)=>a.ts<b.ts?1:-1);
  let h=`<div class="chips" role="group" aria-label="Filter records">${FILTERS.map(([k,l,c])=>`<button class="chip px" aria-pressed="${f===k}" data-act="wset" data-wid="${w.id}" data-path="filter" data-v='"${k}"' style="--c:${cv(c)}">${k!=='all'?'<span class="mark"></span>':''}${l}</button>`).join('')}</div><div class="wpad ledger">`;
  const groups={};recs.forEach(r=>{const k=dayKeyOfTs(r.ts);(groups[k]=groups[k]||[]).push(r);});
  const keys=Object.keys(groups).sort().reverse();
  if(!keys.length)h+=`<p class="note">No records for this filter.</p>`;
  keys.forEach(k=>{
    h+=`<div class="dayh"><h3 class="px l">${k===todayKey()?'Today · ':''}${dayLabel(k)}</h3><span class="mono note">${groups[k].length} record${groups[k].length>1?'s':''}</span></div>`;
    groups[k].forEach(r=>{const i=recInfo(r);const cross=r.ts.slice(0,10)!==k;
      if(S.ui.histEdit===r.id){h+=`<div class="rowl" style="flex-wrap:wrap"><span class="tm">${tf(hm(r.ts))}</span><span class="mark" style="--c:var(--${i.c})"></span><span class="grow t1">${esc(i.t)}</span>${editFields(r)}<button class="btn-p" data-act="histSave" data-arg="${r.id}" style="min-height:40px">Save</button><button class="btn" data-act="histCancel">Cancel</button></div>`;return;}
      h+=`<div class="rowl"><span class="tm">${tf(hm(r.ts))}</span><span class="mark" style="--c:var(--${i.c})"></span><span class="grow"><span class="t1" style="display:block">${esc(i.t)}</span><span class="t2 mono">${i.d}</span>${cross?`<span class="t2" style="display:block">${dayLabel(r.ts.slice(0,10))} ${tf(hm(r.ts))} · counts to ${DOW[dowOf(k)]} (day starts ${String(S.settings.dayStart).padStart(2,'0')}:00)</span>`:''}</span>
        <button class="ibtn" data-act="histEdit" data-arg="${r.id}" aria-label="Edit ${esc(i.t)} at ${hm(r.ts)}">${ic('edit')}</button><button class="ibtn" data-act="histDel" data-arg="${r.id}" aria-label="Delete ${esc(i.t)} at ${hm(r.ts)}">${ic('trash')}</button></div>`;});
  });
  h+=`<h3 class="sec"><span class="px">Export</span></h3><div class="acts"><button class="btn" data-act="exportCsv">${ic('down')} CSV</button><button class="btn" data-act="exportPdf">${ic('down')} PDF report</button></div>`;
  return h+'</div>';}
function editFields(r){const E='ui.editDraft',e=S.ui.editDraft;
  const f=(k,u,l)=>`<span style="width:7em">${uf(`${E}.${k}`,e[k]??'',u,{im:'decimal',aria:l})}</span>`;
  switch(r.kind){case 'water':case 'drink':return f('ml','ml','Volume');case 'food':return f('sodium','mg','Sodium');case 'bp':return f('sys','sys','Systolic')+f('dia','dia','Diastolic');case 'weight':return f('kg','kg','Weight');default:return `<span style="flex:1 1 10em">${inp(E+'.note',e.note??'',{mono:false,aria:'Note'})}</span>`;}}

function updateMic(){if(!MIC)return;const tr=$('#micTr');if(!tr)return;
  const sec=Math.floor((Date.now()-MIC.t0)/1000);$('#micT').textContent=`0:${String(sec).padStart(2,'0')}`;

  const lv=MIC.cancel?0:MIC.words?LEVELS[MIC.words%LEVELS.length]:3;$$('#micLvl i').forEach((el,i)=>el.classList.toggle('on',i<lv));
  $('#micPanel').classList.toggle('cancel',MIC.cancel);$('#micHint').textContent=MIC.cancel?'Release to cancel · nothing will be logged':'Release to review · Slide away to cancel';}
function micStart(x,y,el){if(!S.signedIn||MIC)return;MIC={t0:Date.now(),x,y,cancel:false,words:0,el};S.ui.mic='listen';renderMic();$$('[data-mic]').forEach(b=>b.classList.add('held'));
  MIC.iv=setInterval(()=>{if(MIC.words<WORDS.length)MIC.words++;updateMic();},260);}
function micMove(x,y){if(!MIC)return;const d=Math.hypot(x-MIC.x,y-MIC.y);const c=d>70;if(c!==MIC.cancel){MIC.cancel=c;updateMic();}}
function micEnd(cancel){if(!MIC)return;clearInterval(MIC.iv);const held=Date.now()-MIC.t0;const c=cancel||MIC.cancel;const el=MIC.el;MIC=null;
  $$('[data-mic]').forEach(b=>b.classList.remove('held'));
  if(c){S.ui.mic=null;renderAll();toast('Cancelled · nothing logged');return;}

  S.ui.mic='review';S.ui.micItems=micItemsDefault();INVOKER=el&&el.dataset.k;renderAll();const f=$('#micwrap .btn-p');f&&f.focus();}

function addRecord(rec,msg){rec.id='u'+(S.nextId++);rec.ts=rec.ts||NOW_TS;S.records.push(rec);toast(msg,()=>{S.records=S.records.filter(r=>r.id!==rec.id);});}

function saveForm(type,ctx){
  const d=S.drafts[type];S.ui.formErr[type]=null;let rec,msg;
  const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;};
  switch(type){
    case 'water':{const ml=Math.round(num(d.ml));if(!(ml>0)){S.ui.formErr.water='Enter an amount above 0 ml.';return;}rec={kind:'water',ml};msg=`Logged +${fmt(ml)} ml water`;break;}
    case 'drink':{const p=PRESETS.find(x=>x.id===d.preset);
      if(p.id==='other'){const ml=Math.round(num(d.ml));if(!d.name||!(ml>0)){S.ui.formErr.drink='Enter a name and a volume.';return;}rec={kind:'drink',name:d.name,ml,caffeine:0,alcohol:0,sugar:num(d.osugar)};msg=`Logged ${d.name} · ${fmt(ml)} ml`;}
      else{rec={kind:'drink',name:p.name,ml:p.ml,caffeine:p.caffeine,alcohol:p.alcohol,sugar:num(d.sugar)};msg=`Logged ${p.name} · ${p.d}`;}break;}
    case 'food':{const mg=sodiumMg(d);if(mg==null&&!d.desc){S.ui.formErr.food='Describe the food or enter its sodium.';return;}
      rec={kind:'food',name:d.desc||'Food',sodium:mg||0,sugar:num(d.sugar),src:mg!=null&&d.source!=='sodium'?`${d.amt} ${d.unit} ${d.source==='msg'?'MSG':'salt'}`:''};msg=`Logged ${d.desc||'food'} · ${fmt(mg||0)} mg sodium`;break;}
    case 'bp':{const s=Math.round(num(d.sys)),di=Math.round(num(d.dia));if(!(s>40&&di>20)){S.ui.formErr.bp='Enter systolic (top) and diastolic (bottom).';return;}
      rec={kind:'bp',sys:s,dia:di,hr:Math.round(num(d.hr))||null,pos:d.pos,arm:d.arm,irr:d.irr,note:d.note};msg=`Logged BP ${s}/${di}${rec.hr?` · HR ${rec.hr}`:''}`;break;}
    case 'weight':{const kg=Math.round(num(d.kg)*100)/100;rec={kind:'weight',kg};msg=`Logged ${fmt(kg,2)} kg`;break;}
    case 'wee':rec={kind:'wee',size:d.size,note:d.note};msg='Logged urination';break;
    case 'bowel':rec={kind:'bowel',size:d.size,note:d.note};msg='Logged bowel movement';break;}

  if(ctx==='sheet')S.ui.overlay=null;}

  setsec(el){const k=el.dataset.arg;S.settings.open[k]=!S.settings.open[k];renderAll();},
  delData(el){const a=el.dataset.arg;if(a==='ask')S.ui.confirmDel=true;else if(a==='no')S.ui.confirmDel=false;else{const old=S.records;S.records=[];S.ui.confirmDel=false;toast(`Deleted ${old.length} records`,()=>{S.records=old;});}renderAll();},
  delAcct(el){const a=el.dataset.arg;if(a==='ask')S.ui.confirmAcct=true;else if(a==='no')S.ui.confirmAcct=false;else{S.ui.confirmAcct=false;S.signedIn=false;toast('Account deleted · records on this device kept');}renderAll();},
  feedback(el){const a=el.dataset.arg;if(a==='open')S.ui.feedback=true;else if(a==='no')S.ui.feedback=false;else{S.ui.feedback=false;S.ui.fbText='';toast('Feedback sent. Thank you.');}renderAll();},
  micDiscard(){S.ui.mic=null;S.ui.micItems=null;renderAll();refocus();toast('Discarded · nothing logged');},
  micLog(){const it=S.ui.micItems||[];const recs=it.map(x=>x.kind==='drink'?{kind:'drink',name:x.name,ml:+x.ml||0,caffeine:+x.caffeine||0,alcohol:0,sugar:0}:{kind:'food',name:x.name,sodium:Math.round((parseFloat(String(x.salt).replace(',','.'))||0)*393),sugar:0,src:`${x.salt} g salt`});
    S.ui.mic=null;S.ui.micItems=null;addRecords(recs,`Logged ${recs.length} ${recs.length===1?'entry':'entries'} from AI`);renderAll();refocus();},
  micRemove(el){S.ui.micItems.splice(+el.dataset.arg,1);renderAll();},
  micClose(){S.ui.mic=null;renderAll();},
  undo(){if(TOAST&&TOAST.undo){TOAST.undo();}TOAST=null;renderAll();}
};

/* ============================================================ events */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!el.closest('#app'))return;
  const a=el.dataset.act;if(ACT[a]){e.preventDefault();ACT[a](el,e);}
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.closest('#app'))return;const b=el.dataset.bind;if(!b)return;
  let v=el.value;if('num' in el.dataset)v=v===''?'':(isNaN(+v)?v:+v);setPath(S,b,v);
  $$(`[data-bind="${b}"]`).forEach(o=>{if(o!==el)o.value=el.value;});
  if(b.startsWith('settings.limits'))return; // committed on change
  liveUpdate();save();
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.closest('#app'))return;
  if(el.dataset.commit){let v=el.value;if('num' in el.dataset)v=+v;setPath(S,el.dataset.commit,v);renderAll();return;}
  if(el.dataset.bind&&el.dataset.bind.startsWith('settings.limits')){renderAll();return;}
  if(el.dataset.actChange==='import'){toast(el.files&&el.files[0]?`Import ready: ${el.files[0].name}`:'No file chosen');}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(MIC){micEnd(true);return;}
    if(S.ui.mic){S.ui.mic=null;S.ui.micItems=null;renderAll();refocus();return;}
    if(S.ui.overlay){closeOverlay();return;}
    if(S.ui.logForm){ACT.closeForm();return;}
    if(S.ui.histEdit){S.ui.histEdit=null;renderAll();return;}
  }
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('#app input.field')&&!e.target.dataset.commit){
    const f=e.target.closest('.form');const b=f&&f.querySelector('[data-act=saveForm]');if(b){e.preventDefault();b.click();}}
  const m=e.target.closest&&e.target.closest('[data-mic]');
  if(m&&(e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat&&!MIC){const r=m.getBoundingClientRect();micStart(r.x,r.y,m);}}
});
document.addEventListener('keyup',e=>{const m=e.target.closest&&e.target.closest('[data-mic]');if(m&&(e.key===' '||e.key==='Enter')&&MIC){e.preventDefault();micEnd(false);}});
document.addEventListener('scroll',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.sk)SCROLL[el.dataset.sk]=el.scrollTop;},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-mic]'))e.preventDefault();});

/* pointer: drag, resize, swipe, mic, focus */
let DRAG=null;
const vpScale=()=>{const t=getComputedStyle($('#app')).transform;if(!t||t==='none')return 1;return new DOMMatrix(t).a||1;};
document.addEventListener('pointerdown',e=>{
  const mic=e.target.closest('[data-mic]');
  if(mic&&e.button===0){e.preventDefault();try{mic.setPointerCapture(e.pointerId);}catch(_){}micStart(e.clientX,e.clientY,mic);return;}
  const winEl=e.target.closest('.win');if(!winEl)return;
  const w=S.wins.find(x=>x.id===winEl.dataset.wid);if(!w)return;
  if(S.focus!==w.id||w.z!==S.z){focusWin(w.id);frames();}
  const wide=isWide(),grip=e.target.closest('[data-grip]'),tb=e.target.closest('.tbar'),onBtn=e.target.closest('button');
  if(wide&&grip&&!w.max){DRAG={mode:'resize',dir:grip.dataset.grip,w,sx:e.clientX,sy:e.clientY,o:{x:w.x,y:w.y,w:w.w,h:w.h},el:winEl,s:vpScale()};grip.setPointerCapture(e.pointerId);e.preventDefault();return;}
  if(tb&&!onBtn){
    if(wide&&!w.max){DRAG={mode:'move',w,sx:e.clientX,sy:e.clientY,o:{x:w.x,y:w.y},el:winEl,s:vpScale()};tb.setPointerCapture(e.pointerId);e.preventDefault();}
    else if(!wide){DRAG={mode:'swipe',w,sx:e.clientX,sy:e.clientY};}
  }
});
document.addEventListener('pointermove',e=>{
  if(MIC){micMove(e.clientX,e.clientY);return;}
  if(!DRAG)return;const d=DRAG,dx=(e.clientX-d.sx)/(d.s||1),dy=(e.clientY-d.sy)/(d.s||1);const A=areaSize();
  if(d.mode==='move'){d.w.x=Math.round(Math.min(A.w-80,Math.max(0,d.o.x+dx)));d.w.y=Math.round(Math.min(A.h-32,Math.max(0,d.o.y+dy)));d.el.style.left=d.w.x+'px';d.el.style.top=d.w.y+'px';}
  if(d.mode==='resize'){const o=d.o,mw=360,mh=260;let {x,y,w,h}=o;
    if(d.dir.includes('e'))w=Math.max(mw,o.w+dx);if(d.dir.includes('s'))h=Math.max(mh,o.h+dy);
    if(d.dir.includes('w')){w=Math.max(mw,Math.min(o.x+o.w,o.w-dx));x=o.x+o.w-w;}if(d.dir.includes('n')){h=Math.max(mh,o.h-dy);y=Math.max(0,o.y+o.h-h);h=o.y+o.h-y;}
    Object.assign(d.w,{x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)});Object.assign(d.el.style,{left:d.w.x+'px',top:d.w.y+'px',width:d.w.w+'px',height:d.w.h+'px'});}
});
function endPointer(e,cancel){
  if(MIC){micEnd(cancel);return;}
  if(!DRAG)return;const d=DRAG;DRAG=null;
  if(d.mode==='swipe'&&!cancel){const dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&S.wins.length>1){const i=S.wins.indexOf(d.w);const n=S.wins[(i+(dx<0?1:-1)+S.wins.length)%S.wins.length];focusWin(n.id);renderAll();}}
  else if(d.mode==='move'||d.mode==='resize'){const moved=d.w.x!==d.o.x||d.w.y!==d.o.y||(d.o.w!=null&&(d.w.w!==d.o.w||d.w.h!==d.o.h));if(moved){d.w.moved=true;d.w.tiled=false;}if(d.mode==='resize'&&moved)renderAll();else save();}
  else save();}
document.addEventListener('pointerup',e=>endPointer(e,false));
document.addEventListener('pointercancel',e=>endPointer(e,true));
document.addEventListener('dblclick',e=>{const tb=e.target.closest('.tbar');if(tb&&isWide()&&!e.target.closest('button')){const w=S.wins.find(x=>x.id===tb.closest('.win').dataset.wid);w.max=!w.max;renderAll();}});

/* ============================================================ harness (outside the product) */
function applyVp(){const st=$('#stage'),app=$('#app'),vp=S.ui.vp;st.className='stage '+(vp==='fit'?'fit':'v'+vp);
  if(vp==='fit'){app.style.transform='';}else{const w=vp==='390'?390:1280,h=vp==='390'?844:800;const s=Math.min(1,(innerWidth-8)/w,(innerHeight-16)/h);app.style.transform=s<1?`scale(${s})`:'';}}
function syncHarness(){
  const eff=$('#app').dataset.theme==='day'?'light':'dark';
  $$('#hx [data-h]').forEach(g=>{const k=g.dataset.h;$$('button',g).forEach(b=>{const v=b.dataset.hv;let on=false;
    if(k==='vp')on=S.ui.vp===v;if(k==='theme')on=eff===v;if(k==='auth')on=(S.signedIn?'in':'out')===v;b.setAttribute('aria-pressed',on);});});}
$('#hxTab').addEventListener('click',()=>{const p=$('#hxPanel');p.hidden=!p.hidden;$('#hxTab').setAttribute('aria-expanded',!p.hidden);});
$('#hx').addEventListener('click',e=>{const b=e.target.closest('[data-hv]');if(!b)return;const k=b.parentElement.dataset.h,v=b.dataset.hv;
  if(k==='vp'){S.ui.vp=v;applyVp();requestAnimationFrame(()=>renderAll());}
  if(k==='theme'){S.settings.theme=v;}
  if(k==='auth'){S.signedIn=v==='in';S.ui.overlay=null;}
  if(k==='demo')demo(v);
  renderAll();});
$('#hxReset').addEventListener('click',()=>{try{localStorage.removeItem(KEY);}catch(e){}const vp=S.ui.vp;S=seed();S.ui.vp=vp;TOAST=null;$('#winlayer').innerHTML='';Object.keys(SCROLL).forEach(k=>delete SCROLL[k]);renderAll();});
function demo(v){
  S.ui.overlay=null;
  if(v==='three'){openApp('meds',{tab:'stock'});openApp('metrics',{range:'30d'});openApp('history',{filter:'bp'});if(!isWide())S.ui.overlay='switcher';}
  if(v==='side'){const a=openApp('meds');const b=openApp('metrics');S.wins.forEach(w=>{w.min=!(w===a||w===b);});tidy();focusWin(b.id);}
  if(v==='food'){Object.assign(S.drafts.food,{desc:'Ham sandwich',source:'salt',unit:'g',amt:'1.5'});S.ui.logForm='food';S.showHome=true;}
  if(v==='titr'){S.meds.titration='ready';openApp('meds',{tab:'titr'});}
}
addEventListener('resize',()=>{applyVp();renderAll();});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.settings.theme==='system')renderAll();});

/* ============================================================ boot */
load();computeBase();applyVp();renderAll();
</script>
