<!doctype html>
<!-- PROTOTYPE (throwaway): Field Instrument (hardware faceplate, keypad, rack modules) — intake-tracker app-OS concept -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Instrument · intake-tracker prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Chivo:wght@400;600;700&family=DotGothic16&family=Doto:wght@800&display=swap" rel="stylesheet">
<style>
/* ---------- page / harness backdrop (outside the product) ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#5b5a57;overflow:hidden}
body.framed{overflow:auto}
#stage{width:100vw;height:100dvh}
body.framed #stage{width:auto;height:auto;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}

/* ---------- theme tokens ---------- */
.app{
  --chassis:#DAD6CD;--module:#EEEBE4;--key:#F8F6F1;--lip:#ABA496;--ink:#34332F;--ink2:#5B5850;--rule:#C2BDB1;--well:#E4E0D7;
  --glass:#0F1011;--bezel:#C6C1B5;--bezel-hl:rgba(255,255,255,.65);--hl:rgba(255,255,255,.95);--screw:rgba(52,51,47,.32);
  --inv-bg:#34332F;--inv-fg:#F4F2EC;--led-off:#BDB8AC;
  --g-fg:#EDEDE8;--g-mu:#8F8F89;--g-off:#2A2B2E;--g-rule:#24252A;
  --water:#0A67B5;--sodium:#8C5A00;--sugar:#B01E62;--caffeine:#7D4B28;--alcohol:#653CC9;--bp:#BA2424;--weight:#137645;--bath:#6B620E;--meds:#06746B;--ai:#3B47C9;--potassium:#4F6B12;
  --water-g:#3FB4FF;--sodium-g:#FFC53D;--sugar-g:#FF7BB8;--caffeine-g:#D6975F;--alcohol-g:#B38AFF;--bp-g:#FF5B55;--weight-g:#4ED98E;--bath-g:#D2C45A;--meds-g:#2ED6C6;--ai-g:#92A1FF;--potassium-g:#A9D65A;
  --on-c:#FFFFFF;--focus:#34332F;
  --f-dot:"Doto","DotGothic16",monospace;--f-eng:"Chivo",sans-serif;--f-mono:"Chivo Mono",monospace;
}
.app.dark{
  --chassis:#1F201C;--module:#282925;--key:#353631;--lip:#0D0E0C;--ink:#DEDBD3;--ink2:#A9A69C;--rule:#41423C;--well:#191A17;
  --glass:#030304;--bezel:#45463F;--bezel-hl:rgba(255,255,255,.16);--hl:rgba(255,255,255,.10);--screw:rgba(222,219,211,.28);
  --inv-bg:#EFECE4;--inv-fg:#151613;--led-off:#46473F;
  --water:#3FB4FF;--sodium:#FFC53D;--sugar:#FF7BB8;--caffeine:#D6975F;--alcohol:#B38AFF;--bp:#FF5B55;--weight:#4ED98E;--bath:#D2C45A;--meds:#2ED6C6;--ai:#92A1FF;--potassium:#A9D65A;
  --on-c:#111210;--focus:#EFECE4;
}

/* ---------- device ---------- */
.app{
  container-type:inline-size;container-name:app;
  position:relative;width:100vw;height:100dvh;overflow:hidden;border-radius:0;
  background:var(--chassis);color:var(--ink);
  font:400 15px/1.4 var(--f-eng);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  display:flex;flex-direction:column;
}
body.framed .app{flex:none}
body.f390 .app{width:390px;height:844px}
body.f1280 .app{width:1280px;height:800px}
.app button{font:inherit;color:inherit}
.app :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.glass :focus-visible,.glass:focus-visible{outline-color:#EDEDE8}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eng{font:600 11px/1.2 var(--f-eng);text-transform:uppercase;letter-spacing:.08em}
.dot{font-family:var(--f-dot);font-weight:800;line-height:1;letter-spacing:.02em}
.figm{font-family:var(--f-mono);font-weight:500;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chrome,.sysbar,.modes,.keypad-mod,.strips,.mod-head,.tabs{user-select:none;-webkit-user-select:none}
.mod-body{user-select:text}
.wd-only{display:none!important}

/* ---------- keycaps: square, hard lip (the single elevation device) ---------- */
.kc{appearance:none;border:0;cursor:pointer;background:var(--key);color:var(--ink);border-radius:2px;
  box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px rgba(0,0,0,.07),0 3px 0 var(--lip);
  transition:transform 50ms linear,box-shadow 50ms linear;min-height:44px;min-width:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app.dark .kc{box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px rgba(255,255,255,.03),0 3px 0 var(--lip)}
.kc:active,.kc.down{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hl),0 1px 0 var(--lip)!important}
.kc.inv,.kc[aria-pressed="true"],.kc[aria-selected="true"]{background:var(--inv-bg);color:var(--inv-fg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 3px 0 var(--lip)}
.kc[disabled]{cursor:not-allowed;background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--rule)!important;transform:none}
.kc.sm{min-height:44px;padding:0 14px;font-size:14px}
.kc.pri{background:var(--inv-bg);color:var(--inv-fg)}
.kc.pri[disabled]{background:transparent;color:var(--ink2)}
.kc.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;display:inline-block;vertical-align:-3px;flex:none}

/* ---------- system bar: one 44px faceplate strip ---------- */
.sysbar{flex:none;display:flex;align-items:stretch;height:44px;border-bottom:1px solid var(--rule);background:var(--chassis)}
.sb-seg{appearance:none;border:0;background:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;padding:0 12px;min-width:44px;height:44px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.sb-seg:active{background:var(--well)}
.sb-seg.icon{width:48px;padding:0;justify-content:center}
.sb-dose{border-right:1px solid var(--rule)}
.sb-acct,.sb-gear{border-left:1px solid var(--rule)}
.sb-spacer{flex:1}
.led-dot{width:8px;height:8px;flex:none;border:1.5px solid var(--c);display:inline-block}
.led-dot.on{background:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.sb-dose .mono{font-size:14px}
.sb-sync{color:var(--ink2);font-size:12px;cursor:default;display:inline-flex;align-items:center;gap:6px;padding:0 12px}
.initials{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;background:var(--inv-bg);color:var(--inv-fg);font:600 11px var(--f-eng);letter-spacing:.06em;border-radius:2px}
.initials i{position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;background:var(--meds);border:2px solid var(--chassis)}
.signin{flex-direction:column;align-items:flex-start!important;justify-content:center;gap:0!important;line-height:1.15}
.signin b{font:600 13px var(--f-eng)}
.signin small{font-size:12px;color:var(--ink2)}
.acct-pop{top:48px;right:8px}

/* ---------- body grid (phone first) ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top" "mid" "modes";gap:8px;padding:8px 8px calc(14px + env(safe-area-inset-bottom))}
.display-mod{grid-area:top}
.readout{grid-area:top;display:none}
.keypad-mod{grid-area:mid;display:flex;flex-direction:column;min-height:0}
.rack{grid-area:mid;display:none;position:relative;min-height:0}
.modes{grid-area:modes}
.app.is-app .display-mod{display:none}
.app.is-app .readout{display:block}
.app.is-app .keypad-mod{display:none}
.app.is-app .rack{display:block}

/* ---------- display module: dark glass inset in a lit bezel ---------- */
.bezel{background:var(--bezel);padding:5px;border-radius:3px;box-shadow:inset 0 1px 0 var(--bezel-hl),inset 0 0 0 1px rgba(0,0,0,.18)}
.glass{background:var(--glass);border-radius:2px;box-shadow:inset 0 0 0 1px #000,inset 0 2px 6px rgba(0,0,0,.55);color:var(--g-fg);padding:6px 8px 6px}
.gcols{display:grid;grid-template-columns:98px repeat(7,minmax(0,1fr));column-gap:2px}
.g-head{align-items:end;height:18px;border-bottom:1px solid var(--g-rule);padding-bottom:2px;margin-bottom:1px}
.g-head .hd{font:600 11px/1 var(--f-eng);letter-spacing:.08em;color:var(--g-mu);text-align:center;padding:2px 0}
.g-head .hd.now{background:var(--g-fg);color:var(--glass)}
.g-head .hl{text-align:left}
.g-row{grid-template-rows:auto 26px;row-gap:1px;width:100%;padding:3px 0 3px;border:0;border-bottom:1px solid var(--g-rule);background:none;text-align:left;cursor:pointer;color:var(--g-fg)}
.g-row:last-child{border-bottom:0}
.g-l1{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;height:16px}
.g-l1 .lab{display:inline-flex;align-items:center;gap:5px;color:var(--c);white-space:nowrap}
.g-l1 .lab .ic{width:13px;height:13px}
.g-l1 .lab .eng{color:var(--g-fg)}
.gst{font:400 12px/16px var(--f-eng);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--g-mu)}
.gst .over{color:var(--c);padding-bottom:3px;background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 3.5px) left bottom/100% 3px no-repeat}
.gst .lim{background:var(--c);color:var(--glass);font-weight:600;padding:0 4px}
.g-fig{display:flex;align-items:baseline;gap:3px;color:var(--c);white-space:nowrap;align-self:center}
.g-fig .dot{font-size:24px}
.g-fig .figm{font-size:22px}
.g-fig small{font:400 12px var(--f-mono);color:var(--g-mu)}
.c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:26px;min-width:0;font:400 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--g-fg);letter-spacing:-.03em}
.c .u{display:block;width:72%;height:3px;background:var(--g-off)}
.c.ok .u{background:var(--c);opacity:.55}
.c.over .u{height:4px;background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 3.5px);opacity:1}
.c.lim{background:var(--c);color:var(--glass);font-weight:500}
.c.lim .u{background:var(--glass)}
.c.fut{color:var(--g-mu)}
.c.now{box-shadow:inset 0 0 0 1px var(--g-fg)}
.bar{position:relative;width:12px;height:20px;background:var(--g-off)}
.bar .f{position:absolute;left:0;right:0;bottom:0;background:var(--c)}
.bar .fh{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 3.5px);box-shadow:inset 0 0 0 1px var(--c)}
.bar .tk{position:absolute;left:-4px;right:-4px;height:2px;background:var(--g-fg)}
.c.lim .bar{background:rgba(0,0,0,.3)}
.c.lim .bar .f{background:var(--glass)}
.c.lim .bar .tk{background:var(--glass)}

/* readout strip (phone, app open) */
.readout{padding:4px}
.ro{display:block;width:100%;border:0;cursor:pointer;text-align:left;padding:5px 6px 2px}
.ro-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.ro-c{display:flex;flex-direction:column;gap:1px;min-width:0;padding:0 3px;color:var(--g-fg)}
.ro-n{color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
.ro-v{font:500 13px/16px var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ro-v small{font:400 12px var(--f-mono);color:var(--g-mu)}
.ro-l{font:400 12px/15px var(--f-mono);color:var(--g-mu);white-space:nowrap}
.ro-c.over .ro-v{align-self:flex-start;padding-bottom:3px;background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 3.5px) left bottom/100% 3px no-repeat}
.ro-c.over .ro-l{color:var(--c)}
.ro-c.limit{background:var(--c)}
.ro-c.limit .ro-n,.ro-c.limit .ro-v,.ro-c.limit .ro-v small,.ro-c.limit .ro-l{color:var(--glass)}
.ro-grip{display:flex;align-items:center;justify-content:center;gap:6px;height:16px;margin-top:2px;color:var(--g-mu);font:600 11px var(--f-eng);letter-spacing:.08em;text-transform:uppercase}
.ro-grip::before,.ro-grip::after{content:"";width:22px;height:2px;background:var(--g-mu)}
.ro-msg{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 4px 0 8px;margin-top:4px;background:var(--module);color:var(--ink);font-size:13px}
.ro-msg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- keypad ---------- */
.silk{display:flex;justify-content:space-between;align-items:center;gap:8px;height:44px;padding:0 2px 4px;color:var(--ink2)}
.silk .legend{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.silk .msg{flex:1;min-width:0;color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.silk .msg .ic{color:var(--meds)}
.kp-hide{display:none}
.kp{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px 8px}
.kcell{display:flex;flex-direction:column;min-height:0;min-width:0}
.key{flex:1;min-height:44px;display:grid;place-items:center;color:var(--c);padding:0}
.key .hero-n{font-size:28px}
.key .hero-i .ic{width:28px;height:28px;stroke-width:1.3}
.kl{display:flex;flex-direction:column;gap:1px;padding:6px 1px 0;min-width:0}
.kl .eng{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.05em}
.kl .kd{font:400 12px/1.2 var(--f-mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- mode strip (LED row reserved inside, no negative offsets) ---------- */
.modes{display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr)) 48px;column-gap:4px}
.modes.ai{grid-template-columns:44px repeat(4,minmax(0,1fr)) 48px 54px}
.mcell{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.ledrow{height:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.led{display:block;width:18px;height:3px;background:var(--led-off)}
.led.lit{background:var(--c,var(--ink))}
.badge{display:inline-block;min-width:16px;height:14px;padding:0 3px;background:var(--meds);color:var(--on-c);font:500 12px/14px var(--f-mono);text-align:center}
.ledrow .eng{color:var(--ink2);letter-spacing:.06em}
.mk{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 1px;min-width:0}
.mk .eng{font:600 12px/1.1 var(--f-eng);text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mk .ic{color:var(--c,currentColor)}
.mk.inv .ic{color:inherit}
.ai-key{align-self:center;width:50px;height:50px;border-radius:50%;background:var(--ai);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;padding:0}
.app.dark .ai-key{color:#111}
.ai-key .ic{width:18px;height:18px}
.ai-key .eng{font-size:11px;letter-spacing:.06em}
.ai-key.held{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hl),0 1px 0 var(--lip)}

/* ---------- rack & modules ---------- */
.strips{display:none}
.modules{position:absolute;inset:0}
.module{position:absolute;inset:0;background:var(--module);display:flex;flex-direction:column;min-height:0;visibility:hidden;pointer-events:none;box-shadow:inset 0 0 0 1px var(--rule)}
.module.is-focus{visibility:visible;pointer-events:auto}
.module.enter{animation:bayin 120ms ease-out}
@keyframes bayin{from{transform:translateY(14px)}to{transform:none}}
.screw{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--screw)}
.screw.a{left:5px;top:5px}.screw.b{right:5px;top:5px}.screw.c{left:5px;bottom:5px}.screw.d{right:5px;bottom:5px}
.mod-head{display:flex;align-items:center;gap:4px;height:52px;padding:0 6px 0 12px;border-bottom:1px solid var(--rule)}
.mod-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:10px;position:relative}
.mod-title::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:3px;background:var(--c,var(--ink))}
.mod-title h2{margin:0;display:flex;align-items:center;gap:6px}
.mod-title h2 .ic{color:var(--c,var(--ink))}
.mod-title .st{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-head .kc{width:44px;height:44px;padding:0;display:grid;place-items:center}
.tabs{display:flex;gap:6px;padding:6px 10px 9px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .kc{flex:1 0 auto;padding:0 10px;font:600 11px var(--f-eng);letter-spacing:.05em;text-transform:uppercase}
.mod-body{flex:1;min-height:0;overflow:auto;padding:12px 12px 24px;overscroll-behavior:contain}

/* content primitives */
.sec{margin:0 0 18px}
.sec>h3{margin:0 0 8px;color:var(--ink2)}
.rows{border-top:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);min-height:52px}
.row .grow,.grow{flex:1;min-width:0}
.row .t{font:400 13px var(--f-mono);color:var(--ink2);width:46px;flex:none}
.row .title{font-weight:600}
.meta{font-size:13px;color:var(--ink2)}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine{border-left:3px solid var(--c);padding-left:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 6px;font:500 12px var(--f-mono);border:1.5px solid var(--c,var(--ink));color:var(--c,var(--ink));border-radius:1px;white-space:nowrap}
.nh{display:inline-block;width:8px;height:8px;flex:none;background:repeating-linear-gradient(135deg,currentColor 0 1.4px,transparent 1.4px 3px);box-shadow:inset 0 0 0 1px currentColor}
.note{font-size:13px;color:var(--ink2)}
.quiet{font-size:13px;color:var(--ink2);padding:8px 0;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule)}
.notice{display:flex;align-items:center;gap:12px;padding:6px 0;margin-bottom:14px;border-top:1px dashed var(--rule);border-bottom:1px dashed var(--rule);font-size:14px}
.notice .kc{flex:none;padding:0 18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span:first-child{color:var(--ink2)}
.inp{height:44px;border:0;border-bottom:2px solid var(--ink2);background:var(--well);color:var(--ink);font:400 15px var(--f-eng);padding:0 10px;border-radius:0;width:100%;min-width:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.inp.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inp:focus{outline:2px solid var(--focus);outline-offset:1px}
.inp::placeholder{color:var(--ink2);opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.segctl{display:flex;gap:6px;flex-wrap:wrap}
.segctl .kc{flex:1;min-width:0;padding:0 8px;font-size:14px}
.sw{display:inline-flex;align-items:center;gap:8px;padding:0 12px;min-width:76px;justify-content:center;font:600 11px var(--f-eng);letter-spacing:.08em}
.sw i{width:8px;height:8px;border:1.5px solid currentColor;display:inline-block}
.sw[aria-checked="true"] i{background:currentColor}
.conv{font:500 14px var(--f-mono);padding:8px 10px;border-left:3px solid var(--sodium);background:var(--well);margin:4px 0 12px}
.fig-m{font-size:24px;color:var(--c)}
.fig-m.figm{font-size:21px}
.card{border-top:3px solid var(--c,var(--ink));padding:10px 0 4px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .inp{text-align:center;font-size:20px;height:52px}
.stepper .kc{height:52px;min-width:64px;font:500 15px var(--f-mono)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.numpad .kc{font:500 20px var(--f-mono);height:48px}
.bpf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bpf .inp{height:56px;font-size:24px;text-align:center}
.bpf .inp::placeholder{font-size:14px}
.bpf label.sel .inp{outline:2px solid var(--bp);outline-offset:1px}
.preset{display:flex;align-items:center;gap:10px;width:100%;justify-content:flex-start;padding:0 12px;min-height:52px;margin-bottom:10px;text-align:left}
.preset .grow{flex:1}
.preset .mono{font-size:13px;color:var(--ink2)}
.chart{width:100%;height:auto;display:block;margin:4px 0 8px}
.chart text{font:400 11px var(--f-mono);fill:var(--ink2)}
.pill-oval{display:inline-block;width:30px;height:16px;border-radius:50%;background:#D9CCEF;border:1px solid #8E7CB5;vertical-align:middle;flex:none}
.pill-round{display:inline-block;width:16px;height:16px;border-radius:50%;background:#FFFFFF;border:1px solid #9A968C;vertical-align:middle;flex:none}
.edit-box{background:var(--well);padding:10px;margin:6px 0 10px}
/* history ledger */
.fstrip{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 -12px 6px;padding:2px 12px 5px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
.fstrip::-webkit-scrollbar{display:none}
.fstrip .kc{flex:none;min-width:44px;padding:0 8px;font:500 13px var(--f-mono);color:var(--c,var(--ink));border-radius:0;margin-right:-1px}
.fstrip .kc[aria-pressed="true"]{color:var(--inv-fg)}
.fshow{font-size:12px;color:var(--ink2);margin:0 0 10px}
.hrec{border-bottom:1px solid var(--rule)}
.hrec-b{display:grid;grid-template-columns:44px 18px minmax(0,1fr) 12px;gap:8px;align-items:center;width:100%;min-height:44px;padding:5px 0;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.hrec-b .t{font:400 13px var(--f-mono);color:var(--ink2)}
.hrec-b .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrec-b .meta{font:400 12px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrec-b .chev{color:var(--ink2);font:500 12px var(--f-mono)}
.hrec.open .hrec-b{background:var(--well)}
.hact{display:flex;gap:8px;padding:6px 0 10px 52px;background:var(--well)}
/* settings rows: engraved label, value, stepper */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:10px;min-height:56px;border-bottom:1px solid var(--rule);padding:4px 0}
.srow .slab{display:flex;flex-direction:column;gap:2px;min-width:0}
.srow .slab .eng{color:var(--ink2)}
.srow .slab .note{font-size:12px}
.srow .sval{font:500 15px var(--f-mono);text-align:right;min-width:70px;white-space:nowrap}
.srow .step{display:flex;gap:6px}
.srow .step .kc{width:44px;padding:0;font:500 18px/1 var(--f-mono)}
.srow.sw-row{grid-template-columns:minmax(0,1fr) auto}
.sgh{display:flex;align-items:center;gap:8px;margin:18px 0 0;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.sgh .eng{color:var(--ink)}
.sgh .mono{margin-left:auto;font-size:12px;color:var(--ink2)}
.ufield{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--rule)}
.ufield .eng{color:var(--ink2)}
.ufield input{height:40px;border:0;border-bottom:2px solid var(--ink2);background:transparent;color:var(--ink);font:400 15px var(--f-mono);padding:0 2px}
.ufield input:focus{outline:2px solid var(--focus);outline-offset:1px}

/* ---------- overlays ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,10,10,.35);z-index:20}
.sheet{position:absolute;inset:0;z-index:30;background:var(--chassis);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet.enter{animation:sheetin 150ms ease-out}
@keyframes sheetin{from{transform:translateY(24px)}to{transform:none}}
.sheet-head{display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 16px;border-bottom:1px solid var(--rule)}
.sheet-head h2{flex:1;margin:0}
.sheet-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 32px;user-select:text}
.grp{border-bottom:1px solid var(--rule)}
.grp-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:0 2px;min-height:52px;cursor:pointer;text-align:left;color:var(--ink)}
.grp-h .sum{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.grp-h .pm{font:500 14px var(--f-mono);color:var(--ink2);width:12px}
.grp-b{padding:0 2px 16px}
.pop{position:absolute;z-index:30;background:var(--module);box-shadow:0 0 0 1px var(--rule),0 3px 0 var(--lip);padding:8px;min-width:250px}
.pop .kc{width:100%;justify-content:flex-start;display:flex;align-items:center;gap:8px;padding:0 12px;margin-bottom:8px;text-align:left}
.pop .stat{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 4px 8px;font-size:13px;color:var(--ink2)}
.switcher{left:8px;right:8px;bottom:calc(86px + env(safe-area-inset-bottom))}
.sw-list .kc.main{display:flex;align-items:center;gap:10px;padding:6px 12px;text-align:left;min-height:52px;width:100%}
.sw-list .row2{display:flex;gap:8px;margin-bottom:8px}
.sw-list .kc.main .grow{flex:1;min-width:0}
.sw-list .kc.main .st{font-size:12px;color:inherit;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-h{display:flex;justify-content:space-between;align-items:center;min-height:32px;padding:0 4px 6px;color:var(--ink2)}
.pop-h .note{font-size:12px}
.mic-panel{position:absolute;z-index:25;left:8px;right:8px;bottom:calc(86px + env(safe-area-inset-bottom));background:var(--bezel);padding:5px;border-radius:3px;box-shadow:inset 0 1px 0 var(--bezel-hl),0 3px 0 var(--lip)}
.mic-panel .glass{padding:12px}
.mic-panel .inner{background:var(--module);padding:8px}
.meter{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;height:18px;margin:10px 0}
.meter i{background:var(--g-off)}
.meter i.on{background:var(--ai-g)}
.mic-h{display:flex;justify-content:space-between;align-items:baseline;color:var(--g-mu);padding-bottom:4px;border-bottom:1px solid var(--g-rule)}
.mic-tr{font:400 15px/1.4 var(--f-mono);color:var(--g-fg);min-height:42px}
.mic-hint{font-size:12px;color:var(--g-mu);margin-top:6px}
.mic-panel.cancel .glass{box-shadow:inset 0 0 0 2px var(--g-fg)}
.rv-row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px 8px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:center}
.rv-h{display:flex;align-items:center;gap:6px}
.rv-f{display:flex;align-items:center;gap:6px;font:400 13px var(--f-mono);flex-wrap:wrap}
.rv-row .inp{width:72px;height:44px}
.rv-row>.kc{grid-column:2;grid-row:1/3;width:44px;padding:0;display:grid;place-items:center}

/* phone: keypad pulled up over an open app */
.app.is-app.kp-up .keypad-mod{display:flex;position:absolute;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));height:min(430px,58%);z-index:18;background:var(--chassis);padding:4px 8px 8px;border-top:1px solid var(--rule);box-shadow:0 -3px 0 var(--lip)}
.app.is-app.kp-up .kp-hide{display:inline-flex;align-items:center;gap:6px}
.app.is-app.kp-up .kp .kl .kd{display:none}

/* ---------- WIDE (container >= 768) ---------- */
@container app (min-width:768px){
  .wd-only{display:revert!important}
  .ph-only{display:none!important}
  .sysbar .sb-sync.wd-only{display:inline-flex!important}
  .body{grid-template-columns:460px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top rack" "mid rack" "modes rack";gap:10px 14px;padding:10px 14px 14px}
  .app.is-app .display-mod{display:block}
  .readout,.app.is-app .readout{display:none!important}
  .app .keypad-mod,.app.is-app .keypad-mod{display:flex;position:static;height:auto;box-shadow:none;border:0;padding:0;background:none}
  .kp,.app.is-app .kp{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
  .app.is-app .kp .kl .kd{display:block}
  .kp-hide,.app.is-app.kp-up .kp-hide{display:none}
  .gcols{grid-template-columns:104px repeat(7,minmax(0,1fr))}
  .modes,.modes.ai{grid-template-columns:repeat(4,minmax(0,1fr))}
  .modes.ai{grid-template-columns:repeat(4,minmax(0,1fr)) 64px}
  .rack,.app.is-app .rack{display:flex;grid-area:rack;flex-direction:column;gap:8px}
  .strips{display:flex;flex-direction:column;gap:6px;flex:none}
  .strip{position:relative;display:flex;align-items:stretch;height:44px;background:var(--module);box-shadow:inset 0 0 0 1px var(--rule)}
  .strip .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0 12px 0 18px;color:var(--ink)}
  .strip .open::before{content:"";width:3px;height:20px;flex:none;background:var(--c,var(--ink))}
  .strip .open .ic{color:var(--c,var(--ink))}
  .strip .open .eng{width:112px;flex:none;text-align:left}
  .strip .open .fig{flex:1;min-width:0;text-align:right;font:500 14px var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip .x{background:none;border:0;border-left:1px solid var(--rule);width:48px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .strip .screw.a{top:50%;margin-top:-1.5px;left:7px}.strip .screw.d{top:50%;margin-top:-1.5px;right:auto;left:auto}
  .modules{position:relative;inset:auto;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .module{position:relative;inset:auto;display:none;visibility:visible;pointer-events:auto}
  .module.is-exp{display:flex}
  .module.is-focus{box-shadow:inset 0 0 0 1px var(--rule),inset 0 3px 0 var(--c,var(--ink))}
  .module.enter{animation:none}
  .module.is-exp.enter2{animation:bayin 120ms ease-out}
  .empty-bay{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:var(--ink2);text-align:center;padding:24px}
  .mic-panel{left:14px;right:auto;width:460px;bottom:92px}
  .switcher{left:14px;right:auto;width:460px;bottom:92px}
  .sheet.drawer{left:auto;width:440px;top:44px;border-left:1px solid var(--rule)}
  .sheet.drawer.enter{animation:drawerin 150ms ease-out}
  @keyframes drawerin{from{transform:translateX(40px)}to{transform:none}}
}
@container app (max-width:767px){ .scrim.wd{display:none} }
.app.bigtext .mod-body,.app.bigtext .sheet-body{font-size:17px}
.app.bigtext .meta{font-size:15px}
.app.rm *,.app.rm *::before{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important;animation:none!important}}

/* ---------- reviewer harness (NOT product UI) — sits in the 14px bottom margin ---------- */
.hx{position:fixed;left:0;bottom:0;z-index:9999;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#111;display:flex;flex-direction:column-reverse;gap:4px;align-items:flex-start}
.hx .hx-tab{height:13px;padding:0 8px;border:0;background:#c0169b;color:#fff;cursor:pointer;font:700 9px/13px ui-monospace,monospace;letter-spacing:.1em}

.hx details{background:#fffbe6;border:2px dashed #c0169b;padding:4px 8px;max-width:260px}

.hx .hrow{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0}
.hx button{font:inherit;padding:3px 7px;border:1px solid #111;background:#fff;cursor:pointer}
.hx button[aria-pressed="true"]{background:#111;color:#fff}
.hx a{color:#111;display:block;padding:2px 0}

 metrics:{title:'Metrics',short:'Metrics',ic:'metrics',dom:null},

/* ---------- derived data ---------- */
/* one vocabulary everywhere: "target", and "limit = target + buffer" */
const lim=k=>{const l=S.set.lim[k];if(!l)return null;const target=num(l.target,0),buffer=num(l.buffer,0);return {target,buffer,limit:target+buffer}};
function status(v,l){
 if(!l)return {s:'none'};
 if(v<=l.target)return {s:'ok',left:l.target-v};
 if(v<=l.limit)return {s:'over',over:v-l.target};
 return {s:'limit',over:v-l.limit,overT:v-l.target};
}
const ds=()=>S.set.dayStart*60;
const todayRecs=()=>S.records.filter(r=>r.t>=ds());
const spillRecs=()=>S.records.filter(r=>r.t<ds());
function totals(recs){
 const t={water:0,sodium:0,sugar:0,caffeine:0,alcohol:0,potassium:0};
 for(const r of recs){
  if(r.kind==='water')t.water+=num(r.ml,0);
  if(r.kind==='drink'){t.water+=num(r.ml,0);t.caffeine+=num(r.caf,0);t.alcohol+=num(r.std,0);t.sugar+=num(r.sugar,0)}
  if(r.kind==='food'){t.sodium+=num(r.na,0);t.sugar+=num(r.sugar,0)}
 }
 t.alcohol=Math.round(t.alcohol*10)/10;return t;
}
function week(k){ // 7 values (null = not yet) in display order + heads + today index
 const td=totals(todayRecs())[k],sp=totals(spillRecs())[k];
 const monVals=WEEK_BASE[k].map((v,i)=>i===5?Math.round((v+sp)*10)/10:v).concat([td]);
 if(S.set.weekStart==='sun')return {vals:[td,null,null,null,null,null,null],heads:['S','M','T','W','T','F','S'],today:0,names:['Sun 27 Sep','Mon 28 Sep','Tue 29 Sep','Wed 30 Sep','Thu 1 Oct','Fri 2 Oct','Sat 3 Oct']};
 return {vals:monVals,heads:['M','T','W','T','F','S','S'],today:6,names:DAYS};
}
const ROWS=[
 {k:'water',unit:'ml',unitLong:'millilitres',wf:v=>fmt(v),ff:v=>fmt(v)},
 {k:'sodium',unit:'mg',unitLong:'milligrams',wf:v=>fmt(v),ff:v=>fmt(v)},
 {k:'sugar',unit:'g',unitLong:'grams',wf:v=>fmt(v),ff:v=>fmt(v),opt:'sugar'},
 {k:'caffeine',unit:'mg',unitLong:'milligrams',wf:v=>fmt(v),ff:v=>fmt(v)},
 {k:'alcohol',unit:'std',unitLong:'standard drinks',wf:v=>v.toFixed(1),ff:v=>v.toFixed(1)},
 {k:'potassium',unit:'mg',unitLong:'milligrams',wf:v=>fmt(v),ff:v=>fmt(v),opt:'potassium'}
];
const visRows=()=>ROWS.filter(r=>!r.opt||S.set.trackers[r.opt]);
function statusLine(r,v){
 const l=lim(r.k),st=status(v,l);
 const u=r.k==='alcohol'?'std drinks':r.unit;
 if(st.s==='none')return {h:'no limit set',plain:'no limit set',aria:'no limit set'};
 if(st.s==='ok')return {h:`${fmt(st.left)} ${u} left · target ${fmt(l.target)}`,plain:`${fmt(st.left)} ${u} left · target ${fmt(l.target)}`,aria:`${fmt(st.left)} ${u} left before the ${fmt(l.target)} target`};
 if(st.s==='over')return {h:`<span class="over">${fmt(st.over)} ${u} past target</span> · limit ${fmt(l.limit)}`,plain:`${fmt(st.over)} ${u} past target · limit ${fmt(l.limit)}`,aria:`${fmt(st.over)} ${u} past the ${fmt(l.target)} target; limit is ${fmt(l.limit)}`};
 return {h:`<span class="lim">▲ ${fmt(st.over)} ${u} over limit</span>`,plain:`▲ ${fmt(st.over)} ${u} over limit (${fmt(l.limit)})`,aria:`${fmt(st.over)} ${u} over the ${fmt(l.limit)} limit`};
}
const fmtT=m=>{const h=Math.floor(m/60),mi=m%60;if(S.set.timeFmt==='12'){const hh=h%12||12;return `${hh}:${String(mi).padStart(2,'0')} ${h<12?'am':'pm'}`}return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`};
const parseT=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());return m?Math.min(23,+m[1])*60+Math.min(59,+m[2]):null};

function recText(r){
 switch(r.kind){
  case 'water':return {d:'water',title:`Water ${fmt(r.ml)} ml`,meta:''};
  case 'drink':{const bits=[`${fmt(r.ml)} ml`];if(num(r.caf,0))bits.push(`${fmt(r.caf)} mg caffeine`);if(num(r.std,0))bits.push(`${num(r.std,0).toFixed(1)} std drinks`);if(num(r.sugar,0))bits.push(`${fmt(r.sugar)} g sugar`);
    return {d:num(r.std,0)?'alcohol':(num(r.caf,0)?'caffeine':'water'),title:r.name,meta:bits.join(' · ')};}
  case 'food':{const bits=[`sodium ${fmt(r.na)} mg`];if(num(r.sugar,0))bits.push(`sugar ${fmt(r.sugar)} g`);if(r.src)bits.push(r.src);return {d:'sodium',title:r.desc||'Food',meta:bits.join(' · ')};}
  case 'bp':return {d:'bp',title:`${r.sys}/${r.dia} mmHg${r.hr?` · HR ${r.hr}`:''}`,meta:[r.pos,r.arm&&`${r.arm} arm`,r.irr&&'irregular heartbeat',r.note].filter(Boolean).join(' · ')};
  case 'weight':return {d:'weight',title:`Weight ${num(r.kg,0).toFixed(2)} kg`,meta:''};
  case 'wee':return {d:'bath',title:'Urination',meta:[r.size,r.note].filter(Boolean).join(' · ')};
  case 'bowel':return {d:'bath',title:'Bowel movement',meta:[r.size,r.note].filter(Boolean).join(' · ')};
 }
 return {d:'water',title:'',meta:''};
}
const recDomains=r=>{
 const s=new Set();
 if(r.kind==='water')s.add('water');
 if(r.kind==='drink'){s.add('water');if(num(r.caf,0))s.add('caffeine');if(num(r.std,0))s.add('alcohol');if(num(r.sugar,0))s.add('sugar')}
 if(r.kind==='food'){s.add('sodium');if(num(r.sugar,0))s.add('sugar')}
 if(r.kind==='bp')s.add('bp');if(r.kind==='weight')s.add('weight');if(r.kind==='wee'||r.kind==='bowel')s.add('bath');
 return s;
};

function touchExpand(id){
 const e=S.expanded.filter(x=>x!==id);e.push(id);
 while(e.length>2)e.shift();
 S.expanded=e.filter(x=>S.windows.includes(x));
}
function closeApp(id){
 const i=S.windows.indexOf(id);if(i<0)return;
 S.windows.splice(i,1);delete S.apps[id];
 S.expanded=S.expanded.filter(x=>x!==id);
 const col=S.windows.filter(x=>!S.expanded.includes(x));
 if(S.expanded.length<2&&col.length)S.expanded.unshift(col[col.length-1]);
 if(S.focus===id){S.focus=S.windows.length?(S.windows[Math.max(0,i-1)]||S.windows[0]):'home';if(S.focus!=='home')U.enter=S.focus}
}
function cycle(d){
 if(!S.windows.length)return;
 let i=S.windows.indexOf(S.focus);
 if(i<0){const j=S.windows.indexOf(S.lastWin);i=j<0?0:j}else i=(i+d+S.windows.length)%S.windows.length;
 S.focus=S.windows[i];S.lastWin=S.focus;U.enter=S.focus;touchExpand(S.focus);
}

/* ======================= RENDER: Today + week gadget (one row per domain) ======================= */
function liveBar(v,l){
 const st=status(v,l);const top=l.limit||1;
 const pct=x=>Math.max(0,Math.min(100,x/top*100));
 const solid=pct(Math.min(v,l.target));const hatchTo=st.s==='ok'?solid:pct(v);
 return `<span class="bar" aria-hidden="true"><i class="f" style="height:${st.s==='limit'?100:solid}%"></i>${st.s==='over'?`<i class="fh" style="bottom:${solid}%;height:${hatchTo-solid}%"></i>`:''}<i class="tk" style="bottom:calc(${pct(l.target)}% - 1px)"></i></span>`;
}
function rDisplay(){

 const head=`<div class="g-head gcols" aria-hidden="true"><span class="hd hl">Today</span>${w0.heads.map((h,i)=>`<span class="hd ${i===w0.today?'now':''}">${h}</span>`).join('')}</div>`;
 const rows=visRows().map(r=>{
  const v=t[r.k],l=lim(r.k),sl=statusLine(r,v),w=week(r.k);
  const cells=w.vals.map((x,i)=>{
   if(i===w.today){
    if(l){const st=status(x,l);return `<span class="c now ${st.s==='limit'?'lim':''}">${liveBar(x,l)}</span>`}
    return `<span class="c now">${r.wf(x)}</span>`;
   }
   if(x==null)return `<span class="c fut">·</span>`;
   const st=status(x,l);const cls=st.s==='limit'?'lim':st.s==='over'?'over':st.s==='ok'?'ok':'';
   return `<span class="c ${cls}">${r.wf(x)}${l?'<i class="u"></i>':''}</span>`;
  }).join('');
  const wkAria=w.vals.map((x,i)=>x==null?null:`${w.names[i].slice(0,3)} ${r.wf(x)}${l&&status(x,l).s==='over'?' past target':l&&status(x,l).s==='limit'?' over limit':''}`).filter(Boolean).join(', ');
  const aria=`${DOM[r.k].name} today ${r.ff(v)} ${r.unitLong}, ${sl.aria}. This week: ${wkAria}. Open ${DOM[r.k].name} history`;
  return `<button class="g-row gcols" style="--c:${cv(r.k,1)}" data-act="rowhist" data-arg="${r.k}" aria-label="${esc(aria)}">
   <span class="g-l1"><span class="lab">${ic(DOM[r.k].ic)}<span class="eng">${DOM[r.k].name}</span></span><span class="gst">${sl.h}</span></span>
   <span class="g-fig">${FIG(r.ff(v))}<small>${r.unit}</small></span>${cells}</button>`;
 }).join('');
 return `<div class="bezel"><div class="glass">${head}<div class="g-rows">${rows}</div></div></div>`;
}

  const lt=!l?'no limit':st.s==='ok'?`of ${fmt(l.target)}`:st.s==='over'?`past ${fmt(l.target)}`:`over ${fmt(l.limit)}`;
  return `<span class="ro-c ${st.s}" style="--c:${cv(r.k,1)}"><span class="ro-n eng">${DOM[r.k].name}</span><span class="ro-v">${r.ff(v)} <small>${r.unit}</small></span><span class="ro-l">${lt}</span></span>`}).join('');

function bpAll(){
 const today=todayRecs().filter(r=>r.kind==='bp').map(r=>({d:'Sun 27 Sep',t:fmtT(r.t),sys:+r.sys,dia:+r.dia,hr:r.hr,pos:r.pos,irr:r.irr,note:r.note}));

function wtAll(){
 const today=todayRecs().filter(r=>r.kind==='weight').map(r=>({d:'Sun 27',i:6,kg:num(r.kg,0)}));

}
function bodyMetrics(a){
 const t=totals(todayRecs());

 const mon=k=>{const w=WEEK_BASE[k].slice();w[5]+=totals(spillRecs())[k];return w.concat([t[k]])};
 const cnt=(k,s)=>{const l=lim(k);return mon(k).filter(v=>status(v,l).s===s).length};
 const bps=today?bpAll().filter(b=>b.d==='Sun 27 Sep'):bpAll();
 const wts=today?wtAll().filter(w=>w.i===6):wtAll();
 const bpAvg=bps.length?`${Math.round(avg(bps.map(b=>b.sys)))}/${Math.round(avg(bps.map(b=>b.dia)))}`:'—';
 const wAvg=wts.length?avg(wts.map(w=>w.kg)).toFixed(2):'—';
 const line=(k,fig,unit,expl)=>`<div class="row"><span style="color:${cv(k)}">${ic(DOM[k].ic)}</span><span class="grow"><span class="eng">${DOM[k].name}</span><div class="meta">${expl}</div></span><span style="color:${cv(k)}">${FIG(fig,'fig-m')}</span><span class="mono" style="width:40px;font-size:12px">${unit}</span></div>`;

 let sum='';

 sum+=line('sodium',fmt(today?t.sodium:avg(mon('sodium'))),'mg',limExpl('sodium'));
 if(S.set.trackers.sugar)sum+=line('sugar',fmt(today?t.sugar:avg(mon('sugar'))),'g',limExpl('sugar'));
 sum+=line('caffeine',fmt(today?t.caffeine:avg(mon('caffeine'))),'mg',`${pd} · no limit set`);
 sum+=line('alcohol',(today?t.alcohol:mon('alcohol').reduce((x,y)=>x+y,0)).toFixed(1),'std',today?'today · no limit set':'standard drinks over 7 days · no limit set');
 sum+=line('bp',bpAvg,'mmHg',`average of ${bps.length} reading${bps.length===1?'':'s'}`);
 sum+=line('weight',wAvg,'kg',`average of ${wts.length} reading${wts.length===1?'':'s'}`);
 const longNote=(a.range==='30d'||a.range==='90d'||a.range==='all')?`<p class="quiet">Records start Mon 21 Sep, so this range shows the 7 recorded days.</p>`:'';
 const W=380,H=170,L=34,B=24,T=12,R=6;const lw=lim('water');const maxY=Math.max(1600,lw.limit,...mon('water'))*1.05;
 const y=v=>T+(H-T-B)*(1-v/maxY);const bw=(W-L-R)/7;
 let bars='';mon('water').forEach((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;const solid=Math.min(v,lw.target);const st=status(v,lw);
  if(st.s==='limit'){bars+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" style="fill:var(--water)"/><text x="${x+w/2}" y="${y(v)-3}" text-anchor="middle">▲</text>`}
  else{bars+=`<rect x="${x}" y="${y(solid)}" width="${w}" height="${y(0)-y(solid)}" style="fill:var(--water)"/>`;if(v>lw.target)bars+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(solid)-y(v)}" fill="url(#hw)" style="stroke:var(--water);stroke-width:1"/>`}

  <line x1="${L}" x2="${W-R}" y1="${y(lw.target)}" y2="${y(lw.target)}" style="stroke:var(--ink);stroke-width:1.5"/><text x="${W-R}" y="${y(lw.target)-4}" text-anchor="end">target ${fmt(lw.target)}</text>
  <line x1="${L}" x2="${W-R}" y1="${y(lw.limit)}" y2="${y(lw.limit)}" style="stroke:var(--ink);stroke-width:1.5" stroke-dasharray="5 3"/><text x="${W-R}" y="${y(lw.limit)-4}" text-anchor="end">limit ${fmt(lw.limit)}</text>${bars}<text x="4" y="${T+4}" transform="rotate(-90 8 ${T+60})" text-anchor="end">ml / day</text></svg>`;
 const allbp=bpAll();const bx=i=>L+20+i*((W-L-40)/Math.max(1,allbp.length-1));const by=v=>T+(H-T-B)*(1-(v-50)/(150-50));

 allbp.forEach((b,i)=>{const x=bx(i);bpm+=`<line x1="${x}" x2="${x}" y1="${by(b.sys)}" y2="${by(b.dia)}" style="stroke:var(--bp);stroke-width:1.5"/><rect x="${x-4}" y="${by(b.sys)-4}" width="8" height="8" style="fill:var(--bp)"/><rect x="${x-4}" y="${by(b.dia)-4}" width="8" height="8" style="fill:var(--module);stroke:var(--bp);stroke-width:1.5"/><text x="${x}" y="${H-8}" text-anchor="middle">${b.d.slice(4,6)} Sep</text><text x="${x+8}" y="${by(b.sys)+4}">${b.sys}/${b.dia}</text>${b.irr?`<text x="${x}" y="${by(b.sys)-9}" text-anchor="middle" style="fill:var(--bp)">irregular</text>`:''}`});
 const bpc=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Blood pressure readings: ${allbp.map(b=>`${b.d} ${b.sys} over ${b.dia}${b.irr?', irregular heartbeat, '+b.pos+', '+b.note:''}`).join('; ')}">${bpm}<text x="${L}" y="${T-2}">mmHg · ■ systolic □ diastolic</text></svg>`;

 const aw=wtAll();const wmin=Math.min(...aw.map(w=>w.kg),78.0)-0.05,wmax=Math.max(...aw.map(w=>w.kg),78.6)+0.05;const wy=v=>T+(H-T-B)*(1-(v-wmin)/(wmax-wmin));const wx=i=>L+10+i*((W-L-20)/6);

 wm+=`<polyline fill="none" style="stroke:var(--weight);stroke-width:1.5" points="${aw.map(w=>`${wx(w.i)},${wy(w.kg)}`).join(' ')}"/>`+aw.map(w=>`<rect x="${wx(w.i)-4}" y="${wy(w.kg)-4}" width="8" height="8" style="fill:var(--weight)"/><text x="${wx(w.i)}" y="${wy(w.kg)-8}" text-anchor="middle">${w.kg.toFixed(2)}</text>`).join('')+'MTWTFSS'.split('').map((d,i)=>`<text x="${wx(i)}" y="${H-8}" text-anchor="middle">${d}</text>`).join('');

 const ai=S.signedIn?`<section class="sec"><h3 class="eng" style="color:var(--ai)">${ic('ai')} AI summary</h3>${a.insight?`<p style="margin:0 0 8px">Sodium was past target on ${cnt('sodium','over')} of 7 days and over the limit on ${cnt('sodium','limit')} (Saturday, ${fmt(WEEK_BASE.sodium[5])} mg). Water averaged ${fmt(avg(mon('water')))} ml against a ${fmt(lw.target)} ml target. Caffeine peaked on Friday (238 mg).</p><p class="note" style="margin:0">A summary of your own figures. Not medical advice.</p>`:`<button class="kc sm" data-act="insight" style="box-shadow:inset 3px 0 0 var(--ai),inset 0 1px 0 var(--hl),0 3px 0 var(--lip)">${ic('ai','style="color:var(--ai)"')} Summarise this range with AI</button>`}</section>`:`<p class="quiet">Sign in to use AI features.</p>`;
 return `${longNote}<section class="sec"><h3 class="eng">Summary · ${today?'today':'last 7 days'}</h3><div class="rows">${sum}</div></section>
 <section class="sec"><h3 class="eng">Daily fluid against target and limit</h3>${fluid}<p class="note" style="margin:0">Solid = within target · hatched = past target · ▲ = over limit (limit = target + ${fmt(lw.buffer)} ml buffer).</p></section>
 <section class="sec"><h3 class="eng">Blood pressure · ${allbp.length} readings</h3>${bpc}<div class="rows">${irr}</div></section>

function editBox(r,a){

/* ---------- shared switch ---------- */

 'deldata-yes'(){const old=S.records;S.records=[];U.delData=false;confirm('Deleted all records on this device',()=>{S.records=old});render()},
 delacct(){S.apps.profile.delConfirm=!S.apps.profile.delConfirm;render()},
 'delacct-yes'(){S.apps.profile.delConfirm=false;S.signedIn=false;confirm('Account deleted · records on this device kept',null);render()},
 wstep(d){const a=S.apps.log.water;a.ml=String(Math.max(0,num(a.ml,0)+ +d));render()},
 lwater(){const ml=Math.round(num(S.apps.log.water.ml,0));if(ml>0)addRecords([{kind:'water',ml}],`Logged +${fmt(ml)} ml water`);render()},
 preset(id){const p=PRESETS.find(x=>x.id===id);logPreset(p,S.apps.log.drink.sugar);S.apps.log.drink.sugar='';render()},
 lother(){const d=S.apps.log.drink;const ml=num(d.ml,0),abv=num(d.abv,0);addRecords([{kind:'drink',name:d.name,ml,caf:num(d.caf,0),std:abv?stdOf(ml,abv):0,sugar:num(d.osugar,0)}],`Logged ${d.name} ${fmt(ml)} ml${num(d.osugar,0)?` · ${d.osugar} g sugar`:''}`);Object.assign(d,{name:'',ml:'',osugar:'',caf:'',abv:''});render()},
 ailookup(){const d=S.apps.log.drink;Object.assign(d,{name:'Cola',ml:'330',osugar:'35',caf:'32',abv:''});confirm('AI estimate filled in · check the values',null);render()},
 fsrc(k){S.apps.log.food.src=k;render()},
 funit(u){S.apps.log.food.unit=u;render()},
 aifood(){const f=S.apps.log.food;if(!f.desc)f.desc='Ham sandwich';f.src='salt';f.unit='g';f.amt='1.2';confirm('AI estimate: 1.2 g salt · check it',null);render()},
 lfood(){const f=S.apps.log.food;const amt=num(f.amt,0);const na=Math.round((f.unit==='g'?amt*1000:amt)*NA_FACTOR[f.src]);const srcName={salt:'salt',msg:'MSG',sodium:'sodium'}[f.src];
  addRecords([{kind:'food',desc:f.desc||'Food',na,sugar:num(f.sugar,0),src:amt?`${f.amt} ${f.unit} ${srcName}`:''}],`Logged ${f.desc||'food'} · ${fmt(na)} mg sodium`);S.apps.log.food=appDefaults('log').food;render()},
 np(k){const b=S.apps.log.bp;const f=b.field;if(k==='Next'){b.field=f==='sys'?'dia':f==='dia'?'hr':'sys'}else if(k==='⌫'){b[f]=String(b[f]).slice(0,-1)}else if(String(b[f]).length<3){b[f]=String(b[f])+k;if(String(b[f]).length===3&&f!=='hr')b.field=f==='sys'?'dia':'hr'}render()},
 bpmore(){S.apps.log.bp.more=!S.apps.log.bp.more;render()},
 bpset(arg){const [k,v]=arg.split(':');S.apps.log.bp[k]=v;render()},
 lbp(){const b=S.apps.log.bp;const r={kind:'bp',sys:num(b.sys,0),dia:num(b.dia,0),hr:b.hr?num(b.hr,0):null,pos:b.pos,arm:b.arm,irr:b.irr,note:b.note};addRecords([r],`Logged BP ${r.sys}/${r.dia}${r.hr?` · HR ${r.hr}`:''}`);S.apps.log.bp=appDefaults('log').bp;render()},
 wtstep(d){const a=S.apps.log.weight;a.kg=(Math.round((num(a.kg,78.35)+ +d*S.set.weightStep)*100)/100).toFixed(2);render()},
 lweight(){const kg=num(S.apps.log.weight.kg,0);addRecords([{kind:'weight',kg}],`Logged weight ${kg.toFixed(2)} kg`);render()},
 bsize(arg){const [k,v]=arg.split(':');const b=S.apps.log.bath;b[k]=b[k]===v?'':v;render()},
 lwee(){const b=S.apps.log.bath;addRecords([{kind:'wee',size:b.size,note:b.note}],`Logged urination ${fmtT(NOW)}`);b.size='';b.note='';render()},
 lbowel(){const b=S.apps.log.bath;addRecords([{kind:'bowel',size:b.bsize,note:b.bnote}],`Logged bowel movement ${fmtT(NOW)}`);b.bsize='';b.bnote='';render()},
 rvdel(id){M.entries=M.entries.filter(e=>String(e.id)!==id);render()},
 rvdiscard(){M.phase='idle';M.entries=[];render();focusMicInvoker()},
 rvlog(){const recs=M.entries.map(e=>e.kind==='drink'?{kind:'drink',name:e.name,ml:num(e.ml,0),caf:num(e.caf,0),std:0,sugar:0,t:parseT(e.time)}:{kind:'food',desc:e.name,na:Math.round(num(e.salt,0)*1000*0.393),sugar:0,src:`${e.salt} g salt (AI)`,t:parseT(e.time)});
  const n=recs.length;M.phase='idle';M.entries=[];addRecords(recs,`Logged ${n} ${n===1?'entry':'entries'} from AI`);render();focusMicInvoker()}
};
function focusMicInvoker(){const el=document.getElementById(M.invoker||'ai-key');el&&el.focus()}

/* keypad keys: tap logs, hold opens the form */
function keyTap(id){
 const k=KEYS.find(x=>x.id===id);
 switch(id){
  case 'w250':addRecords([{kind:'water',ml:250}],'Logged +250 ml water');break;
  case 'w500':addRecords([{kind:'water',ml:500}],'Logged +500 ml water');break;
  case 'coffee':logPreset(PRESETS[0],0);break;
  case 'tea':logPreset(PRESETS[1],0);break;
  case 'wee':addRecords([{kind:'wee',size:'',note:''}],`Logged urination ${fmtT(NOW)}`);break;
  case 'bowel':addRecords([{kind:'bowel',size:'',note:''}],`Logged bowel movement ${fmtT(NOW)}`);break;
  default:openForm(k.form);return;
 }
 render();
}
function openForm(f){const tab=f.split(':')[1];openApp('log',tab?{tab}:{});render()}

/* ======================= event wiring ======================= */
document.addEventListener('click',e=>{
 if(U.lpFired&&e.target.closest('[data-key],[data-lp]')){U.lpFired=false;return}
 const k=e.target.closest('[data-key]');
 if(k){keyTap(k.dataset.key);return}
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg||'',b,e)}
});
let lpTimer=null,roSwipe=null,swipe=null;
document.addEventListener('pointerdown',e=>{
 const k=e.target.closest('[data-key]');
 if(k){k.classList.add('down');const def=KEYS.find(x=>x.id===k.dataset.key);U.lpFired=false;clearTimeout(lpTimer);
  if(def.lp)lpTimer=setTimeout(()=>{U.lpFired=true;k.classList.remove('down');openForm(def.lp)},480);}
 const lp=e.target.closest('[data-lp]');
 if(lp){U.lpFired=false;clearTimeout(lpTimer);lpTimer=setTimeout(()=>{U.lpFired=true;const f=ACT[lp.dataset.lp];f&&f()},480)}
 if(e.target.closest('#ro-btn'))roSwipe={y:e.clientY};
 const mod=e.target.closest('.module');
 if(mod&&isWide()){const id=mod.dataset.win;if(S.focus!==id){S.focus=id;S.lastWin=id;touchExpand(id);patch(regions.modes,rModes());patch(regions.sysbar,rSysbar());document.querySelectorAll('.module').forEach(m=>m.classList.toggle('is-focus',m===mod));save()}}
 if(mod&&!isWide()&&!e.target.closest('input,select,textarea,.numpad,.tabs,.fstrip'))swipe={x:e.clientX,y:e.clientY,t:Date.now()};
});
document.addEventListener('pointerup',e=>{
 clearTimeout(lpTimer);document.querySelectorAll('.key.down').forEach(k=>k.classList.remove('down'));
 if(roSwipe){const dy=e.clientY-roSwipe.y;roSwipe=null;if(dy<-30&&!U.kp){U.kp=true;render();U.lpFired=false}}
 if(swipe){const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.abs(dx)>70&&Math.abs(dy)<45&&Date.now()-swipe.t<700&&S.windows.length>1){cycle(dx<0?1:-1);render()}swipe=null}
});
document.addEventListener('pointercancel',()=>{clearTimeout(lpTimer);swipe=null;roSwipe=null});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-key],[data-mic],[data-lp]'))e.preventDefault()});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.bind){let v=t.value;if(t.dataset.numeric)v=+v;setPath(t.dataset.bind,v);if(t.dataset.bpfield)S.apps.log.bp.field=t.dataset.bpfield;render();return}
 if(t.dataset.mbind){const [id,k]=t.dataset.mbind.split(':');const en=M.entries.find(x=>String(x.id)===id);if(en){en[k]=t.value;if(k==='salt'){const s=document.getElementById('rv-na-'+id);if(s)s.textContent=fmt(Math.round(num(t.value,0)*1000*0.393))}}}
});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.bpfield&&S.apps.log&&S.apps.log.bp.field!==t.dataset.bpfield){S.apps.log.bp.field=t.dataset.bpfield;render()}});
document.addEventListener('scroll',e=>{const k=e.target.dataset&&e.target.dataset.scrollKey;if(k){S.scroll[k]=e.target.scrollTop;clearTimeout(scrollSave);scrollSave=setTimeout(save,200)}},true);
let scrollSave=null;
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  if(M.phase==='review'){ACT.rvdiscard();return}
  if(U.overlay){closeOverlay();return}
  if(U.kp){ACT.kp();return}
  if(S.apps.meds&&S.apps.meds.skip){S.apps.meds.skip=null;render();return}
 }
 if(e.key==='ArrowUp'&&e.target.id==='mk-win'){e.preventDefault();ACT.switcher();return}
 if((e.key===' '||e.key==='Enter')&&e.target.dataset&&e.target.dataset.mic&&!e.repeat){e.preventDefault();micStart(e.target)}
});
document.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&M.phase!=='idle'&&M.phase!=='review'){e.preventDefault();micEnd(false)}});

/* ---------- press-and-hold AI logger ---------- */
function micStart(el){
 if(!S.signedIn)return;
 M.invoker=el.id;M.phase='listening';M.t0=performance.now();M.words=0;M.level=0;el.classList.add('held');
 U.overlay=null;render();
 clearInterval(M.timer);let tick=0;
 M.timer=setInterval(()=>{tick++;
  if(tick%2===0&&M.words<TRANSCRIPT.split(' ').length)M.words++;
  const talking=M.words<TRANSCRIPT.split(' ').length;
  M.level=talking?[9,12,7,14,10,6,13,8,11][tick%9]:2;
  patch(regions.overlay,rOverlay());
 },220);
}
function micEnd(cancelled){
 clearInterval(M.timer);document.querySelectorAll('.ai-key.held').forEach(k=>k.classList.remove('held'));
 if(cancelled||M.phase==='cancel'){M.phase='idle';confirm('AI logger cancelled · nothing logged',null);render();return}
 M.phase='review';
 M.entries=[{id:1,kind:'drink',name:'Coffee',ml:'250',caf:'95',time:'09:00'},{id:2,kind:'drink',name:'Coffee',ml:'250',caf:'95',time:'09:00'},{id:3,kind:'food',name:'Ham sandwich',salt:'1.2',time:fmtT(NOW)}];
 render();requestAnimationFrame(()=>document.getElementById('rv-log')?.focus());
}
document.addEventListener('pointerdown',e=>{
 const m=e.target.closest('[data-mic]');if(!m)return;
 e.preventDefault();try{m.setPointerCapture(e.pointerId)}catch(_){}
 const r=m.getBoundingClientRect();M.cx=r.left+r.width/2;M.cy=r.top+r.height/2;
 micStart(m);
});
document.addEventListener('pointermove',e=>{
 if(M.phase!=='listening'&&M.phase!=='cancel')return;
 const d=Math.hypot(e.clientX-M.cx,e.clientY-M.cy);const np=d>90?'cancel':'listening';
 if(np!==M.phase){M.phase=np;patch(regions.overlay,rOverlay())}
});
document.addEventListener('pointerup',e=>{if(M.phase==='listening'||M.phase==='cancel')micEnd(false)});
document.addEventListener('pointercancel',e=>{if(M.phase==='listening'||M.phase==='cancel'){M.phase='cancel';micEnd(true)}});

/* ---------- harness ---------- */
let H={vp:'auto'};try{H=Object.assign(H,JSON.parse(localStorage.getItem(HKEY)||'{}'))}catch(e){}
function applyHarness(){
 document.body.classList.toggle('framed',H.vp!=='auto');
 document.body.classList.toggle('f390',H.vp==='390');
 document.body.classList.toggle('f1280',H.vp==='1280');
 document.querySelectorAll('[data-hx]').forEach(b=>{const [k,v]=b.dataset.hx.split(':');
  const on=(k==='vp'&&H.vp===v)||(k==='th'&&(S.set.theme===v))||(k==='auth'&&((v==='in')===S.signedIn));b.setAttribute('aria-pressed',on)});
 try{localStorage.setItem(HKEY,JSON.stringify(H))}catch(e){}
}
document.getElementById('hx-tab').addEventListener('click',()=>{const h=document.getElementById('hx');h.classList.toggle('open');document.getElementById('hx-tab').setAttribute('aria-expanded',h.classList.contains('open'));document.getElementById('hx-tab').textContent=h.classList.contains('open')?'Hide harness':'REVIEW'});
document.getElementById('hx').addEventListener('click',e=>{
 const b=e.target.closest('[data-hx]');if(!b)return;const [k,v]=b.dataset.hx.split(':');
 if(k==='vp')H.vp=v;
 if(k==='th')S.set.theme=v;
 if(k==='auth'){S.signedIn=v==='in';if(!S.signedIn&&M.phase!=='idle'){M.phase='idle'}U.overlay=null}
 if(k==='reset'){try{localStorage.removeItem(KEY)}catch(_){}S=initialState();U.overlay=null;U.confirm=null;U.kp=false;M.phase='idle'}
 if(k==='demo3'){['meds','metrics','log'].forEach(id=>openApp(id));S.apps.meds.tab='stock';S.apps.metrics.range='30d';S.apps.log.tab='bp';S.apps.log.bp.sys='128';S.apps.log.bp.dia='';S.apps.log.bp.field='dia';S.focus='log';}
 applyHarness();render();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
window.addEventListener('resize',()=>render());
window.__proto={get S(){return S},render,ACT,get U(){return U}};
applyHarness();render();
})();
</script>
