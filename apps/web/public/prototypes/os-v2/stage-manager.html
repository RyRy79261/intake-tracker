<!doctype html>
<!-- PROTOTYPE (throwaway): Stage (centre stage, window rail, Slide Over entry) — intake-tracker app-OS concept -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stage · intake-tracker app-OS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#77746d;overflow:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,h4,p{margin:0}

/* ---------- surfaces ---------- */
/* The device sits right of a 12px reviewer gutter, so the Review control never covers the product. */
#device{
  --sans:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --bar:calc(44px + var(--sat));--t:1;--lc:78px;
  position:relative;overflow:clip;width:calc(100vw - 12px);height:100dvh;margin:0 0 0 12px;
  background:var(--desk);color:var(--ink);
  font:400 calc(15px * var(--t))/1.4 var(--sans);
  container:app / inline-size;-webkit-tap-highlight-color:transparent;
}
#device>*{--dockh:calc(64px + var(--sab))}
#device.big{--t:1.12}
body.vp-390 #device{width:390px;height:844px}
body.vp-1280 #device{width:1280px;height:800px}
#device[data-theme=light]{--desk:#E8E5DE;--stage:#F1EEE8;--win:#FBFAF7;--rule:#CFCAC0;--ink:#1B1A17;--muted:#5F5B53;
  --water:#0D6CB8;--sodium:#8F5E00;--sugar:#B42366;--caffeine:#7F4E2C;--alcohol:#6841C9;--bp:#BD2A2A;--weight:#1A774A;--bath:#6F6614;--meds:#0A776E;--ai:#4150CC;--dim:rgba(27,26,23,.30);color-scheme:light}
#device[data-theme=dark]{--desk:#121210;--stage:#181816;--win:#1F1F1C;--rule:#3A3833;--ink:#ECEAE3;--muted:#A29E94;
  --water:#52AEF5;--sodium:#EDB443;--sugar:#F486B9;--caffeine:#C9966E;--alcohol:#B091F7;--bp:#F4655F;--weight:#5CCB93;--bath:#C4B865;--meds:#3FCABD;--ai:#97A3FA;--dim:rgba(0,0,0,.55);color-scheme:dark}

.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:500 12px/1.25 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.muted{color:var(--muted)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:butt;stroke-linejoin:miter;flex:none;display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bar,.tstrip,#rail,.strip,.apps,#dock,.knob,.micbtn,.seg,.chips,.tabs,.btn,.qkeys{user-select:none;-webkit-user-select:none}
.wbody,.qbody,.set-body{user-select:text}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- system bar ---------- */
#bar{position:absolute;left:0;right:0;top:0;height:var(--bar);padding:var(--sat) 4px 0;display:flex;align-items:stretch;background:var(--win);border-bottom:1px solid var(--ink);z-index:50}
.sb{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;position:relative;flex:none;white-space:nowrap}
.sb:hover{background:var(--stage)}
.sb-home[aria-current=true]{box-shadow:inset 0 -3px 0 var(--ink)}
.sb-home .w{display:none;font:500 14px var(--sans)}
.sb-wins{font:500 13px var(--sans);gap:6px;padding:0 5px}
.sb-wins .cnt{min-width:20px;height:20px;padding:0 5px;background:var(--ink);color:var(--win);font:600 12px/20px var(--mono);text-align:center}
.sb-wins[aria-expanded=true]{box-shadow:inset 0 -3px 0 var(--ink)}
.sb-clock{display:none;font:400 13px var(--mono);cursor:default;padding:0 12px}
.sb-dose{gap:4px;padding:0 5px}
.sb-dose .ic{width:16px;height:16px;color:var(--meds)}
.sb-dose .w{display:none;font:500 13px var(--sans)}
.sb-dose .v{font:500 12px var(--mono)}
@container app (max-width: 385px){ .sb-dose .dday{display:none} }
.sb-fill{flex:1}
.sb-sync .ic{width:20px;height:20px}
.sb-acct{flex-direction:column;gap:2px}
.av{width:24px;height:24px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--sans)}
.acct-name{display:none;font-weight:500;font-size:14px}
.aichip{font:600 12px/1 var(--sans);letter-spacing:.03em;color:var(--ai);border:1px solid var(--ai);padding:1px 3px;white-space:nowrap}
.sb-signin{flex-direction:column;align-items:flex-start;gap:1px;border:1.5px solid var(--ink);margin:5px 2px;height:34px;padding:0 6px;min-width:0}
.sb-signin b{font:600 13px/1.1 var(--sans)}
.sb-signin span{font:400 12px/1.1 var(--sans);color:var(--muted);white-space:nowrap}

/* ---------- work area ---------- */
#work{position:absolute;top:var(--bar);left:0;right:0;bottom:0}
#stage{position:absolute;left:0;right:0;top:0;bottom:var(--dockh);background:var(--stage)}
#desk{position:absolute;inset:0;background:var(--desk);visibility:hidden}
.desk-on #desk{visibility:visible}
#wins{position:absolute;inset:0;pointer-events:none}
#wins>*{pointer-events:auto}
.desk-on #wins>*{visibility:hidden!important}

/* desk: reflows and scrolls instead of colliding */
.desk-in{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;padding:12px 16px 12px;overflow-y:auto;overscroll-behavior:contain}
.desk-today{flex:none}
.apps{display:flex;justify-content:space-between;margin-top:auto;flex:none;padding-top:4px}
.app{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;padding:4px 0 2px}
.app-ic{width:44px;height:40px;display:flex;align-items:flex-end;justify-content:center;position:relative;border-top:3px solid currentColor;padding-bottom:1px}
.app-ic .ic{width:30px;height:30px;stroke-width:1.4}
.app .nm{font:500 13px/1.2 var(--sans);color:var(--ink)}
.app:hover .nm{text-decoration:underline;text-underline-offset:3px}
.pip{position:absolute;top:2px;right:-12px;min-width:20px;height:20px;padding:0 4px;background:var(--meds);color:var(--win);font:600 12px/20px var(--mono);text-align:center}

/* ---------- bottom strip: water keys, mic slot, Log ---------- */
#dock{position:absolute;left:0;right:0;bottom:0;height:var(--dockh);padding:0 14px var(--sab);display:flex;align-items:center;gap:8px;border-top:1px solid var(--ink);background:var(--win);z-index:40}
#dock .grow{flex:1;min-width:0}
.key{height:44px;min-width:88px;padding:0 10px;border:1.5px solid var(--ink);border-radius:2px;background:var(--win);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 15px var(--mono);white-space:nowrap}
.key:hover,.key:active{background:var(--stage)}
.key .ic{color:var(--water);width:18px;height:18px}
.micbtn{width:48px;height:48px;border-radius:50%;background:var(--ai);color:var(--win);display:flex;align-items:center;justify-content:center;flex:none;touch-action:none}
.micbtn .ic{width:24px;height:24px;stroke-width:1.5}
.micbtn.hold{outline:3px solid var(--ai);outline-offset:3px}
.knob{height:48px;min-width:84px;padding:0 14px;background:var(--ink);color:var(--win);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px var(--sans);flex:none;border-radius:2px}
.knob .ic{width:20px;height:20px;stroke-width:1.6}

/* ---------- gadget (today ledger) ---------- */
.gadget{background:var(--win);border:2px solid var(--ink)}
.strip{height:34px;width:100%;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px solid var(--ink)}
.strip .t{font:600 14px/1 var(--sans);white-space:nowrap}
.strip .m{font:400 12px var(--mono);color:var(--muted);white-space:nowrap;margin-left:auto}
.strip-btn .ic{width:18px;height:18px;transition:transform 120ms}
.strip-btn[aria-expanded=true] .ic{transform:rotate(180deg)}
.strip-btn[aria-expanded=false]{border-bottom:0}
.ghead{display:grid;grid-template-columns:var(--lc) 1fr;align-items:end;padding:5px 10px 3px 13px;border-bottom:1px solid var(--rule)}
.wk{display:grid;grid-template-columns:repeat(7,1fr)}
.wk-head span{font:500 12px var(--mono);text-align:right;color:var(--muted);padding-right:3px}
.wk-head span.today{color:var(--ink);font-weight:600;text-decoration:underline 1.5px;text-underline-offset:3px}
.lrow{display:grid;grid-template-columns:var(--lc) 1fr;grid-template-rows:26px 18px;align-items:center;row-gap:2px;width:100%;min-height:56px;padding:4px 10px 4px 10px;border-left:3px solid var(--c);border-bottom:1px solid var(--rule);text-align:left}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--stage)}
.lr-name{font:600 13px/1.1 var(--sans);white-space:nowrap}
.lr-now{display:flex;align-items:baseline;gap:8px;min-width:0}
.fig{font:600 calc(22px * var(--t))/1 var(--sans);color:var(--c);white-space:nowrap;font-variant-numeric:tabular-nums}
.fig small{font:500 12px var(--sans);color:var(--muted);margin-left:3px}
.st{margin-left:auto;font:400 12px var(--mono);white-space:nowrap}
.s-hatch{color:var(--c);display:inline-flex;align-items:center;gap:5px}
.sw-h{display:inline-block;width:12px;height:10px;background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 4px);border:1px solid var(--c)}
.s-over{background:var(--c);color:var(--win);font-weight:600;padding:0 4px}
.rule{display:block;position:relative;height:12px;width:calc(100% - 14px)}
.rule::before{content:'';position:absolute;left:0;right:0;top:6px;height:1px;background:var(--rule)}
.rule.nolim::before{background:repeating-linear-gradient(90deg,var(--rule) 0 4px,transparent 4px 7px)}
.rule .f{position:absolute;top:3px;height:6px;background:var(--c)}
.rule .h{position:absolute;top:3px;height:6px;background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 4px);outline:1px solid var(--c);outline-offset:-1px}
.rule .o{position:absolute;top:1px;height:10px;background:var(--c)}
.rule .tk{position:absolute;top:0;width:1.5px;height:12px;background:var(--ink)}
.rule .tk.b{top:3px;height:6px;width:1px;background:var(--muted)}
.c{font:400 12px/14px var(--mono);text-align:right;position:relative;padding:0 3px 4px 0;height:18px;color:var(--ink);white-space:nowrap}
.c::after{content:'';position:absolute;left:7px;right:3px;bottom:0}
.c.ok::after{height:2px;background:var(--c)}
.c.hatch::after{height:4px;background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 4px);outline:1px solid var(--c);outline-offset:-1px}
.c.over{background:var(--c);color:var(--win);font-weight:600}
.c.today{font-weight:600}
.c.fut{color:var(--muted)}

/* ---------- windows: plain strip (colour spine, label, controls) ---------- */
.win{position:absolute;left:10px;right:10px;top:8px;bottom:8px;display:flex;flex-direction:column;background:var(--win);border:2px solid var(--ink);visibility:hidden}
.win.pshow{visibility:visible}
.win[data-enter=r]{animation:swapR 160ms ease-out}
.win[data-enter=l]{animation:swapL 160ms ease-out}
@keyframes swapR{from{transform:translateX(28px)}to{transform:none}}
@keyframes swapL{from{transform:translateX(-28px)}to{transform:none}}
.tstrip{height:36px;display:flex;align-items:center;border-bottom:1px solid var(--ink);flex:none;touch-action:none;cursor:grab;background:var(--win)}
.tstrip .wm{align-self:stretch;width:5px;background:var(--c,var(--ink));flex:none}
.wtitle{font:600 14px/1 var(--sans);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.wbtn{width:44px;height:35px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--ink);position:relative;flex:none}
.wbtn .ic{width:18px;height:18px;color:var(--ink)}
.wbtn:hover{background:var(--ink)}
.wbtn:hover .ic{color:var(--win)}
.wbody{flex:1;overflow:auto;padding:0 16px 40px;overscroll-behavior:contain}

/* tabs, controls */
.tabs{display:flex;border-bottom:1px solid var(--ink);margin:0 -16px;padding:0 12px;position:sticky;top:0;background:var(--win);z-index:2;overflow-x:auto;scrollbar-width:none}
.tabs button{min-height:44px;padding:0 10px;font:500 14px var(--sans);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--c,var(--ink))}
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 14px var(--sans);background:var(--win);white-space:nowrap}
.btn:hover{background:var(--stage)}
.btn.pri{background:var(--ink);color:var(--win)}
.btn.pri:hover{background:var(--ink);opacity:.9}
.btn.ai{border-color:var(--ai);color:var(--ai)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding:0 6px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;background:var(--win);flex-wrap:nowrap}
.seg button{min-height:41px;min-width:44px;padding:0 11px;font:500 13px var(--sans);border-left:1px solid var(--ink);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--win)}
.seg.fill{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.seg.fill button{padding:0 4px;text-align:center}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.inp{height:44px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:0 2px;font:400 15px var(--sans);width:100%;border-radius:0;outline-offset:0}
.inp.num{font:500 20px var(--mono)}
.inp:focus{border-bottom-width:3px}
select.inp{font-size:14px;cursor:pointer}
textarea.inp{height:64px;padding-top:8px;resize:vertical}
.aiicon{color:var(--ai)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink);margin:0}
/* switch: track + round knob + On/Off word */
.swrow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 0;text-align:left}
.swrow small{display:block;color:var(--muted);font-size:13px}
.swt{display:inline-flex;align-items:center;gap:8px;flex:none}
.swx{font:600 12px var(--mono);min-width:24px;text-align:right;color:var(--muted)}
.swv{width:44px;height:26px;border-radius:13px;border:1.5px solid var(--muted);position:relative;flex:none;background:transparent}
.swv::after{content:'';position:absolute;top:4px;left:4px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:transform 120ms}
.swrow[aria-checked=true] .swv{background:var(--ink);border-color:var(--ink)}
.swrow[aria-checked=true] .swv::after{background:var(--win);transform:translateX(18px)}
.swrow[aria-checked=true] .swx{color:var(--ink)}
.swrow[disabled]{opacity:.5;cursor:not-allowed}

/* ledger lists inside windows */
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
.sec-h .rl{flex:1;height:1px;background:var(--rule)}
.ledger>li{border-bottom:1px solid var(--rule);padding:10px 0 10px 10px;border-left:3px solid var(--c,var(--rule));position:relative}
.ledger>li:first-child{border-top:1px solid var(--rule)}
.li-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.li-t{font:600 15px/1.3 var(--sans)}
.li-s{font-size:13px;color:var(--muted)}
.tm{font:500 13px var(--mono);color:var(--muted);min-width:42px}
.tag{font:500 12px/1 var(--sans);letter-spacing:.03em;text-transform:uppercase;padding:3px 5px;border:1px solid currentColor;white-space:nowrap}
.tag.inv{background:var(--ink);color:var(--win);border-color:var(--ink)}
.tag.warn{border-width:1.5px}
.prompt{border:1.5px solid var(--ink);border-left:6px solid var(--meds);padding:14px;margin:14px 0}
.prompt.quiet{border-left-color:var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 10px;border:1.5px solid var(--ink);font:500 13px var(--sans);display:inline-flex;align-items:center;gap:6px;position:relative;white-space:nowrap}
.chip::before{content:'';width:3px;height:14px;background:var(--c,var(--ink));flex:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--win)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 8px}
.kv>div{border-left:3px solid var(--c,var(--ink));padding-left:8px}
.kv-v{display:block;font:600 20px/1.15 var(--sans);color:var(--c,var(--ink));white-space:nowrap}
.kv-l{display:block;font-size:12px;line-height:1.3;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
.chart text{font:400 11px var(--mono);fill:var(--muted)}
.chart .ax{stroke:var(--ink);stroke-width:1}
.chart .gl{stroke:var(--rule);stroke-width:1}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.pill-id{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* ---------- rail ---------- */
#rail{position:absolute;top:0;bottom:var(--dockh);left:0;width:150px;background:var(--desk);border-right:2px solid var(--ink);transform:translateX(-102%);visibility:hidden;transition:transform 180ms ease-out,visibility 0s 180ms;z-index:30;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.rail-open #rail{transform:none;visibility:visible;transition:transform 180ms ease-out}
.rail-wide{display:none}
.rh{padding:12px 12px 6px}
.rtile{cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%;padding:8px 12px 10px 20px;border-bottom:1px solid var(--rule)}
.rtile.cur .mini{outline:2px solid var(--ink);outline-offset:2px}
.mini{display:block;position:relative;overflow:hidden;width:96px;height:120px;border:1.5px solid var(--ink);background:var(--win);pointer-events:none}
.mini-in{display:block;position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.mini-in .win{visibility:visible!important;position:absolute;inset:0;box-shadow:none;border:0;animation:none}
.rtile b{font:600 13px/1.2 var(--sans);display:flex;align-items:center;gap:6px}
.rtile b::before{content:'';width:3px;height:12px;background:var(--c,var(--ink))}
.rtile .st2{font:400 12px/1.3 var(--sans);color:var(--muted)}
#scrim{position:absolute;left:0;right:0;top:0;bottom:var(--dockh);background:var(--dim);opacity:0;visibility:hidden;z-index:29;transition:opacity 180ms,visibility 0s 180ms}
.rail-open #scrim,.so-open:not(.so-docked-wide) #scrim{opacity:1;visibility:visible;transition:opacity 180ms}
#edge{position:absolute;left:0;top:0;bottom:var(--dockh);width:14px;z-index:28;touch-action:none}
#redge{position:absolute;right:0;top:48px;bottom:var(--dockh);width:14px;z-index:28;touch-action:none}
.rail-open #edge,.so-open #redge,.rail-open #redge{display:none}

/* ---------- slide over: one row of kind keys, one compact form ---------- */
#so{position:absolute;top:0;bottom:var(--dockh);right:0;width:calc(100% - 20px);max-width:420px;background:var(--win);border-left:2px solid var(--ink);transform:translateX(102%);visibility:hidden;transition:transform 180ms ease-out,visibility 0s 180ms;z-index:36;display:flex;flex-direction:column;touch-action:pan-y}
.so-open #so{transform:none;visibility:visible;transition:transform 180ms ease-out}
.qkeys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--ink);flex:none}
.qk{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 12px/1.1 var(--sans);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;padding:0 1px;white-space:nowrap;overflow:hidden}
.qk .ic{color:var(--c);width:20px;height:20px}
.qk:hover{background:var(--stage)}
.qk[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--c);background:var(--stage)}
.so-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.qform{padding:14px 16px 20px}
.qlink{display:flex;justify-content:flex-end;margin-top:10px}
.lnk{font-size:13px;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px;color:var(--muted)}
.keys{display:flex;gap:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:flex-end;gap:6px}
.stepper .sbtn{width:44px;height:44px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.stepper .inp{width:92px;text-align:center}
.plist>li{border-left:3px solid var(--c);border-bottom:1px solid var(--rule)}
.plist>li:first-child{border-top:1px solid var(--rule)}
.preset{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 10px;white-space:nowrap}
.preset:hover,.preset[aria-expanded=true]{background:var(--stage)}
.preset .pn{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.preset .pm{font:400 13px var(--mono);color:var(--muted)}
.preset .pa{font:400 13px var(--mono);color:var(--c);text-align:right;min-width:112px;display:flex;justify-content:flex-end}
.preset .pa .ic{width:18px;height:18px}
.preset.other .pa{min-width:0}
.pexp{padding:6px 10px 14px 10px;background:var(--stage)}
.conv{font:500 14px var(--mono);color:var(--sodium);padding:8px 0 4px;min-height:30px}
.bpgrid{display:grid;grid-template-columns:1fr 14px 1fr;gap:4px 8px;align-items:end}
.bpgrid .slash{font:400 24px var(--mono);text-align:center;padding-bottom:8px;color:var(--muted)}
.bpgrid .hr{grid-column:1 / -1}
.last{font:400 12px var(--mono);color:var(--muted);margin-bottom:6px}
.pp{font:400 13px var(--mono);margin:8px 0}
.err{font-size:13px;color:var(--bp);margin:6px 0}
.so-close{width:44px;height:35px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--ink)}
.so-today{padding:4px 12px 16px}
.so-foot{display:none}

/* ---------- mic panel ---------- */
#micpanel{position:absolute;left:0;right:0;bottom:var(--dockh);z-index:45;background:var(--win);border-top:2px solid var(--ink);padding:14px 20px 16px}
#micpanel[hidden]{display:none}
#micpanel.review{padding:0;z-index:72;bottom:0;max-height:80%;display:flex;flex-direction:column}
.meter{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:18px;margin:10px 0}
.meter i{border:1px solid var(--rule)}
.meter i.on{background:var(--ai);border-color:var(--ai)}
.cancel .meter i.on{background:var(--muted);border-color:var(--muted)}
.transcript{font:400 17px/1.35 var(--sans);min-height:48px}
.rv-item{display:grid;grid-template-columns:1fr 44px;gap:4px 8px;padding:12px 0 12px 10px;border-bottom:1px solid var(--rule);border-left:3px solid var(--c)}
.rv-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.rv-fields .fld{width:92px}
.rv-fields .inp.num{font-size:17px}

/* ---------- overlays ---------- */
#settings{position:absolute;inset:0;z-index:60;background:var(--win);display:flex;flex-direction:column;transform:translateY(102%);visibility:hidden;transition:transform 180ms ease-out,visibility 0s 180ms}
.settings-open #settings{transform:none;visibility:visible;transition:transform 180ms ease-out}
.set-head{display:flex;align-items:center;gap:8px;min-height:calc(48px + var(--sat));padding:var(--sat) 0 0 0;border-bottom:1px solid var(--ink)}
.set-head .wm{align-self:stretch;width:5px;background:var(--ink)}
.set-head h2{font:600 17px var(--sans);flex:1;padding-left:10px}
.set-body{flex:1;overflow-y:auto;padding:0 20px 40px}
.sgrp{border-bottom:1px solid var(--rule)}
.sgrp>button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;font:600 15px var(--sans)}
.sgrp>button .ic{transition:transform 120ms}
.sgrp>button[aria-expanded=true] .ic{transform:rotate(180deg)}
.sgrp .in{padding:0 0 16px}
.srow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:48px;border-top:1px solid var(--rule);padding:6px 0}
.srow:first-child{border-top:0}
.srow .h{font-size:13px;color:var(--muted);grid-column:1 / -1;margin-top:-4px}
.lim{display:flex;align-items:flex-end;gap:6px}
.lim .inp{width:74px;font-size:16px;text-align:right}
.lim .u{font:400 12px var(--mono);color:var(--muted);padding-bottom:12px}
#pop{position:absolute;top:calc(var(--bar) + 6px);right:6px;width:268px;z-index:55;background:var(--win);border:2px solid var(--ink)}
#pop[hidden],#sheet[hidden],#toast[hidden]{display:none}
.pop-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:0 14px;border-top:1px solid var(--rule);text-align:left}
.pop-i:hover{background:var(--stage)}
#sheet{position:absolute;inset:0;z-index:70;display:flex;align-items:flex-end;background:var(--dim)}
.sheet{width:100%;background:var(--win);border-top:2px solid var(--ink);max-height:92%;overflow:auto;padding:0 20px calc(24px + var(--sab))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin:0 -20px 12px;padding-left:20px;border-bottom:1px solid var(--ink)}
.sheet-h h2{font:600 17px var(--sans)}
#toast{position:absolute;left:12px;right:12px;bottom:calc(var(--dockh) + 10px);z-index:47;background:var(--ink);color:var(--win);display:flex;align-items:center;gap:6px;min-height:48px;padding:0 4px 0 14px;font:500 14px var(--sans)}
.desk-on #toast{bottom:calc(var(--dockh) + 104px)}
#toast .msg{flex:1}
#toast button{min-height:44px;padding:0 10px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
#toast .x{text-decoration:none;min-width:40px}
.ghost-drag{position:absolute;z-index:90;pointer-events:none;background:var(--win);border:2px solid var(--ink);padding:6px 10px;font:600 13px var(--sans)}
.drop-hot{outline:2px dashed var(--ink);outline-offset:-4px}

/* ---------- WIDE (md and up) ---------- */
@container app (min-width: 768px){
  #device>*{--dockh:0px;--lc:66px}
  #device.so-undocked>*{--dockh:64px}
  #bar{padding:0 8px;gap:2px}
  .sb-wins,#edge,#redge{display:none}
  .sb-home{padding:0 14px}
  .sb-home .w{display:inline}
  .sb-clock{display:flex}
  .sb-dose{padding:0 12px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
  .sb-dose .w{display:inline}
  .sb-dose .v{font-size:13px}
  .sb-dose .ic{width:18px;height:18px}
  .sb-sync{padding:0 10px}
  .sb-acct{flex-direction:row;gap:8px;padding:0 10px}
  .acct-name{display:inline}
  .sb-signin{flex-direction:row;align-items:center;gap:8px;padding:0 12px}

  #rail{transform:none;visibility:visible;width:156px;bottom:0;border-right:1px solid var(--ink);transition:none;z-index:10}
  .rail-phone{display:none}.rail-wide{display:block}
  #scrim{display:none}
  #stage{left:156px;right:352px}
  .so-undocked #stage{right:0}
  #dock{display:none}
  .so-undocked #dock{display:flex;left:156px;padding:0 20px}
  .desk-in{align-items:center;justify-content:center;padding:28px;gap:22px}
  .desk-today{width:min(560px,100%);--lc:112px}
  .apps{gap:36px;margin:0}
  .app{width:92px}
  .win{left:var(--x);top:var(--y);width:var(--w);height:var(--h);right:auto;bottom:auto;visibility:hidden}
  .win.inset{visibility:visible}
  .win:not(.front){border-width:1.5px}
  .win:not(.front) .tstrip{background:var(--stage)}
  .win:not(.front) .wtitle{color:var(--muted);font-weight:500}
  .win.front{box-shadow:0 14px 30px -18px rgba(0,0,0,.55)}
  .win[data-enter]{animation:none}
  .stagecap{position:absolute;left:20px;right:20px;top:0;height:46px;display:flex;align-items:center;gap:10px}
  .stagecap .nm{font:600 15px var(--sans)}
  #so{width:352px;max-width:none;transform:none;visibility:visible;border-left:1px solid var(--ink);transition:none;z-index:20;bottom:0}
  .so-undocked #so{width:380px;border-left:2px solid var(--ink);bottom:var(--dockh);transform:translateX(102%);visibility:hidden;transition:transform 180ms ease-out,visibility 0s 180ms;z-index:36}
  .so-undocked.so-open #so{transform:none;visibility:visible;transition:transform 180ms ease-out}
  .so-docked-wide .so-foot{display:flex;align-items:center;gap:12px;flex:none;height:64px;padding:0 16px;border-top:1px solid var(--ink);font:500 13px var(--sans);color:var(--muted)}
  #toast,.desk-on #toast{left:176px;right:auto;width:440px;bottom:calc(var(--dockh) + 20px)}
  #micpanel{left:auto;right:0;width:352px;bottom:64px;border:0;border-top:2px solid var(--ink);border-left:1px solid var(--ink)}
  .so-undocked #micpanel{right:20px;width:420px;bottom:calc(var(--dockh) + 10px);border:2px solid var(--ink)}
  #micpanel.review{left:auto;right:0;width:420px;top:auto;bottom:0;max-height:70%;border:2px solid var(--ink)}
  #settings{left:auto;top:var(--bar);width:420px;border-left:2px solid var(--ink);transform:translateX(102%)}
  .set-head{min-height:48px;padding-top:0}
  #sheet{align-items:center;justify-content:center}
  .sheet{width:420px;border:2px solid var(--ink);max-height:86%}
}
.rail-wide .set{padding:10px 10px 12px 12px;border-bottom:1px solid var(--rule)}
.rail-wide .set.cur{background:var(--stage)}
.set-thumb{display:block;cursor:pointer;width:130px;height:78px;border:1.5px solid var(--ink);background:var(--stage);position:relative;overflow:hidden}
.set.cur .set-thumb{outline:2px solid var(--ink);outline-offset:2px}
.set-mini{position:absolute;overflow:hidden;background:var(--win);border:1px solid var(--ink)}
.set-mini.f{border-width:1.5px}
.set-name{font:600 13px/1.2 var(--sans);margin:8px 0 6px}
.rail-wide .chips{flex-direction:column;flex-wrap:nowrap;gap:4px}
.rail-wide .chips li{min-width:0;display:flex}
.rail-wide .chip{width:100%;min-width:0;min-height:32px;font-size:13px;border-width:1px;cursor:grab;touch-action:none;padding:0 6px;overflow:hidden}
.rail-wide .chip span{overflow:hidden;text-overflow:ellipsis}
.rail-wide .chip[aria-current=true]{border-width:2px;font-weight:600}
.newset{display:none;margin:10px;min-height:56px;border:1.5px dashed var(--ink);align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--ink);padding:6px}
.dragging .newset{display:flex}

.rm *,.rm *::before,.rm *::after{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- reviewer harness (not product UI; lives in the 12px gutter left of the device) ---------- */
#harness{position:fixed;left:0;bottom:120px;z-index:1000;font:12px/1.3 system-ui,sans-serif;color:#111}
#harness .hbtn.min{writing-mode:vertical-rl;transform:rotate(180deg);width:11px;padding:6px 0;font-size:9px;border-width:1px;border-left:0;opacity:.9}
#harness .hbtn{background:#ffe600;border:2px dashed #111;padding:6px 8px;font-weight:700;cursor:pointer;font-size:12px}
#harness .hp{background:#ffe600;border:2px dashed #111;padding:8px;width:236px;margin-bottom:6px;max-height:70vh;overflow:auto}
#harness .hp[hidden]{display:none}
#harness .hr{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
#harness .hr b{width:100%;font-size:11px;text-transform:uppercase}
#harness .hp button{border:1px solid #111;background:#fff;padding:4px 7px;font-size:12px;cursor:pointer}
#harness .hp button[aria-pressed=true]{background:#111;color:#ffe600}
#harness select{width:100%;font-size:12px;padding:3px}
#harness a{color:#111;display:inline-block;margin:2px 6px 2px 0}
</style>
</head>

/* ---------- derived values ---------- */
function dayOf(r){ return tmin(r.t) < num(S.set.dayStart) * 60 ? r.day - 1 : r.day; }
function sums(day){
  const o = {water:0,sodium:0,sugar:0,caffeine:0,alcohol:0,potassium:0,_k:false};
  for(const r of S.records){ if(dayOf(r) !== day) continue;
    if(r.kind === 'water' || r.kind === 'drink') o.water += num(r.ml);
    o.sodium += num(r.na||0); o.sugar += num(r.sugar||0); o.caffeine += num(r.caf||0); o.alcohol += num(r.std||0);
    if(r.k){ o.potassium += num(r.k); o._k = true; }
  }
  return o;
}
function dayVal(k, d){
  if(d > NOW.day) return null;
  const s = sums(d);
  if(k === 'potassium') return s._k || d === NOW.day ? s.potassium : null;
  return (BASE[d] && BASE[d][k] || 0) + s[k];
}
function lim(k){ const L = S.set.limits[k]; if(!L) return null; const l = num(L.l), b = num(L.b); return l > 0 ? {l, b} : null; }
function status(k, v){ const L = lim(k); if(!L || v == null) return 'none'; if(v > L.l + L.b) return 'over'; if(v > L.l) return 'hatch'; return 'ok'; }
function weekDays(){ const s = S.set.weekStart === 'sun' ? 27 : 21; return Array.from({length:7}, (_, i) => { const d = s + i; return {d, name:dname(d), today:d === NOW.day, fut:d > NOW.day}; }); }

function recColor(r){
  if(r.kind === 'water') return 'water';
  if(r.kind === 'drink') return r.std ? 'alcohol' : r.caf ? 'caffeine' : 'water';

}

    case 'water': return {t:'Water', s:`${n0(r.ml)} ml`};
    case 'drink': { const p = [`${n0(r.ml)} ml`]; if(r.abv) p.push(`${r.abv}%`); if(r.caf) p.push(`${n0(r.caf)} mg caffeine`); if(r.std) p.push(`${r.std.toFixed(1)} std drinks`); if(num(r.sugar)) p.push(`${num(r.sugar)} g sugar`); return {t:r.name, s:p.join(' · ')}; }
    case 'food': { const p = [`sodium ${n0(r.na)} mg`]; if(r.src) p[0] += ` (${r.src})`; if(num(r.sugar)) p.push(`sugar ${num(r.sugar)} g`); return {t:r.name || 'Food', s:p.join(' · ')}; }
    case 'bp': { const p = [`${r.sys}/${r.dia} mmHg`]; if(r.hr) p.push(`HR ${r.hr}`); p.push(`${r.pos.toLowerCase()}, ${r.arm.toLowerCase()} arm`); if(r.irr) p.push('irregular heartbeat'); if(r.note) p.push(`“${r.note}”`); return {t:'Blood pressure', s:p.join(' · ')}; }

/* ---------- Today gadget: one compact ledger, today against limits + this week ---------- */
const dnum = d => d <= 30 ? d : d - 30;
const dmon = d => d <= 30 ? 'Sep' : 'Oct';
function wkRange(){ const days = weekDays(), a = days[0].d, b = days[6].d; return dmon(a) === dmon(b) ? `${dnum(a)}–${dnum(b)} ${dmon(b)}` : `${dnum(a)} ${dmon(a)} – ${dnum(b)} ${dmon(b)}`; }
function todayGadget(opt = {}){
  const days = weekDays();
  const head = opt.collapsible
    ? `<button class="strip strip-btn" data-act="ledger" aria-expanded="${S.ledgerOpen}"><span class="t">Today</span><span class="m">week ${wkRange()}</span>${ic('down')}</button>`
    : `<div class="strip"><span class="t">Today · Sun 27 Sep</span><span class="m">week ${wkRange()}</span></div>`;
  const body = opt.collapsible && !S.ledgerOpen ? '' : `<div class="ghead"><span class="lbl">This week</span><div class="wk wk-head" aria-hidden="true">${days.map(d => `<span class="${d.today ? 'today' : ''}">${d.name.slice(0, 2)}</span>`).join('')}</div></div>
    ${activeRows().map(rowHTML).join('')}`;
  return `<section class="gadget" aria-label="Today and this week">${head}${body}</section>`;
}
function rowHTML(R){
  const v = dayVal(R.k, NOW.day) || 0, L = lim(R.k), st = status(R.k, v);
  let stat, aria, rule;
  if(!L){
    stat = `<span class="st muted">no limit set</span>`;
    aria = `${R.label}, ${R.tf(v)} ${R.long} today, no limit set`;
    rule = `<span class="rule nolim" aria-hidden="true"></span>`;
  } else {
    const diff = v - L.l;
    stat = st === 'ok' ? `<span class="st">${R.tf(L.l - v)} left of ${R.tf(L.l)}</span>`
      : st === 'hatch' ? `<span class="st s-hatch"><i class="sw-h"></i>${R.tf(diff)} over target</span>`
      : `<span class="st s-over">▲ ${R.tf(diff)} over limit</span>`;
    aria = `${R.label}, ${R.tf(v)} of ${R.tf(L.l)} ${R.long}, ${st === 'ok' ? R.tf(L.l - v) + ' left' : st === 'hatch' ? R.tf(diff) + ' over target' : 'over limit by ' + R.tf(diff)}`;
    const max = (L.l + L.b) * 1.12, p = x => Math.min(100, x / max * 100);
    rule = `<span class="rule" aria-hidden="true"><span class="f" style="left:0;width:${p(Math.min(v, L.l))}%"></span>`
      + (v > L.l ? `<span class="h" style="left:${p(L.l)}%;width:${p(Math.min(v, L.l + L.b)) - p(L.l)}%"></span>` : '')
      + (v > L.l + L.b ? `<span class="o" style="left:${p(L.l + L.b)}%;width:${p(v) - p(L.l + L.b)}%"></span>` : '')
      + `<span class="tk" style="left:${p(L.l)}%"></span><span class="tk b" style="left:${p(L.l + L.b)}%"></span></span>`;
  }
  const cells = weekDays().map(d => {
    const x = dayVal(R.k, d.d);
    if(x == null) return `<span class="c fut${d.today ? ' today' : ''}">—</span>`;
    const s = status(R.k, x);
    return `<span class="c ${s === 'none' ? '' : s}${d.today ? ' today' : ''}">${R.tf(x)}</span>`;
  }).join('');
  const wkAria = weekDays().map(d => { const x = dayVal(R.k, d.d); const s = status(R.k, x); return `${d.name} ${x == null ? 'no data' : R.tf(x)}${s === 'hatch' ? ' over target' : s === 'over' ? ' over limit' : ''}`; }).join(', ');
  return `<button class="lrow" data-act="histFor" data-arg="${R.k}" style="--c:${cv(R.c || R.k)}" aria-label="${aria}. This week in ${R.long}: ${wkAria}. Open History for ${R.label.toLowerCase()}.">
    <span class="lr-name">${R.label}</span><span class="lr-now"><span class="fig">${R.tf(v)}<small>${R.unit}</small></span>${stat}</span>
    ${rule}<span class="wk" aria-hidden="true">${cells}</span>
  </button>`;
}

function winGeom(id){
  if(S.pos[id]) return S.pos[id];
  const set = S.sets.find(s => s.wins.includes(id));
  const st = $('#stage'); const W = Math.max(560, st.clientWidth || 800), H = Math.max(400, st.clientHeight || 700);
  const top = 50, avail = H - top - 16;
  if(!set) return {x:20, y:top, w:440, h:avail};
  const n = set.wins.length, i = set.wins.indexOf(id);
  if(n === 1){ const w = Math.min(620, W - 48); return {x:Math.round((W - w) / 2), y:top, w, h:avail}; }
  if(set.layout === 'side'){ const gap = 14, w = Math.floor((W - 40 - gap * (n - 1)) / n); return {x:20 + i * (w + gap), y:top, w, h:avail}; }
  const w = Math.min(n === 2 ? 540 : 500, Math.floor(W * (n === 2 ? 0.68 : 0.62)));
  const step = Math.floor((W - 40 - w) / (n - 1)), dy = 36;
  return {x:20 + i * step, y:top + i * dy, w, h:avail - (n - 1) * dy};
}

/* cumulative intake over today, against the limit (the gadget only shows the total) */
function cumChart(k){
  const rs = S.records.filter(r => dayOf(r) === NOW.day).filter(r => k === 'water' ? (r.kind === 'water' || r.kind === 'drink') : num(r.na) > 0).sort((a, b) => tmin(a.t) - tmin(b.t));
  const val = r => k === 'water' ? num(r.ml) : num(r.na);
  const L = lim(k), total = rs.reduce((s, r) => s + val(r), 0);
  const W = 320, H = 140, Lp = 44, B = 22, T = 10;
  const h0 = num(S.set.dayStart) * 60, h1 = h0 + 24 * 60, max = Math.max(total, L ? L.l + L.b : 0) * 1.1 || 100;
  const xm = m => Lp + (W - Lp - 6) * ((m < h0 ? m + 1440 : m) - h0) / (h1 - h0), y = v => T + (H - T - B) * (1 - v / max);
  const col = `var(--${k})`;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${k === 'water' ? 'Water' : 'Sodium'} through today: ${rs.map(r => `${r.t} +${Math.round(val(r))}`).join(', ') || 'nothing yet'}, total ${Math.round(total)}">`;
  const step = max > 2000 ? 1000 : 500;
  for(let g = 0; g <= max; g += step) s += `<line class="gl" x1="${Lp}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text x="${Lp - 4}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
  for(const hh of [6, 12, 18]) s += `<text x="${xm(hh * 60)}" y="${H - 6}" text-anchor="middle">${String(hh).padStart(2, '0')}:00</text>`;
  let acc = 0, pts = [`${xm(h0)},${y(0)}`];
  for(const r of rs){ const x = xm(tmin(r.t)); pts.push(`${x},${y(acc)}`); acc += val(r); pts.push(`${x},${y(acc)}`); }
  pts.push(`${xm(tmin(NOW.t))},${y(acc)}`);
  s += `<polyline points="${pts.join(' ')}" style="fill:none;stroke:${col}" stroke-width="2"/>`;
  if(L) s += `<line x1="${Lp}" x2="${W}" y1="${y(L.l)}" y2="${y(L.l)}" style="stroke:var(--ink)" stroke-dasharray="4 3"/><text x="${W - 2}" y="${y(L.l) - 4}" text-anchor="end" style="fill:var(--ink)">limit ${L.l}</text>`;
  s += `<line x1="${xm(tmin(NOW.t))}" x2="${xm(tmin(NOW.t))}" y1="${T}" y2="${y(0)}" style="stroke:var(--muted)" stroke-dasharray="2 3"/><text x="${xm(tmin(NOW.t)) - 3}" y="${T + 9}" text-anchor="end">now</text>`;
  s += `<line class="ax" x1="${Lp}" x2="${Lp}" y1="${T}" y2="${y(0)}"/><line class="ax" x1="${Lp}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  return s;
}
function bpChart(days){
  const rs = bpRecs().filter(r => days.includes(dayOf(r)));
  if(!rs.length) return `<p class="note">No readings in this range.</p>`;
  const W = 320, H = 170, L = 40, B = 30, T = 10, lo = 50, hi = 140;

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Blood pressure readings: ${rs.map(r => `${r.day} Sep ${r.t} ${r.sys}/${r.dia}${r.irr ? ' irregular' : ''}`).join(', ')}">`;
  for(const g of [60, 80, 100, 120, 140]) s += `<line class="gl" x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text x="${L - 4}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;

    if(r.irr) s += `<text x="${x}" y="${y(r.sys) - 9}" text-anchor="middle" style="fill:var(--bp);font-weight:600">▲</text>`;
  });
  s += `<line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${W}" y1="${H - B}" y2="${H - B}"/></svg>`;
  const irr = rs.filter(r => r.irr).map(r => `<li style="--c:var(--bp)"><span class="mono">▲ ${r.day} Sep ${r.t}</span> · ${r.sys}/${r.dia} · ${r.pos.toLowerCase()} · irregular heartbeat${r.note ? ` · “${esc(r.note)}”` : ''}</li>`).join('');
  return s + `<p class="note">Filled square: systolic (top number). Open square: diastolic (bottom number).</p>` + (irr ? `<ul class="ledger">${irr}</ul>` : '');
}
function wtChart(days){

/* two aligned bands on one day axis: sodium per day above, systolic readings below */
function naBpChart(days){

  const colW = (W - Lp - 6) / days.length, cx = i => Lp + 3 + colW * i + colW / 2;

  for(const g of [100, 115, 130]) s += `<line class="gl" x1="${Lp}" x2="${W}" y1="${yb(g)}" y2="${yb(g)}"/><text x="${Lp - 4}" y="${yb(g) + 4}" text-anchor="end">${g}</text>`;
  s += `<text x="${Lp + 2}" y="${T + 2}" style="fill:var(--sodium)">sodium mg</text><text x="${Lp + 2}" y="${mid + 12}" style="fill:var(--bp)">systolic mmHg</text>`;
  const bw = Math.min(22, colW - 10);
  days.forEach((d, i) => {
    const v = dayVal('sodium', d) || 0, x = cx(i) - bw / 2, capv = Math.min(v, max);
    const fillTop = lm ? ya(Math.min(capv, lm.l)) : ya(capv);
    s += `<rect x="${x}" y="${fillTop}" width="${bw}" height="${ya(0) - fillTop}" style="fill:var(--sodium)"/>`;
    if(lm && v > lm.l) s += `<rect x="${x}" y="${ya(capv)}" width="${bw}" height="${fillTop - ya(capv)}" fill="url(#hna)" style="stroke:var(--sodium)" stroke-width="1"/>`;
    for(const r of bpRecs().filter(r => dayOf(r) === d)) s += `<rect x="${cx(i) - 4}" y="${yb(Math.max(100, Math.min(130, r.sys))) - 4}" width="8" height="8" style="fill:var(--bp)"/>`;
    s += `<text x="${cx(i)}" y="${H - 5}" text-anchor="middle" ${d === NOW.day ? 'style="fill:var(--ink);font-weight:600"' : ''}>${dname(d).slice(0, 2)}</text>`;
  });
  if(lm) s += `<line x1="${Lp}" x2="${W}" y1="${ya(lm.l)}" y2="${ya(lm.l)}" style="stroke:var(--ink)" stroke-dasharray="4 3"/>`;
  s += `<line class="ax" x1="${Lp}" x2="${W}" y1="${ya(0)}" y2="${ya(0)}"/><line class="ax" x1="${Lp}" x2="${W}" y1="${H - B}" y2="${H - B}"/><line class="ax" x1="${Lp}" x2="${Lp}" y1="${T}" y2="${H - B}"/></svg>`;
  return s + `<p class="note">Dashed line: sodium limit ${lm ? n0(lm.l) + ' mg' : 'not set'}; hatched means over it. ${bpRecs().length} BP readings so far, too few to call a link.</p>`;
}

/* =========================================================
   Render (DOM morph keeps focus, scroll, drafts and transitions)
   ========================================================= */
function morph(from, to){
  if(from.nodeType !== to.nodeType || from.nodeName !== to.nodeName){ from.replaceWith(to); return; }
  if(from.nodeType === 3 || from.nodeType === 8){ if(from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
  for(const a of [...from.attributes]) if(!to.hasAttribute(a.name)) from.removeAttribute(a.name);
  for(const a of [...to.attributes]) if(from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  const tag = from.tagName;
  if(tag === 'INPUT'){
    if(from.type === 'checkbox') from.checked = to.hasAttribute('checked');
    else if(from.type !== 'file' && from !== document.activeElement){ const v = to.getAttribute('value') ?? ''; if(from.value !== v) from.value = v; }
    return;
  }
  if(tag === 'TEXTAREA'){ if(from !== document.activeElement && from.value !== to.textContent) from.value = to.textContent; return; }
  let want = null; if(tag === 'SELECT'){ const o = [...to.querySelectorAll('option')].find(o => o.hasAttribute('selected')); want = o ? (o.getAttribute('value') ?? o.textContent) : null; }
  morphChildren(from, to);
  if(want != null && from.value !== want) from.value = want;
}
function morphChildren(from, to){
  const tc = [...to.childNodes];
  const keyed = new Map();
  for(const c of from.childNodes) if(c.nodeType === 1 && c.dataset.key) keyed.set(c.dataset.key, c);
  let i = 0;
  for(const t of tc){
    const cur = from.childNodes[i];
    const k = t.nodeType === 1 && t.dataset ? t.dataset.key : null;
    if(k){
      const m = keyed.get(k);
      if(m){ if(m !== cur) from.insertBefore(m, cur || null); morph(m, t); }
      else from.insertBefore(t, cur || null);
    } else if(!cur){ from.appendChild(t); }
    else if(cur.nodeType === 1 && cur.dataset.key){ from.insertBefore(t, cur); }
    else morph(cur, t);
    i++;
  }
  while(from.childNodes.length > i) from.lastChild.remove();
}
const tpl = document.createElement('template');
function patch(el, html){ tpl.innerHTML = html; morphChildren(el, tpl.content); }

let focusAfter = null, dragging = false;

/* =========================================================
   Actions
   ========================================================= */
function setOf(id){ return S.sets.find(s => s.wins.includes(id)); }
function bringFront(id){ S.z[id] = ++S.zc; }
function focusWin(id, dir){
  const prev = S.focus, wasDesk = S.desk;
  S.focus = id; S.desk = false; S.railOpen = false;
  const set = setOf(id); if(set) S.activeSet = set.id;
  bringFront(id);
  if(!isWide() && (prev !== id || wasDesk)) S._enter = dir || 'r';
  if(!isWide()) S.soOpen = false;
}
function openApp(id){
  if(!S.open.includes(id)){
    if(S.open.length >= 6){ note('Six windows are open. Close one to open another.'); return; }
    S.open.push(id); S.wins[id] = winDefaults()[id];
    let set = S.sets.find(s => s.id === S.activeSet);
    if(!set || set.wins.length >= 3){ set = {id:'s' + (++S.nid), name:null, layout:'stage', wins:[]}; S.sets.push(set); S.activeSet = set.id; }
    set.wins.push(id); for(const w of set.wins) delete S.pos[w];
  }
  focusWin(id);
}
function closeWin(id){
  S.open = S.open.filter(x => x !== id);
  const set = setOf(id);
  if(set){ set.wins = set.wins.filter(x => x !== id); for(const w of set.wins) delete S.pos[w]; if(!set.wins.length) S.sets = S.sets.filter(s => s !== set); }
  delete S.pos[id]; S.wins[id] = winDefaults()[id];
  if(S.focus === id){
    const same = set && set.wins.length ? set.wins.slice().sort((a, b) => (S.z[b] || 0) - (S.z[a] || 0))[0] : null;
    if(same){ S.focus = same; }
    else if(isWide() && S.sets.length){ S.activeSet = S.sets[0].id; S.focus = S.sets[0].wins[0]; }
    else { S.focus = null; S.desk = true; }
  }
  if(!S.sets.find(s => s.id === S.activeSet) && S.sets[0]) S.activeSet = S.sets[0].id;
  if(!S.open.length){ S.desk = true; S.focus = null; }
}
function moveToSet(id, target){
  const from = setOf(id);
  if(target === 'new'){
    if(from && from.wins.length === 1){ return; }
    const ns = {id:'s' + (++S.nid), name:null, layout:'stage', wins:[]}; S.sets.push(ns); target = ns.id;
  }
  const to = S.sets.find(s => s.id === target); if(!to || to === from) return;
  if(to.wins.length >= 3){ note('A set holds up to 3 windows.'); return; }

/* ---------- global events ---------- */
let suppressClick = false;
document.addEventListener('click', e => {
  if(suppressClick){ suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const h = e.target.closest('[data-h]');
  if(h){ harness(h.dataset.h, h.dataset.arg); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(el.closest('[inert]')) return;
  const act = el.dataset.act, f = A[act]; if(!f) return;
  if(S.pop && act !== 'acct' && !el.closest('#pop')) S.pop = null;
  const r = f(el.dataset.arg, el, e);
  if(r !== 'norender') render();
}, true);
document.addEventListener('pointerdown', e => {
  if(S.pop && !e.target.closest('#pop') && !e.target.closest('[data-act="acct"]')){ S.pop = null; render(); }
});
document.addEventListener('input', e => {
  const el = e.target; const p = el.dataset && el.dataset.bind; if(!p) return;
  setPath(p, el.type === 'checkbox' ? el.checked : el.value);
  if(p.startsWith('drafts.bp')) S.drafts.bp.err = '';
  render();
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.actChange === 'import'){ const f = el.files && el.files[0]; if(f) note(`Import of ${f.name} is not part of this prototype. Nothing changed.`); el.value = ''; return; }
  if(el.dataset && el.dataset.hSel === 'demo'){ demo(el.value); el.value = ''; return; }
  if(el.tagName === 'SELECT' && el.dataset.bind){ setPath(el.dataset.bind, el.value); render(); }
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); return; }
  if(e.key !== 'Escape') return;
  if(S.mic && S.mic.phase === 'review'){ A.micDiscard(); return; }
  if(S.sheet){ S.sheet = null; focusAfter = '#bar .sb-signin, #bar .sb-acct'; render(); return; }
  if(S.pop){ S.pop = null; focusAfter = '#bar [data-act="acct"]'; render(); return; }
  if(S.settingsOpen){ A.settingsClose(); render(); return; }
  if(S.soOpen){ closeSO(); render(); return; }
  if(S.railOpen){ S.railOpen = false; focusAfter = '#bar [data-act="stack"]'; render(); return; }

/* ---------- gestures ---------- */
function track(e, onMove, onUp){
  const sx = e.clientX, sy = e.clientY, id = e.pointerId;
  const mv = ev => { if(ev.pointerId === id) onMove(ev.clientX - sx, ev.clientY - sy, ev); };
  const up = ev => { if(ev.pointerId !== id) return; window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); onUp(ev.clientX - sx, ev.clientY - sy, ev, ev.type === 'pointercancel'); };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}
function devRect(){ return $('#device').getBoundingClientRect(); }
document.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  const t = e.target;
  // left edge: rail follows the finger
  if(t.closest('#edge')){
    const rail = $('#rail'), sc = $('#scrim'), W = rail.offsetWidth; let dragging = false;
    patch(rail, railHTML()); rail.inert = false;
    track(e, dx => { dragging = true; const x = Math.max(-W, Math.min(0, dx - W)); rail.style.transition = 'none'; rail.style.visibility = 'visible'; rail.style.transform = `translateX(${x}px)`; sc.style.transition = 'none'; sc.style.visibility = 'visible'; sc.style.opacity = String(Math.max(0, Math.min(1, dx / W))); },
      dx => { rail.removeAttribute('style'); sc.removeAttribute('style'); if(dragging){ S.railOpen = dx > W * 0.35; if(S.railOpen) focusAfter = '#rail .rtile'; } render(); });
    return;
  }
  // rail: swipe left to close (phone)
  if(t.closest('#rail') && !isWide() && S.railOpen){
    const rail = $('#rail'), W = rail.offsetWidth; let moved = false;
    track(e, (dx, dy) => { if(dx < -8 && Math.abs(dx) > Math.abs(dy)){ moved = true; rail.style.transition = 'none'; rail.style.transform = `translateX(${Math.min(0, dx)}px)`; } },
      dx => { rail.removeAttribute('style'); if(moved){ suppressClick = true; setTimeout(() => suppressClick = false, 50); if(dx < -W * 0.3) S.railOpen = false; render(); } });
    return;
  }
  if(t.closest('[data-mic]')) return;
  // right edge (phone): Slide Over follows the finger
  if(t.closest('#redge')){
    const so = $('#so'), W = so.offsetWidth; let moved = false;
    track(e, dx => { if(dx < -4) moved = true; if(!moved) return; const pull = Math.max(0, Math.min(W, -dx)); so.style.transition = 'none'; so.style.visibility = 'visible'; so.style.transform = `translateX(${W - pull}px)`; },
      dx => { so.removeAttribute('style'); if(moved){ suppressClick = true; setTimeout(() => suppressClick = false, 50); if(-dx > W * 0.25) openSO(); render(); } });
    return;
  }
  // Slide Over: swipe right to dismiss (phone, or undocked at wide)
  const so = t.closest('#so');
  if(so && S.soOpen && !(isWide() && S.soDocked) && !t.closest('input,textarea,select')){
    const W = so.offsetWidth; let drag = false;
    track(e, (dx, dy) => { if(!drag && dx > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) drag = true; if(drag){ so.style.transition = 'none'; so.style.transform = `translateX(${Math.max(0, dx)}px)`; } },
      dx => { so.style.transform = ''; so.style.transition = ''; if(drag){ suppressClick = true; setTimeout(() => suppressClick = false, 50); if(dx > W * 0.3) closeSO(); render(); } });
    return;
  }
  // wide: rail chips drag into / out of sets
  const chip = t.closest('#rail .chip');
  if(chip && isWide()){
    const id = chip.dataset.chip; let ghost = null; const r0 = devRect();
    track(e, (dx, dy, ev) => {
      if(!ghost && Math.hypot(dx, dy) < 6) return;
      if(!ghost){ ghost = document.createElement('div'); ghost.className = 'ghost-drag'; ghost.textContent = winTitle(id); $('#device').appendChild(ghost); dragging = true; $('#device').classList.add('dragging'); }
      ghost.style.left = (ev.clientX - r0.left + 8) + 'px'; ghost.style.top = (ev.clientY - r0.top + 8) + 'px';
      $$('.drop-hot').forEach(x => x.classList.remove('drop-hot'));
      const over = document.elementFromPoint(ev.clientX, ev.clientY); const tgt = over && over.closest('[data-set],[data-newset]'); if(tgt) tgt.classList.add('drop-hot');
    }, (dx, dy, ev) => {
      $$('.drop-hot').forEach(x => x.classList.remove('drop-hot'));
      dragging = false; $('#device').classList.remove('dragging');
      if(!ghost) return; ghost.remove(); suppressClick = true; setTimeout(() => suppressClick = false, 50);
      const over = document.elementFromPoint(ev.clientX, ev.clientY); const tgt = over && over.closest('[data-set],[data-newset]');
      if(tgt) moveToSet(id, tgt.dataset.newset ? 'new' : tgt.dataset.set);
    });
    return;
  }
  // windows
  const win = t.closest('#wins > .win');
  if(!win) return;
  const id = win.dataset.win;
  if(isWide() && S.focus !== id){ S.focus = id; bringFront(id); render(); }
  const strip = t.closest('.tstrip');
  if(!strip || t.closest('button')) return;
  if(isWide()){
    const g0 = Object.assign({}, winGeom(id)); const st = $('#stage'); let moved = false;
    track(e, (dx, dy, ev) => {
      if(!moved && Math.hypot(dx, dy) < 4) return; if(!moved){ dragging = true; $('#device').classList.add('dragging'); } moved = true;
      const x = Math.max(-g0.w + 120, Math.min(st.clientWidth - 80, g0.x + dx)), y = Math.max(0, Math.min(st.clientHeight - 40, g0.y + dy));
      win.style.setProperty('--x', x + 'px'); win.style.setProperty('--y', y + 'px');
      $$('.drop-hot').forEach(z => z.classList.remove('drop-hot'));
      const over = document.elementFromPoint(ev.clientX, ev.clientY); const tgt = over && over.closest('#rail [data-set],#rail [data-newset]'); if(tgt) tgt.classList.add('drop-hot');
    }, (dx, dy, ev) => {
      $$('.drop-hot').forEach(z => z.classList.remove('drop-hot'));
      dragging = false; $('#device').classList.remove('dragging');
      if(!moved) return;
      win.style.visibility = 'hidden';
      const over = document.elementFromPoint(ev.clientX, ev.clientY); win.style.visibility = '';
      const tgt = over && over.closest('#rail [data-set],#rail [data-newset]');
      if(tgt){ moveToSet(id, tgt.dataset.newset ? 'new' : tgt.dataset.set); return; }
      const x = Math.max(-g0.w + 120, Math.min(st.clientWidth - 80, g0.x + dx)), y = Math.max(0, Math.min(st.clientHeight - 40, g0.y + dy));
      S.pos[id] = {x, y, w:g0.w, h:g0.h}; render();
    });
  } else {
    // phone: swipe the title strip to switch windows (one gesture)
    track(e, () => {}, dx => {
      if(Math.abs(dx) < 60 || S.open.length < 2) return;
      const i = S.open.indexOf(id), n = S.open.length;
      const next = S.open[(i + (dx < 0 ? 1 : -1) + n) % n];
      focusWin(next, dx < 0 ? 'r' : 'l'); render();
    });
  }
});

/* ---------- mic: press and hold ---------- */
let micTimer = null, micStart = 0, micOrigin = null;
function micBegin(x, y){
  if(!S.signedIn) return;
  micStart = Date.now(); micOrigin = {x, y};
  S.mic = {phase:'listen', elapsed:0, level:0.35, cancel:false}; S.pop = null; S.toast = null;
  render();
  clearInterval(micTimer);
  micTimer = setInterval(() => { if(!S.mic || S.mic.phase !== 'listen' || S.mic.frozen) return; const el = Date.now() - micStart; const words = Math.floor(el / 330) + 1; S.mic.elapsed = el; S.mic.level = words <= SPEECH.length ? 0.35 + ((words * 7) % 10) / 20 : 0.12; patch($('#micpanel'), micHTML()); }, 200);
}
function micEnd(cancelled){
  clearInterval(micTimer);
  if(!S.mic || S.mic.phase !== 'listen') return;
  const held = Date.now() - micStart;
  if(cancelled || S.mic.cancel){ S.mic = null; note('Cancelled. Nothing logged.'); return; }
  if(held < 300 && !S.mic.frozen){ S.mic = null; note('Hold the button while you talk.'); return; }
  S.mic = {phase:'review', items:reviewItems()}; focusAfter = '#micpanel [data-autofocus]'; render();
}
/* the mic is rendered inside the bottom strip (phone, or wide with Log hidden) or the Log column footer (wide, docked) */
const visMic = () => $$('[data-mic]').find(e => e.offsetParent !== null) || null;
let micPid = null;
document.addEventListener('pointerdown', e => {
  const m = e.target.closest && e.target.closest('[data-mic]'); if(!m || e.button !== 0) return;
  e.preventDefault(); micPid = e.pointerId; try{ m.setPointerCapture(e.pointerId); }catch(_){} micBegin(e.clientX, e.clientY);
}, true);
document.addEventListener('pointermove', e => {
  if(e.pointerId !== micPid || !S.mic || S.mic.phase !== 'listen' || !micOrigin) return;
  const d = Math.hypot(e.clientX - micOrigin.x, e.clientY - micOrigin.y);
  const c = d > 90; if(c !== S.mic.cancel){ S.mic.cancel = c; patch($('#micpanel'), micHTML()); }
});
document.addEventListener('pointerup', e => { if(e.pointerId !== micPid) return; micPid = null; micEnd(false); });
document.addEventListener('pointercancel', e => { if(e.pointerId !== micPid) return; micPid = null; micEnd(true); });
document.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('[data-mic]')) e.preventDefault(); });
document.addEventListener('keydown', e => { if(e.target.matches && e.target.matches('[data-mic]') && (e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); micBegin(0, 0); } });
document.addEventListener('keyup', e => { if(e.target.matches && e.target.matches('[data-mic]') && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); micEnd(false); } });

/* ---------- harness + demo states ---------- */
function harness(act, arg){
  if(act === 'toggle') S.harnessOpen = !S.harnessOpen;
  if(act === 'vp') S.vp = arg;
  if(act === 'theme') S.set.theme = arg;
  if(act === 'auth'){ S.signedIn = arg === 'in'; if(!S.signedIn) S.mic = null; }
  if(act === 'net') S.online = arg === 'on';
  if(act === 'reset'){ const keep = {vp:S.vp, harnessOpen:S.harnessOpen}; S = Object.assign(defaults(), keep); undoSnap = null; }
  render(); requestAnimationFrame(render);
}
function demo(k){
  const keep = {harnessOpen:S.harnessOpen, vp:S.vp};
  S = Object.assign(defaults(), keep);
  const phone = () => { S.vp = '390'; }, wide = () => { S.vp = '1280'; };
  const wins = (sets, focus) => { S.sets = sets; S.open = sets.flatMap(x => x.wins); S.z = {}; S.open.forEach((id, i) => S.z[id] = i + 1); S.zc = S.open.length + 1; S.z[focus] = S.zc; S.focus = focus; S.activeSet = sets.find(x => x.wins.includes(focus)).id; S.desk = false; };
  switch(k){
    case '1': phone(); S.set.theme = 'dark'; S.signedIn = true; break;
    case '2': phone(); S.set.theme = 'light'; S.signedIn = false; break;
    case '3': phone(); wins([{id:'s1',name:'Morning check',layout:'stage',wins:['log','meds']},{id:'s2',name:null,layout:'stage',wins:['metrics']}], 'meds');
      S.wins.meds.tab = 'stock'; S.wins.metrics.range = '30d'; S.drafts.bp.sys = '128'; S.wins.log.tab = 'bp'; S.railOpen = true; break;
    case '4': wide(); wins([{id:'s3',name:null,layout:'stage',wins:['meds','metrics']},{id:'s1',name:'Morning check',layout:'stage',wins:['log']},{id:'s2',name:null,layout:'stage',wins:['history']}], 'meds'); break;
    case '5': S.drafts.food = Object.assign(draftDefaults().food, {desc:'Ham and cheese toastie', src:'salt', unit:'g', amt:'1.5'}); S.qk = 'food'; S.soOpen = true; break;
    case '6': S.mic = {phase:'listen', elapsed:3100, level:0.75, cancel:false, frozen:true}; micStart = Date.now() - 3100; break;
    case '6b': S.mic = {phase:'review', items:reviewItems()}; break;
    case '7': wins([{id:'s1',name:null,layout:'stage',wins:['meds']}], 'meds'); S.settingsOpen = true; break;
    case '8': wins([{id:'s1',name:null,layout:'stage',wins:['meds']}], 'meds'); S.wins.meds.tab = 'titr'; break;
  }
  render(); requestAnimationFrame(render);
}

/* ---------- boot ---------- */
new ResizeObserver(() => { const w = isWide(); if(w !== render._w){ render._w = w; render(); } }).observe($('#device'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.set.theme === 'system' && render());
render._w = null;
render();
requestAnimationFrame(render);
</script>
</body>
