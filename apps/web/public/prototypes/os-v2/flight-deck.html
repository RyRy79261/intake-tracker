<!doctype html>
<!-- PROTOTYPE (throwaway): Flight Deck (PFD tapes + MFD pages + soft keys) — intake-tracker app-OS concept -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight Deck · intake-tracker prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --v { syntax: '<number>'; inherits: true; initial-value: 0; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#34312D;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;border-radius:0;text-align:center}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:100vw;height:100vh;height:100dvh;position:relative;overflow:hidden;flex:none}
body.vp-390 #app{width:390px;height:844px;transform:scale(var(--fit,1));transform-origin:center}
body.vp-1280 #app{width:1280px;height:800px;transform:scale(var(--fit,1));transform-origin:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ THEME ============ */
/* Warm graphite / warm stone hardware; neutral near-black / paper displays. */
.os{--f:'B612','Tahoma','Verdana',sans-serif;--m:'IBM Plex Mono','Consolas','Menlo',monospace}
.os[data-theme=dark]{
  --bezel:#1D1A17;--key:#2A2622;--key-hi:#39342F;--lip:#0C0B0A;--display:#0A0B0C;--rule:#2C2A27;--fg:#EEEAE3;--muted:#A0998E;--on-ink:#0A0B0C;
  --water:#27B8FC;--sodium:#FEBF32;--sugar:#FEA5C8;--caffeine:#B66946;--alcohol:#CB5BDD;--bp:#F53C41;--weight:#68E371;--bathroom:#B4D8E1;--meds:#3DCFCB;--ai:#8688FE;
  --pill:#D9C8F0;color-scheme:dark}
.os[data-theme=light]{
  --bezel:#D3CCBF;--key:#E8E3D9;--key-hi:#F6F2EB;--lip:#A9A193;--display:#FBFAF7;--rule:#DAD4C9;--fg:#15130F;--muted:#5B554C;--on-ink:#FBFAF7;
  --water:#0667AA;--sodium:#A46E01;--sugar:#C64080;--caffeine:#783D27;--alcohol:#881998;--bp:#BB061E;--weight:#107823;--bathroom:#2F4A5A;--meds:#06888C;--ai:#5449D0;
  --pill:#D9CEF2;color-scheme:light}
.os{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bezel);color:var(--fg);font:400 15px/1.3 var(--f);user-select:none;-webkit-user-select:none}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
:focus{outline:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.c-water{color:var(--water)}.c-sodium{color:var(--sodium)}.c-sugar{color:var(--sugar)}.c-caffeine{color:var(--caffeine)}.c-alcohol{color:var(--alcohol)}.c-bp{color:var(--bp)}.c-weight{color:var(--weight)}.c-bathroom{color:var(--bathroom)}.c-meds{color:var(--meds)}.c-ai{color:var(--ai)}.c-potassium,.c-none{color:var(--fg)}
[data-dom=water]{--d:var(--water)}[data-dom=sodium]{--d:var(--sodium)}[data-dom=sugar]{--d:var(--sugar)}[data-dom=caffeine]{--d:var(--caffeine)}[data-dom=alcohol]{--d:var(--alcohol)}[data-dom=bp]{--d:var(--bp)}[data-dom=weight]{--d:var(--weight)}[data-dom=bathroom]{--d:var(--bathroom)}[data-dom=meds]{--d:var(--meds)}[data-dom=ai]{--d:var(--ai)}[data-dom=potassium],[data-dom=none]{--d:var(--fg)}

/* ============ HARDWARE: flat frames, flat square keys with lit bars ============ */
.frame{background:var(--bezel);padding:4px}
.display{background:var(--display);border:1px solid var(--lip);position:relative;overflow:hidden}
.cap{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 8px 3px;font:700 13px/1.1 var(--f);color:var(--fg);background:var(--key);position:relative;touch-action:manipulation;white-space:nowrap}
.cap::after{content:'';position:absolute;left:10px;right:10px;bottom:4px;height:3px;background:transparent}
.cap:hover,.cap:active{background:var(--key-hi)}
.cap[aria-pressed=true],.cap.on{background:var(--key-hi)}
.cap[aria-pressed=true]::after,.cap.on::after{background:var(--fg)}
.cap[disabled]{color:var(--muted);cursor:default}
.cap[disabled]:hover{background:var(--key)}
.cap .ico{width:16px;height:16px}

/* ============ SYSTEM BAR ============ */
.sysbar{flex:none;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 2px 0;display:flex;align-items:center;gap:2px;background:var(--bezel);border-bottom:1px solid var(--lip);position:relative;z-index:30}
.sysbar > *{flex:none}
.sb-btn{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;color:var(--fg)}
.sb-btn:hover{background:var(--key)}
.sb-time{display:none;font:500 14px var(--m);padding:0 4px;white-space:nowrap}
.sb-time .wd{display:none;font-family:var(--f);font-size:13px}
.sb-dose{height:44px;display:flex;align-items:center;gap:6px;padding:0 9px 0 11px;box-shadow:inset 3px 0 0 var(--meds);background:var(--key);font-size:13px;white-space:nowrap;min-width:0;flex:0 1 auto;overflow:hidden}
.sb-dose:hover{background:var(--key-hi)}
.sb-dose b{font:600 14px var(--m)}
.sb-dose .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sysbar .sb-spacer{flex:1 1 0;min-width:0}
.sb-sync{display:none;font-size:13px;gap:6px;padding:0 6px;white-space:nowrap;align-items:center;height:44px}
.lamp{width:8px;height:8px;border:1.5px solid var(--fg);display:inline-block;flex:none}
.lamp.on{background:var(--fg)}
.acct{gap:6px}
.acct .rn{width:30px;height:30px;border:1px solid var(--fg);display:flex;align-items:center;justify-content:center;font:600 12px var(--m)}
.acct .nm{display:none;font-size:14px}
.chip-ai{display:inline-flex;align-items:center;gap:3px;color:var(--ai);font:700 12px/1 var(--f);padding:4px 3px 5px;box-shadow:inset 0 -2px 0 var(--ai);white-space:nowrap}
.chip-ai .ico{width:12px;height:12px}
.signin{font:700 13px var(--f);background:var(--key);box-shadow:inset 0 -3px 0 var(--ai);padding:0 10px;white-space:nowrap}
.signin .ico{color:var(--ai);width:16px;height:16px}

/* ============ DECK ============ */
.deck{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:4px 4px 0}
.pfd-col{flex:none;display:flex;flex-direction:column;gap:4px;min-height:0}
.mfd-area{flex:1;min-height:0;display:flex;gap:6px}
.mfd{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.mfd > .display{flex:1;min-height:0;display:flex;flex-direction:column}
.bezel{flex:none;display:flex;gap:4px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:var(--bezel)}
.bezel .pk-row{flex:1;display:flex;gap:4px;min-width:0}
.softkeys{flex:none;display:flex;gap:4px;padding-top:4px}
.softkeys .cap{flex:1 1 0;min-width:0}
.softkeys .cap span{overflow:hidden;text-overflow:ellipsis}

/* page keys */
.pk{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:5px 2px 9px;font-size:12px}
.pk .lbl{font-size:12px;white-space:nowrap;letter-spacing:-.01em}
.pk.open::after{background:var(--muted);height:2px;bottom:4px}
.pk.cur{background:var(--key-hi)}
.pk.cur::after{background:var(--fg);height:4px;left:6px;right:6px;bottom:3px}
.pk .due{position:absolute;top:3px;right:3px;min-width:18px;height:18px;padding:0 3px;background:var(--meds);color:var(--on-ink);font:700 12px/18px var(--m);text-align:center}
.pk .where{font:400 12px/1 var(--f);color:var(--muted);flex-basis:100%;text-align:center}
.pk-meds{flex-grow:1.55}
.mic{flex:none;width:58px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--key);color:var(--ai);box-shadow:inset 0 0 0 2px var(--ai);font:700 12px/1 var(--f);touch-action:none;position:relative}
.mic:hover{background:var(--key-hi)}
.mic .ico{width:18px;height:18px}
.mic.held{background:var(--ai);color:var(--on-ink)}

/* ============ PFD: today + this week ============ */
.pfd{padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px}
.pfd-head{display:flex;align-items:center;gap:8px;font-size:12px;min-height:22px;white-space:nowrap}
.pfd-head .dt{font-size:13px}
.pfd-head .dt b{font-size:15px;margin-right:6px}
.pfd-head .lg{margin-left:auto;color:var(--muted);display:flex;gap:9px;align-items:center}
.pfd-head .lg span{display:flex;align-items:center;gap:3px}
.lg-over{display:inline-block;width:12px;height:8px;background-image:repeating-linear-gradient(-45deg,var(--fg) 0 1.5px,transparent 1.5px 3.5px);box-shadow:inset 0 0 0 1px var(--fg)}
.lg-lim{display:inline-block;width:12px;height:8px;background:var(--fg)}
.hbtn{font:700 12px var(--f);text-decoration:underline;text-underline-offset:3px;min-height:24px;padding:0 4px;position:relative}
.hbtn::after{content:'';position:absolute;inset:-10px -4px}
.pfd-now{display:flex;gap:4px}
.axsp{width:12px;flex:none}
.now{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative}
.now:hover .tlabel b{text-decoration:underline}
.tlabel{display:flex;justify-content:space-between;align-items:baseline;gap:2px;font-size:12px;line-height:14px;border-top:3px solid var(--d);padding-top:3px;white-space:nowrap}
.tlabel b{font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tlabel .u{font:400 12px var(--m);color:var(--muted)}
.readout{border:1px solid var(--fg);font:600 20px/28px var(--m);text-align:center;height:30px;position:relative;white-space:nowrap;font-variant-numeric:tabular-nums}
.n6 .readout{font-size:17px}
.readout.st-over::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background-image:repeating-linear-gradient(-45deg,var(--d) 0 2px,transparent 2px 4px)}
.readout.st-limit{background:var(--d);color:var(--on-ink);border-color:var(--d)}
.tstatus{font-size:12px;line-height:15px;color:var(--muted);overflow-wrap:anywhere}
.tstatus.st-over{color:var(--fg);font-weight:700}
.tstatus.st-limit b{background:var(--d);color:var(--on-ink);padding:0 3px}
.pfd-cap{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:5px}
.pfd-cap .hbtn{color:var(--fg)}
.pfd-wk{display:flex;gap:4px;--rowh:12px;--barh:6px}
.axis{list-style:none;width:12px;flex:none;padding-top:15px;display:flex;flex-direction:column;font:500 12px var(--m);color:var(--muted)}
.axis li{height:var(--rowh);line-height:var(--rowh)}
.axis li.today{color:var(--fg);font-weight:700}
.wkwrap{flex:1 1 0;min-width:0;position:relative;padding-top:15px;cursor:pointer}
.wk{list-style:none;display:flex;flex-direction:column;position:relative}
.wk li{height:var(--rowh);position:relative}
.wk .trk{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
.wk .b{position:absolute;top:50%;height:var(--barh);transform:translateY(-50%)}
.wk .b.ok{left:0;background:var(--d)}
.wk .b.ov{background-image:repeating-linear-gradient(-45deg,var(--d) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--d)}
.wk .b.lm{background:var(--fg)}
.wk li.today .b{height:calc(var(--barh) + 3px)}
.wk li.today .trk{background:var(--muted)}
.wk .wf{display:none;font:500 12px/var(--rowh) var(--m);white-space:nowrap}
.figs .wk .wf{display:inline-block}
.figs .wk .b,.figs .wk .trk,.figs .limline,.figs .bugtri{display:none}
.figs .wk li.st-over .wf{box-shadow:inset 0 -3px 0 var(--d)}
.figs .wk li.st-limit .wf{background:var(--d);color:var(--on-ink);padding:0 2px}
.figs .wk li.today .wf{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.limline{position:absolute;top:11px;bottom:0;width:0;border-left:1px dashed var(--fg)}
.bugtri{position:absolute;top:4px;margin-left:-4px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--fg)}
.buglbl{position:absolute;top:0;font:500 12px/12px var(--m);white-space:nowrap}
.buglbl.l{transform:translateX(calc(-100% - 5px))}
.buglbl.r{transform:translateX(5px)}
.buglbl.none{left:0;color:var(--muted);font-family:var(--f)}
.figs .buglbl.l,.figs .buglbl.r{left:0!important;transform:none;color:var(--muted)}
/* collapsed strip */
.pfd-frame.collapsed .pfd{padding:0 4px;height:44px;flex-direction:row}
.strip{display:flex;width:100%;height:100%;align-items:stretch;gap:4px;text-align:left}
.strip .it{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 3px 0 var(--d);padding:4px 0 0 1px}
.strip .it span{font-size:12px;line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.strip .it b{font:600 15px/17px var(--m);white-space:nowrap}
.strip .it b.st-limit{background:var(--d);color:var(--on-ink);padding:0 2px}
.swatch{display:inline-block;width:8px;height:12px;vertical-align:-1px;margin-left:3px;background-image:repeating-linear-gradient(-45deg,var(--d) 0 1.5px,transparent 1.5px 3.5px);box-shadow:inset 0 0 0 1px var(--d)}
/* vertical tape (wide only) */
.tape{flex:1;min-height:96px;position:relative;margin:2px 0}
.tape .scale{position:absolute;left:0;top:0;bottom:0;width:6px}
.tape .tick{position:absolute;left:0;width:6px;height:1px;background:var(--muted)}
.tape .tick.mj{width:9px;background:var(--fg)}
.tape .bar{position:absolute;left:10px;top:0;bottom:0;width:18px;border:1px solid var(--rule);background:var(--display)}
.bar .buf{position:absolute;left:0;right:0;background-image:repeating-linear-gradient(-45deg,var(--rule) 0 1px,transparent 1px 4px)}
.bar .seg{position:absolute;left:0;right:0}
.bar .s-ok{bottom:0;height:calc(min(var(--v),var(--lim)) / var(--max) * 100%);background:var(--d)}
.bar .s-over{bottom:calc(var(--lim) / var(--max) * 100%);height:calc(clamp(0, var(--v) - var(--lim), var(--buf)) / var(--max) * 100%);background-image:repeating-linear-gradient(-45deg,var(--d) 0 2px,transparent 2px 4.5px);box-shadow:inset 0 0 0 1px var(--d)}
.bar .s-lim{bottom:calc((var(--lim) + var(--buf)) / var(--max) * 100%);height:calc(max(0, var(--v) - var(--lim) - var(--buf)) / var(--max) * 100%);background:var(--fg)}
.bar .s-free{bottom:0;height:calc(min(var(--v),var(--max)) / var(--max) * 100%);background:var(--d)}
.tape.anim{transition:--v 150ms linear}
.tbug{position:absolute;left:29px;width:0;height:0;margin-bottom:-5px;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:7px solid var(--fg)}
.tbuglbl{position:absolute;left:38px;font:500 12px/12px var(--m);margin-bottom:-6px}
.tnolimit{position:absolute;left:32px;top:50%;font:400 12px/1.2 var(--f);color:var(--muted);transform:translateY(-50%)}

/* ============ DISPLAY TITLE, PAGE ============ */
.mfd-title{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding-left:10px;border-bottom:1px solid var(--rule)}
.mfd-title h2{font:700 16px var(--f);white-space:nowrap}
.mfd-title .ctx{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfd-title.msg{background:var(--key);box-shadow:inset 3px 0 0 var(--fg)}
.mfd-title.msg .mtxt{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font:700 13px var(--f);border-left:1px solid var(--rule);white-space:nowrap}
.tbtn:hover{background:var(--key-hi)}
.page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain;user-select:text;-webkit-user-select:text;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.page.fade{animation:fade 80ms linear}
@keyframes fade{from{opacity:.2}to{opacity:1}}
.page button{user-select:none;-webkit-user-select:none}

/* ============ PAGE CONTENT ============ */
.sec{padding:10px 12px}
.sec + .sec{border-top:1px solid var(--rule)}
.sech{font:700 12px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sech > span:last-child:not(:first-child){text-transform:none;letter-spacing:0;font-weight:400}
.row{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--rule);padding:4px 0}
.row:last-child{border-bottom:0}
.spine{align-self:stretch;width:3px;background:var(--d);flex:none}
.grow{flex:1;min-width:0}
.t1{font-size:15px}
.t2{font-size:13px;color:var(--muted)}
.box{border:1px solid var(--fg);padding:1px 6px;font-family:var(--m);white-space:nowrap}
.inv{background:var(--d);color:var(--on-ink);padding:1px 5px;font-weight:700;white-space:nowrap;font-size:13px}
.dbtn{min-height:44px;padding:0 14px;background:var(--key);font:700 14px var(--f);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.dbtn:hover{background:var(--key-hi)}
.dbtn.solid{background:var(--fg);color:var(--display)}
.dbtn.ai{color:var(--ai);box-shadow:inset 0 -3px 0 var(--ai)}
.dbtn.danger{color:var(--bp);box-shadow:inset 0 0 0 1px var(--bp)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quiet{font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:flex;align-items:center}
.seg{display:inline-flex;gap:2px}
.seg button{min-height:44px;min-width:44px;padding:0 11px 3px;font:700 13px var(--f);background:var(--key);position:relative}
.seg button:hover{background:var(--key-hi)}
.seg button::after{content:'';position:absolute;left:7px;right:7px;bottom:4px;height:3px}
.seg button[aria-pressed=true]{background:var(--key-hi)}
.seg button[aria-pressed=true]::after{background:var(--fg)}
.chipbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.chip{min-height:44px;padding:0 11px 3px 13px;background:var(--key);box-shadow:inset 3px 0 0 var(--d);font:700 13px var(--f);white-space:nowrap;position:relative}
.chip:hover{background:var(--key-hi)}
.chip[aria-pressed=true]{background:var(--key-hi)}
.chip[aria-pressed=true]::after{content:'';position:absolute;left:9px;right:7px;bottom:4px;height:3px;background:var(--fg)}
.fline{display:flex;align-items:center;gap:8px;padding:0 0 0 12px;border-bottom:1px solid var(--rule);font-size:14px;min-height:44px}
.fline .grow b{font-weight:700}

/* log page */
.logpage{min-height:100%;display:flex;flex-direction:column;padding:8px}
.recent{padding:2px 4px 10px}
.rrow{display:flex;align-items:center;gap:8px;min-height:32px;font-size:14px;border-bottom:1px solid var(--rule)}
.rrow:last-child{border-bottom:0}
.rrow .tm{font:500 13px var(--m);color:var(--muted);width:42px;flex:none}
.rrow .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .val{font:600 13px var(--m);white-space:nowrap}
.keys{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.krow,.wrow{display:flex;gap:4px}
.lk{flex:1 1 auto;min-width:0;min-height:56px;background:var(--key);box-shadow:inset 3px 0 0 var(--d);padding:5px 8px 5px 12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;text-align:left}
.lk:hover,.lk:active{background:var(--key-hi)}
.lk .kt{display:flex;align-items:center;gap:6px;font:700 15px/1.15 var(--f)}
.lk .kt .ico{color:var(--d)}
.lk .ks{font:400 12px/1.2 var(--m);color:var(--muted);padding-left:24px}
.wrow .sq{width:50px;flex:none;font:600 24px var(--m);background:var(--key);min-height:56px}
.wrow .sq:hover{background:var(--key-hi)}
.wrow .sq[disabled]{color:var(--muted);cursor:default}
.wamt{flex:0 0 92px;display:flex;align-items:baseline;justify-content:center;gap:4px;font:600 22px/54px var(--m);box-shadow:inset 0 0 0 1px var(--water);color:var(--fg)}
.wamt .un{font:400 13px var(--m);color:var(--muted)}
.wrow .lk{flex:1 1 auto}

/* forms */
.form{min-height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 8px 0}
.form .kpad{position:sticky;bottom:0;margin:auto -8px 0;z-index:2}
.frow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.frow .txtin{flex:1 1 150px;width:auto}
.fields{display:flex;gap:6px}
.field{flex:1 1 0;min-width:0;background:var(--key);padding:5px 8px 6px;display:flex;flex-direction:column;gap:1px;min-height:58px;text-align:left;position:relative}
.field.wide{flex-grow:1.6}
.field.active{box-shadow:inset 0 0 0 2px var(--fg)}
.field.active::after{content:'';position:absolute;left:8px;right:8px;bottom:4px;height:3px;background:var(--d)}
.field .fl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .fv{font:600 22px/26px var(--m);white-space:nowrap}
.field .fv .un{font:400 13px var(--m);color:var(--muted);margin-left:4px}
.field .fv .ph{color:var(--muted)}
.field .fsub{font:500 12px var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
.kpad button{height:48px;background:var(--display);font:600 21px var(--m)}
.kpad button.tx{font:700 14px var(--f)}
.kpad button:hover{background:var(--key)}
.kpad button:active{background:var(--key-hi)}
.line{font-size:14px}
.txtin{width:100%;min-height:44px;background:var(--key);border:0;box-shadow:inset 0 -2px 0 var(--muted);padding:0 10px;font:400 15px var(--f);user-select:text}
.txtin::placeholder{color:var(--muted)}
.txtin:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper .dbtn{min-width:64px;font-family:var(--m);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:8px}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.check .bx{width:22px;height:22px;border:1px solid var(--fg);display:flex;align-items:center;justify-content:center}
.check[aria-checked=true] .bx{background:var(--fg);color:var(--display)}
.check .bx .ico{width:14px;height:14px}
.preset{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;text-align:left;border-bottom:1px solid var(--rule);padding:4px 4px}
.preset:hover{background:var(--key)}
.preset .ico{color:var(--d)}
/* meds */
.dose{display:flex;gap:10px;align-items:center;min-height:56px;border-bottom:1px solid var(--rule);padding:8px 0}
.st-word{font:700 13px var(--f);white-space:nowrap;text-align:right}
.st-word .mono{font-weight:500}
.st-due{box-shadow:inset 0 0 0 1px var(--meds);color:var(--meds);padding:2px 6px}
.card{background:var(--key);box-shadow:inset 3px 0 0 var(--meds);padding:12px 12px 12px 15px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card h4{font:700 15px var(--f)}
.pillid{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pillid svg{width:30px;height:18px;flex:none}
.bigfig{font:600 22px/28px var(--m);border:1px solid var(--fg);padding:0 7px;white-space:nowrap}
.reasons{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
/* metrics */
.mrow{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"n v" "s s";gap:1px 8px;padding:7px 0;border-bottom:1px solid var(--rule)}
.mrow:last-child{border-bottom:0}
.mrow .n{grid-area:n;display:flex;gap:7px;align-items:center;font-weight:700;white-space:nowrap}
.mrow .n i{width:3px;height:16px;background:var(--d);display:inline-block}
.mrow .v{grid-area:v;text-align:right;font:600 15px var(--m);white-space:nowrap}
.mrow .s{grid-area:s;font-size:13px;color:var(--muted);padding-left:10px}
.chart{width:100%;display:block}
.chart text{font:400 12px var(--f);fill:var(--muted)}
.chart .lab{fill:var(--fg)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
/* history */
.lrow{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--rule);padding:4px 0;width:100%;text-align:left}
.lrow .tm{font:500 13px var(--m);width:44px;flex:none;color:var(--muted)}
.lrow .val{font:600 14px var(--m);text-align:right;white-space:nowrap}
.lacts{display:flex;gap:6px;padding:0 0 8px 52px;border-bottom:1px solid var(--rule)}
.ledit{display:flex;flex-direction:column;gap:6px;padding:6px 0 10px 52px;border-bottom:1px solid var(--rule)}
.ledit label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.ledit input{width:110px;min-height:44px;border:0;box-shadow:inset 0 -2px 0 var(--fg);background:var(--key);padding:0 8px;font:600 15px var(--m);user-select:text}
.dayh{font:700 12px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 0 5px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
.dayh span:last-child{text-transform:none;letter-spacing:0;font-weight:400}

/* ============ OVERLAYS ============ */
.ovl{position:absolute;z-index:50}
.settings{left:0;right:0;top:calc(48px + env(safe-area-inset-top));bottom:0;background:var(--bezel);padding:4px 4px calc(4px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.settings > .display{display:flex;flex-direction:column;flex:1;min-height:0}
.set-body{flex:1;overflow-y:auto;user-select:text}
.set-g{border-bottom:1px solid var(--rule)}
.set-g > button{width:100%;min-height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:700 15px var(--f);text-align:left}
.set-g > button:hover{background:var(--key)}
.set-g > button .ico{transition:transform 80ms}
.set-g > button[aria-expanded=true] .ico{transform:rotate(180deg)}
.set-c{padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
.set-intro{font-size:13px;color:var(--muted);padding:2px 0 8px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-top:1px solid var(--rule);padding:6px 0;flex-wrap:wrap}
.srow .lbl{font-size:15px;flex:1;min-width:140px}
.srow .lbl small{display:block;font-size:13px;color:var(--muted)}
.mini{display:inline-flex;align-items:center;gap:2px}
.mini button{width:44px;height:44px;font:600 18px var(--m);background:var(--key)}
.mini button:hover{background:var(--key-hi)}
.mini output{min-width:72px;text-align:center;font:600 15px var(--m);line-height:44px;padding:0 4px;box-shadow:inset 0 0 0 1px var(--fg)}
.capt{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.capt .mini{color:var(--fg)}
.sel{min-height:44px;border:0;background:var(--key);padding:0 8px;font:400 15px var(--f)}
.popover{top:calc(48px + env(safe-area-inset-top));right:48px;width:260px;background:var(--bezel);padding:4px}
.popover .display{padding:4px 12px}
.popover .row button{flex:1;text-align:left;min-height:44px;font:700 14px var(--f);display:flex;align-items:center;gap:8px}
.sheet{left:0;right:0;bottom:0;background:var(--bezel);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.sheet .display{padding:14px;display:flex;flex-direction:column;gap:10px}
.sheet h3{font:700 17px var(--f)}
.scrim{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.4)}
.switcher{position:absolute;inset:44px 0 0 0;z-index:20;background:var(--display);border-top:2px solid var(--fg);overflow-y:auto;padding:6px 12px}
.swrow{display:flex;align-items:center;gap:8px;min-height:58px;border-bottom:1px solid var(--rule)}
.swrow > button:first-of-type{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-height:58px}
.swrow.cur{box-shadow:inset 3px 0 0 var(--fg);padding-left:9px}
.swrow .tbtn{border:0;background:var(--key)}
.micp{left:4px;right:4px;bottom:calc(56px + env(safe-area-inset-bottom));background:var(--bezel);padding:4px}
.micp .display{padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 3px 0 var(--ai)}
.micp h3{font:700 15px var(--f);display:flex;align-items:center;gap:6px;color:var(--ai)}
.meter{display:flex;gap:2px;height:14px}
.meter i{flex:1;background:var(--rule)}
.meter i.on{background:var(--ai)}
.transcript{font:400 16px/1.4 var(--f);min-height:44px;box-shadow:inset 3px 0 0 var(--ai);padding-left:10px}
.micp.cancel .display{box-shadow:inset 0 0 0 2px var(--bp)}
.rev{display:flex;flex-direction:column}
.rev input{width:64px;min-height:44px;border:0;box-shadow:inset 0 -2px 0 var(--fg);background:var(--key);font:600 15px var(--m);padding:0 6px;text-align:right;user-select:text}

/* ============ WIDE (app ≥ 768) ============ */
.os.wide .sysbar{height:48px;padding:0 6px;gap:4px}
.os.wide .sb-time{display:inline}
.os.wide .sb-time .wd{display:inline}
.os.wide .sb-sync{display:flex}
.os.wide .acct .nm{display:inline}
.os.wide .deck{flex-direction:row;padding:6px;gap:6px}
.os.wide .pfd-col{width:408px;flex:none;gap:6px}
.os.wide .pfd-frame:not(.collapsed){flex:1;min-height:0;display:flex}
.os.wide .pfd-frame:not(.collapsed) > .pfd{flex:1;min-height:0;padding:8px 10px 10px}
.os.wide .pfd-now{flex:1;min-height:0}
.os.wide .now{height:100%}
.os.wide .readout{font-size:22px}
.os.wide .pfd-wk{--rowh:14px;--barh:8px}
.os.wide .cluster-frame{flex:none;display:flex;flex-direction:column}
.os.wide .cluster-frame.grow{flex:1;min-height:0}
.os.wide .cluster-frame > .display{display:flex;flex-direction:column;min-height:0}
.os.wide .cluster-frame.grow > .display{flex:1}
.os.wide .cluster-frame:not(.grow) .page{flex:none;overflow:visible}
.mfd-keys{display:flex;gap:4px;padding-top:4px}
.mfd-keys .pk{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px 6px;min-height:52px;padding:4px 6px 9px}
.mfd-keys .pk .lbl{font-size:13px}
.os.wide .settings{left:auto;width:420px;top:54px;bottom:6px;right:6px;padding:4px}
.os.wide .popover{right:52px;top:48px}
.os.wide .sheet{left:auto;right:6px;bottom:6px;width:420px}
.os.wide .micp{left:6px;right:auto;bottom:6px;width:408px}
.launch{display:flex;flex-direction:column;padding:6px 12px}
.launch button{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--rule);text-align:left}
.launch button:hover{background:var(--key)}

.os.reduce *{transition:none!important;animation:none!important}
.os.bigtext .page,.os.bigtext .set-body{zoom:1.12}
@media (prefers-reduced-motion: reduce){.os *{transition:none!important;animation:none!important}}

/* ============ REVIEW HARNESS (outside the product; press ` to hide it entirely) ============ */
.hx{position:fixed;z-index:1000;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#111;user-select:none}
#hx{left:0;bottom:150px}
body.hx-off #hx{display:none}
#hx .hx-t{width:10px;height:34px;display:block;background:#FFE14D;border:1px dashed #111;border-left:0;cursor:pointer;font:700 8px/1 ui-monospace,monospace;color:#111;padding:0;opacity:.85;writing-mode:vertical-rl}
#hx .hx-t:hover,#hx .hx-t:focus-visible{opacity:1}
#hx .hx-p{position:absolute;left:2px;bottom:0;width:250px;background:#FFF7C2;border:2px dashed #111;padding:8px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:3px 3px 0 #111}
#hx .hx-p[hidden]{display:none}
#hx h4{font-size:12px;display:flex;justify-content:space-between;align-items:center}
#hx .r{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
#hx .r > span{width:58px}
#hx button,#hx select{border:1px solid #111;background:#fff;padding:3px 6px;font:inherit;cursor:pointer;min-height:26px}
#hx button[aria-pressed=true]{background:#111;color:#FFE14D}
#hx a{color:#111;padding:2px 3px}
#hx a[aria-current=page]{font-weight:700;background:#111;color:#FFE14D}
#hx .note{font-size:11px;color:#444}
</style>

  if(st==='ok') return {short:`${fmtVal(dom,lm.limit-v)} left`, long:`${fmtVal(dom,lm.limit-v)} ${u} left before your ${nf(lm.limit)} ${u} limit`};
  if(st==='over') return {short:`${over} over`, long:`${over} ${u} over your ${nf(lm.limit)} ${u} limit`};

function tapeHTML(dom){
  const v = today(dom), lm = L()[dom], max = scaleMax(dom, v), step = DOM[dom].step;
  const from = ANIM[dom];
  const vars = `--v:${from!==undefined?from:v};--max:${max};--lim:${lm?lm.limit:0};--buf:${lm?lm.buffer:0}`;
  let ticks = '';
  for(let x=0; x<=max+1e-9; x+=step){ const major = lm ? (Math.abs(x-lm.limit)<1e-9 || x===0) : x===0; ticks += `<i class="tick${major?' mj':''}" style="bottom:${x/max*100}%"></i>`; }
  const bar = lm
    ? `<i class="buf" style="bottom:${lm.limit/max*100}%;height:${lm.buffer/max*100}%"></i><i class="seg s-ok"></i><i class="seg s-over"></i><i class="seg s-lim"></i>`
    : `<i class="seg s-free"></i>`;
  const bug = lm ? `<span class="tbug" style="bottom:${lm.limit/max*100}%"></span><span class="tbuglbl" style="bottom:${lm.limit/max*100}%">${nf(lm.limit)}</span>` : `<span class="tnolimit">no<br>limit</span>`;
  return `<span class="tape" data-tape="${dom}" data-to="${v}" style="${vars}" aria-hidden="true"><span class="scale">${ticks}</span><span class="bar">${bar}</span>${bug}</span>`;
}
function nowCol(dom, wide){
  const v = today(dom), st = status(dom, v), lm = L()[dom], stt = statusText(dom, v), D = DOM[dom];
  const aria = `${D.name} today: ${fmtVal(dom,v)} ${D.long}${lm?`, limit ${nf(lm.limit)}`:''}. ${stt.long}. Opens History for ${D.name}.`;
  return `<button class="now" data-dom="${dom}" data-act="tape" data-arg="${dom}" aria-label="${esc(aria)}">
    <span class="tlabel"><b>${D.name}</b>${!wide && dom==='alcohol' ? '' : `<span class="u">${D.unit}</span>`}</span>
    <span class="readout st-${st}">${fmtVal(dom,v)}</span>
    ${wide?tapeHTML(dom):''}
    <span class="tstatus st-${st}">${st==='limit'?`<b>${stt.short}</b>`:(!wide && dom==='alcohol' ? 'std drinks' : stt.short)}</span></button>`;
}
function weekCol(dom, days){
  const lm = L()[dom], D = DOM[dom], max = weekMax(dom, days);
  const pct = x => Math.min(x,max)/max*100;
  const lis = days.map(d => {
    const future = d > TODAY, v = future ? 0 : dayTotal(dom, d), st = future ? 'none' : status(dom, v);
    let bars = '';
    if(!future && v > 0){
      if(lm){
        bars += `<i class="b ok" style="width:${pct(Math.min(v,lm.limit)).toFixed(2)}%"></i>`;
        if(v > lm.limit) bars += `<i class="b ov" style="left:${pct(lm.limit).toFixed(2)}%;width:${(pct(Math.min(v,lm.limit+lm.buffer))-pct(lm.limit)).toFixed(2)}%"></i>`;
        if(v > lm.limit+lm.buffer) bars += `<i class="b lm" style="left:${pct(lm.limit+lm.buffer).toFixed(2)}%;width:${(pct(v)-pct(lm.limit+lm.buffer)).toFixed(2)}%"></i>`;
      } else bars += `<i class="b ok" style="width:${pct(v).toFixed(2)}%"></i>`;
    }
    const verdict = !lm ? '' : st==='ok' ? ', within limit' : st==='over' ? ', over limit' : ', well over limit';
    const sr = future ? `${wkdayLong(d)}: not yet` : `${wkdayLong(d)}${d===TODAY?' (today)':''}: ${fmtVal(dom,v)} ${D.long}${verdict}`;
    return `<li class="st-${st}${d===TODAY?' today':''}"><span class="sr">${sr}</span><span class="trk" aria-hidden="true"></span>${bars.replace(/<i /g,'<i aria-hidden="true" ')}<span class="wf" aria-hidden="true">${future?'—':fmtVal(dom,v)}</span></li>`;
  }).join('');
  const lp = lm ? lm.limit/max*100 : 0;
  const bug = lm ? `<span class="bugtri" style="left:${lp.toFixed(2)}%" aria-hidden="true"></span><span class="buglbl ${lp>50?'l':'r'}" style="left:${lp.toFixed(2)}%" aria-hidden="true">${nf(lm.limit)}</span><span class="limline" style="left:${lp.toFixed(2)}%" aria-hidden="true"></span>` : `<span class="buglbl none" aria-hidden="true">no limit</span>`;
  return `<div class="wkwrap" data-dom="${dom}" data-act="wkfig">${bug}<ol class="wk" aria-label="${D.name} this week, ${D.long} per day${lm?`, limit ${nf(lm.limit)}`:''}">${lis}</ol></div>`;
}

const HATCH = id => `<defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" style="fill:var(--water)"/></pattern></defs>`;
function fluidChart(){
  const W=340,H=150,l=44,b=22,t=8, lm=L().water, max=Math.max(1500, ...WEEK.map(d=>dayTotal('water',d)));
  const y = v => t + (H-t-b)*(1-v/max); const bw = (W-l-6)/7;
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily fluid intake Monday to Sunday: ${WEEK.map(d=>nf(dayTotal('water',d))).join(', ')} millilitres; limit ${nf(lm.limit)}">${HATCH('hw')}`;
  [0,500,1000,1500].forEach(v=>{ g+=`<line x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`; });
  WEEK.forEach((d,i)=>{ const v=dayTotal('water',d), x=l+4+i*bw, w=bw-8;
    const okH = Math.min(v,lm.limit); g+=`<rect x="${x}" y="${y(okH)}" width="${w}" height="${y(0)-y(okH)}" style="fill:var(--water)"/>`;
    if(v>lm.limit){ const top = Math.min(v, lm.limit+lm.buffer); g+=`<rect x="${x}" y="${y(top)}" width="${w}" height="${y(lm.limit)-y(top)}" fill="url(#hw)" style="stroke:var(--water)"/>`; }
    if(v>lm.limit+lm.buffer){ g+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(lm.limit+lm.buffer)-y(v)}" style="fill:var(--fg)"/>`; }
    g+=`<text x="${x+w/2}" y="${H-5}" text-anchor="middle" class="${d===TODAY?'lab':''}">${DAYNAME[d].slice(0,2)}</text>`; });

  return g+'</svg>';

function bpChart(bps){
  const W=340,H=150,l=44,b=22,t=10, lo=60, hi=140; const y = v => t+(H-t-b)*(1-(v-lo)/(hi-lo));
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Blood pressure readings: ${bps.map(x=>`${DAYNAME[x.day]} ${x.sys} over ${x.dia}${x.irregular?', irregular, standing':''}`).join('; ')}">`;
  [60,80,100,120,140].forEach(v=>{ g+=`<line x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
  WEEK.forEach(d=>{ g+=`<text x="${dayX(d,l,W)}" y="${H-5}" text-anchor="middle">${DAYNAME[d].split(' ')[1]}</text>`; });
  bps.forEach(x=>{ const cx = dayX(x.day,l,W); g+=`<line x1="${cx}" x2="${cx}" y1="${y(x.sys)}" y2="${y(x.dia)}" style="stroke:var(--bp)"/><rect x="${cx-4}" y="${y(x.sys)-4}" width="8" height="8" style="fill:var(--bp)"/><rect x="${cx-4}" y="${y(x.dia)-4}" width="8" height="8" style="fill:var(--display);stroke:var(--bp);stroke-width:1.5"/>`;
    if(x.irregular) g+=`<text x="${cx+8}" y="${y(x.sys)-6}" class="lab" style="fill:var(--bp);font-weight:700">▲</text>`; });
  return g+'</svg>';
}
function weightChart(ws){
  const W=340,H=120,l=44,b=22,t=10, lo=78.2, hi=78.5; const y = v => t+(H-t-b)*(1-(v-lo)/(hi-lo));
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight readings: ${ws.map(x=>`${DAYNAME[x.day]} ${nf(x.kg,2)} kilograms`).join('; ')}">`;
  [78.2,78.3,78.4,78.5].forEach(v=>{ g+=`<line x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--rule)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${nf(v,1)}</text>`; });
  WEEK.forEach(d=>{ g+=`<text x="${dayX(d,l,W)}" y="${H-5}" text-anchor="middle">${DAYNAME[d].split(' ')[1]}</text>`; });
  const pts = ws.filter(x=>WEEK.includes(x.day)).map(x=>[dayX(x.day,l,W), y(Math.min(hi,Math.max(lo,x.kg)))]);
  if(pts.length>1) g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:none;stroke:var(--weight);stroke-width:1.5"/>`;
  pts.forEach(p=>{ g+=`<rect x="${p[0]-4}" y="${p[1]-4}" width="8" height="8" style="fill:var(--weight)"/>`; });
  return g+'</svg>';
}

/* ================= HISTORY PAGE ================= */
const FILTERS = [['all','All','none'],['water','Water','water'],['sodium','Sodium','sodium'],['sugar','Sugar','sugar'],['caffeine','Caffeine','caffeine'],['alcohol','Alcohol','alcohol'],['food','Food','sodium'],['bp','Blood pressure','bp'],['weight','Weight','weight'],['urination','Urination','bathroom'],['bowel','Bowel','bathroom']];
const filterName = f => (FILTERS.find(x=>x[0]===f)||[0,f])[1];
function matchF(r, f){
  if(f==='all') return true;
  if(['water','sodium','sugar','caffeine','alcohol','potassium'].includes(f)) return recVal(r,f)>0;
  if(f==='food') return r.kind==='food'; if(f==='bp') return r.kind==='bp'; if(f==='weight') return r.kind==='weight';
  if(f==='urination') return r.kind==='wee'; if(f==='bowel') return r.kind==='bowel'; return true;
}
const histRecords = () => S.records.filter(r=>matchF(r,S.pg.history.filter));
const EDITABLE = {water:[['ml','Volume, ml']],drink:[['ml','Volume, ml'],['caffeine','Caffeine, mg'],['sugar','Sugar, g']],food:[['sodium','Sodium, mg'],['sugar','Sugar, g']],bp:[['sys','Systolic'],['dia','Diastolic'],['hr','Heart rate']],weight:[['kg','Weight, kg']],wee:[],bowel:[]};
function pageHistory(){
  const g = S.pg.history; const recs = histRecords();
  const byDay = {}; recs.forEach(r => (byDay[r.day]=byDay[r.day]||[]).push(r));
  const days = Object.keys(byDay).sort().reverse();
  const ledger = days.length ? days.map(d => `<div class="dayh"><span>${d===TODAY?'Today · Sun 27 Sep':DAYNAME[d]+' Sep'}</span><span>${byDay[d].length} record${byDay[d].length===1?'':'s'}</span></div>` + byDay[d].sort((a,b)=>a.t<b.t?1:-1).map(r => {
      const s = recSummary(r), dom = recDom(r); const open = g.edit || g.open===r.id; const editing = g.editing===r.id;
      return `<button class="lrow" data-dom="${dom}" data-act="lrow" data-arg="${r.id}" aria-expanded="${open}"><span class="tm">${tf(r.t)}</span><span class="spine"></span><span class="grow"><span class="t1">${esc(r.label)}</span><br><span class="t2">${s.d}</span></span><span class="val">${s.v}</span></button>`
        + (editing ? `<div class="ledit">${EDITABLE[r.kind].map(([k,n])=>`<label>${n}<input inputmode="decimal" data-edit="${k}" value="${r[k]??''}" aria-label="${n}"></label>`).join('')}${r.kind==='wee'||r.kind==='bowel'?`<label>Amount<select class="sel" data-edit="size">${['Small','Medium','Large'].map(x=>`<option${r.size===x?' selected':''}>${x}</option>`).join('')}</select></label>`:''}<div class="btnrow"><button class="dbtn solid" data-act="lsave" data-arg="${r.id}">${ico('check')}Save</button><button class="dbtn" data-act="lcancel">Cancel</button></div></div>`
          : open ? `<div class="lacts"><button class="dbtn" data-act="ledit" data-arg="${r.id}">${ico('edit')}Edit</button><button class="dbtn danger" data-act="ldel" data-arg="${r.id}">${ico('close')}Delete</button></div>` : '');
    }).join('')).join('') : `<p class="line muted" style="padding:16px 0">No ${filterName(g.filter).toLowerCase()} records.</p>`;
  const chips = g.showFilter ? `<div class="chipbar" role="group" aria-label="Show records for">${FILTERS.map(([k,n,d])=>`<button class="chip" data-dom="${d}" data-act="hfilter" data-arg="${k}" aria-pressed="${g.filter===k}">${n}</button>`).join('')}</div>`
    : g.filter!=='all' ? `<div class="fline" data-dom="${(FILTERS.find(x=>x[0]===g.filter)||[])[2]||'none'}"><span class="spine"></span><span class="grow">Showing <b>${filterName(g.filter)}</b> only</span><button class="tbtn" data-act="hfilter" data-arg="all">Show all</button></div>` : '';
  return `${chips}
    ${g.exportOpen?`<div class="sec" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="line">Export ${recs.length} records</span><button class="dbtn" data-act="csv">${ico('export')}CSV file</button><button class="dbtn" data-act="pdf">${ico('export')}PDF report</button></div>`:''}
    <div class="sec" style="padding-top:0">${ledger}</div>`;
}

function sk(act, arg, icon, label, o={}){
  return `<button class="cap" data-act="${act}" data-arg="${arg}"${o.disabled?' disabled':''}${o.pressed!==undefined?` aria-pressed="${o.pressed}"`:''}${o.expanded!==undefined?` aria-expanded="${o.expanded}"`:''}${o.aria?` aria-label="${esc(o.aria)}"`:''}>${icon?ico(icon):''}<span>${label}</span></button>`;
}
function softKeys(p){
  if(p==='log'){ const f = S.pg.log.form;
    if(!f){ const at = logTime(), off = LOG_AT[S.logAt||0];
      return sk('undo','','undo','Undo',{disabled:!(S.undo && S.undo.page==='log'), aria:'Undo the last entry'})
        + sk('form','custom','water','Custom',{aria:'Custom water amount'})
        + sk('logat','','clock', off?`At ${tf(at)}`:'Now',{pressed:!!off, aria:off?`Next entry is logged at ${tf(at)}, ${off} minutes ago. Tap for earlier, or back to now`:'Next entry is logged now. Tap to log it earlier'}); }
    if(f==='drinks') return sk('formcancel','','back','Done');
    return sk('formsave','','check','Save') + (f==='bp'?sk('bpmore','','down',S.drafts.bp.more?'Fewer options':'More options',{expanded:S.drafts.bp.more}):'') + sk('formcancel','','close','Cancel');
  }
  if(p==='meds') return [['schedule','Schedule'],['prescriptions','Scripts'],['stock','Stock'],['titrations','Titrations']].map(([t,n])=>sk('medtab',t,'',n,{pressed:S.pg.meds.tab===t, aria:t==='prescriptions'?'Prescriptions':n})).join('');
  if(p==='metrics') return Object.entries(RANGE).map(([a,n])=>sk('range',a,'',n,{pressed:S.pg.metrics.range===a, aria:a==='all'?'All records':n})).join('');
  if(p==='history'){ const g=S.pg.history; return sk('hshowfilter','','filter','Filter',{pressed:g.showFilter}) + sk('hedit','','edit', g.edit?'Done editing':'Edit',{pressed:g.edit}) + sk('hexport','','export','Export',{expanded:g.exportOpen}); }

  return '';
}

function applyTheme(){

function render(){

  if(MIC.phase) ov += micPanel();

  else area = display(S.cur, 0, true);

  os.querySelectorAll('[data-scroll]').forEach(el => { const v = S.scroll[el.dataset.scroll]; if(v) el.scrollTop = v; });
  const sb2 = os.querySelector('.set-body'); if(sb2 && S.scroll.__settings) sb2.scrollTop = S.scroll.__settings;
  if(fkey){ const el = findByKey(fkey); if(el){ el.focus({preventScroll:true}); if(sel!=null && el.setSelectionRange) try{ el.setSelectionRange(sel,sel); }catch(e){} } }
  const doms = Object.keys(ANIM);
  if(doms.length){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ doms.forEach(d=>{ os.querySelectorAll(`[data-tape="${d}"]`).forEach(t=>{ t.classList.add('anim'); t.style.setProperty('--v', t.dataset.to); }); }); })); }

function focusKey(el){
  if(el.dataset.bind) return 'bind:'+el.dataset.bind;
  if(el.dataset.setin) return 'setin:'+el.dataset.setin;
  if(el.dataset.micE) return 'mice:'+el.dataset.micE;
  if(el.id) return 'id:'+el.id;
  const a = el.closest('[data-act]'); if(a){ const sl = a.closest('[data-slot]'); return `act:${a.dataset.act}|${a.dataset.arg||''}|${sl?sl.dataset.slot:''}|${a.closest('.bezel')?'bz':''}${a.closest('.cluster-frame')?'cl':''}`; }
  return null;
}
function findByKey(k){
  const i = k.indexOf(':'), type = k.slice(0,i), rest = k.slice(i+1);
  if(type==='bind') return os.querySelector(`[data-bind="${rest}"]`);
  if(type==='setin') return os.querySelector(`[data-setin="${rest}"]`);
  if(type==='mice') return os.querySelector(`[data-mic-e="${rest}"]`);
  if(type==='id') return document.getElementById(rest);
  for(const el of os.querySelectorAll('[data-act]')){ if(el.offsetParent!==null && focusKey(el)===k) return el; }
  return null;
}

function snapshot(){ return JSON.stringify({records:S.records, doses:S.doses, meds:S.meds, titration:S.titration, recent:S.recent}); }
function withUndo(fn){ const before = snapshot(); const tb = {}; trackedDoms().forEach(d=>tb[d]=today(d)); fn(); S.undo = {page: ACTPAGE || visPage(), snap: before}; trackedDoms().forEach(d=>{ if(Math.abs(today(d)-tb[d])>1e-9) ANIM[d]=tb[d]; }); }
function doUndo(){ if(!S.undo) return; const tb = {}; trackedDoms().forEach(d=>tb[d]=today(d)); Object.assign(S, JSON.parse(S.undo.snap)); S.undo = null; trackedDoms().forEach(d=>{ if(Math.abs(today(d)-tb[d])>1e-9) ANIM[d]=tb[d]; }); say('Undone'); }
function addRecords(list){ const ids=[]; const t = logTime(); list.forEach(r=>{ r.id='r'+(++S.seq); r.day=r.day||TODAY; r.t=r.t||t; S.records.push(r); ids.push(r.id); }); return ids; }
const atTxt = () => S.logAt ? ` at ${tf(logTime())}` : '';
function openPage(p){
  if(!S.open.includes(p)) S.open.push(p);
  if(S.cur!==p){ S.cur = p; S.pfdPeek = false; SWITCHED[0] = 1; }
  if(p==='log' || S.slots.includes(p)) return;
  if(isWide()){ const e = S.slots.indexOf(null); const slot = e>=0 ? e : S.focusSlot; S.slots[slot] = p; S.focusSlot = slot; SWITCHED[slot] = 1; }
  else S.slots = [p, S.slots[0]];
}
function showInSlot(p, slot){
  if(!S.open.includes(p)) S.open.push(p);
  const other = 1-slot; S.cur = p;
  if(S.slots[slot]===p) return;
  if(S.slots[other]===p) S.slots[other] = S.slots[slot];
  S.slots[slot] = p; SWITCHED[slot]=1; SWITCHED[other]=1; S.focusSlot = slot;
}
function closePage(p){
  if(p==='log') return;
  S.open = S.open.filter(x=>x!==p);
  if(S.cur===p){ S.cur = S.open[S.open.length-1] || 'log'; S.pfdPeek = false; SWITCHED[0] = 1; }
  [0,1].forEach(s=>{ if(S.slots[s]===p){ const cand = S.open.filter(x=>x!=='log' && !S.slots.includes(x)); S.slots[s] = cand[cand.length-1] || null; SWITCHED[s]=1; } });
}
function cycle(dir){ const list = S.open; if(list.length<2) return; const i = list.indexOf(S.cur); openPage(list[(i+dir+list.length)%list.length]); }

}

    else if(PRESETS[k]){ const p = PRESETS[k]; const sug = parseFloat(S.drafts.drinks.sugar)||0;

  field(_,p){ S.field = p; },
  kp(_,k){ keypad(k); },
  step(_,a){ const [path,delta] = a.split(':'); const [f,k] = path.split('.'); const cur = parseFloat(S.drafts[f][k])||0; const dec = f==='weight'?2:0; S.drafts[f][k] = String(Math.max(0, +(cur + parseFloat(delta)).toFixed(dec)).toFixed(dec)); S.field = path; },
  formsave(){ formSave(); },
  formcancel(){ S.pg.log.form = null; S.field = null; },
  bpmore(){ S.drafts.bp.more = !S.drafts.bp.more; },
  bpopt(_,a){ const b=S.drafts.bp; if(a==='irregular') b.irregular=!b.irregular; else { const [k,v]=a.split(':'); b[k]=v; } },
  foodsrc(_,s){ S.drafts.food.src = s; },
  foodunit(_,u){ S.drafts.food.unit = u; },
  aifood(){ const fd = S.drafts.food; if(!fd.desc) fd.desc = 'Ham sandwich'; fd.src='salt'; fd.unit='g'; fd.amt='1.2'; S.field='food.amt'; say('AI estimate: 1.2 g salt, about 472 mg sodium. Check it, then Save'); },
  aidrink(){ const a = S.drafts.aiDrink; a.res = `AI: ${a.q||'Rooibos tea'} has no caffeine and no sugar per 100 ml`; if(!S.drafts.other.name) S.drafts.other.name = a.q || 'Rooibos tea'; },
  detail(_,id){ const r = S.records.find(x=>x.id===id); S.drafts.detail = {id, size:r?r.size:null, note:r&&r.note||''}; S.msg = null; openLogForm('detail'); },
  detsize(_,s){ S.drafts.detail.size = s; },
  undo(){ doUndo(); },
  pk(_,p){ if(S.cur===p) return; openPage(p); },
  pkw(el,p){ const slot = +el.dataset.slot; if(S.slots[slot]===p) return;
    if(S.slots[slot] && !S.slots[1-slot] && !S.slots.includes(p)){ if(!S.open.includes(p)) S.open.push(p); S.slots[1-slot] = p; S.cur = p; SWITCHED[1-slot]=1; return; }
    showInSlot(p, slot); },
  close(_,p){ closePage(p); if(S.overlay==='switcher') S.overlay=null; },
  switcher(el){ if(S.overlay==='switcher'){ S.overlay=null; return; } invoker = focusKey(el); S.overlay = 'switcher'; render(); const f = os.querySelector('.switcher button'); if(f) f.focus(); return 'skip'; },
  swgo(_,p){ S.overlay = null; openPage(p); },
  open(_,p){ S.overlay = null; openPage(p); },
  medtab(_,t){ S.pg.meds.tab = t; S.pg.meds.stockEdit=null; if(S.field==='stock.val') S.field=null; openPage('meds'); },
  take(_,id){ if(!id) return; take(id); },
  skipopen(_,id){ if(!id) return; S.pg.meds.skip = S.pg.meds.skip===id?null:id; },
  skip(_,a){ const [id,r] = a.split('|'); skip(id,r); },
  stockedit(_,a){ S.pg.meds.stockEdit = S.pg.meds.stockEdit===a?null:a; S.drafts.stock.val=''; S.field = S.pg.meds.stockEdit?'stock.val':null; },
  stockcancel(){ S.pg.meds.stockEdit=null; S.field=null; },
  stocksave(_,a){ const [k,mode]=a.split(':'); const n=parseInt(S.drafts.stock.val); if(!(n>=0)){ say('Enter a number of pills'); return; } const m=S.meds[k];
    withUndo(()=>{ m.stock = mode==='refill' ? m.stock+n : n; }); say(`${m.stockName}: ${m.stock} pills left`, {undo:true}); S.pg.meds.stockEdit=null; S.field=null; },
  titr(_,a){ if(a==='start'){ withUndo(()=>{ S.titration='started'; S.meds.bisoprolol.dose='5 mg'; }); say('Started Bisoprolol 5 mg · next dose Mon 28 08:00', {undo:true}); } else S.titration = a; },
  range(_,r){ S.pg.metrics.range = r; },
  aiinsight(){ S.pg.metrics.ai = true; },
  hfilter(_,f){ S.pg.history.filter = f; S.pg.history.open=null; S.pg.history.editing=null; },
  hshowfilter(){ S.pg.history.showFilter = !S.pg.history.showFilter; },
  hedit(){ S.pg.history.edit = !S.pg.history.edit; S.pg.history.editing=null; },
  hexport(){ S.pg.history.exportOpen = !S.pg.history.exportOpen; },
  lrow(_,id){ const g=S.pg.history; if(g.edit){ g.editing = id; return; } g.open = g.open===id?null:id; g.editing=null; },
  ledit(_,id){ S.pg.history.editing = id; },
  lcancel(){ S.pg.history.editing = null; },
  lsave(el,id){ const r = S.records.find(x=>x.id===id); const box = el.closest('.ledit'); const vals = {};
    box.querySelectorAll('[data-edit]').forEach(i=>{ vals[i.dataset.edit] = i.value; });
    withUndo(()=>{ Object.entries(vals).forEach(([k,v])=>{ r[k] = k==='size' ? v : (v===''?null:Number(v)); }); });
    S.pg.history.editing=null; S.pg.history.open=null; say(`Saved ${r.label.toLowerCase()} ${tf(r.t)}`, {undo:true}); },
  ldel(_,id){ const r = S.records.find(x=>x.id===id); withUndo(()=>{ S.records = S.records.filter(x=>x.id!==id); }); S.pg.history.open=null; say(`Deleted ${r.label.toLowerCase()} ${tf(r.t)}`, {undo:true}); },
  csv(){ csv(); },
  pdf(){ say('The PDF report is not built in this prototype'); },
  syncnow(){ S.lastSync = NOW; say(`Synced ${tf(NOW)}`); },
  delacctask(){ S.pg.profile.confirmDelete = true; },
  delacctno(){ S.pg.profile.confirmDelete = false; },
  delacct(){ S.pg.profile.confirmDelete = false; S.signedIn=false; say('Account deleted · records on this device kept'); },
  setgrp(_,k){ S.setOpen[k] = !S.setOpen[k]; },
  daystart(_,d){ S.settings.dayStart = Math.max(0, Math.min(12, S.settings.dayStart + (+d))); },
  weekstart(_,w){ S.settings.weekStart = w; },
  lim(_,a){ const [d,k,dir] = a.split(':'); const st = {water:250,sodium:100,sugar:5}[d]; const o = S.settings.limits[d]; o[k] = Math.max(k==='limit'?st:0, o[k] + st*(+dir)); },
  setbool(_,a){ const [k,v] = a.split(':'); const b = v==='true'; if(k.startsWith('tr.')) S.settings.trackers[k.slice(3)] = b; else S.settings[k] = b; },
  wstep(_,v){ S.settings.weightStep = +v; },
  themepref(_,t){ S.settings.themePref = t; },
  timefmt(_,t){ S.settings.timeFmt = t; },
  followups(_,d){ S.settings.followUps = Math.max(0, Math.min(5, S.settings.followUps + (+d))); },
  followevery(_,d){ S.settings.followEvery = Math.max(5, Math.min(60, S.settings.followEvery + 5*(+d))); },
  deldataask(){ S.setConfirmDelete = true; },
  deldatano(){ S.setConfirmDelete = false; },
  deldata(){ S.records = []; S.setConfirmDelete=false; S.undo=null; say('All records on this device deleted'); },
  noop(){},
  micrm(_,i){ MIC.entries.splice(+i,1); },
  miclog(){ micLog(); },
  micdiscard(){ MIC.phase=null; ACTPAGE=null; say('Discarded the AI entries'); },
};
os.addEventListener('click', e => {
  if(SUPPRESS_CLICK){ SUPPRESS_CLICK=false; e.preventDefault(); return; }
  const el = e.target.closest('[data-act]'); if(!el || !os.contains(el) || el.disabled) return;
  const act = el.dataset.act; const fn = ACT[act]; if(!fn) return;
  const pg = el.closest('[data-page]'); ACTPAGE = pg ? pg.dataset.page : null;
  const slotEl = el.closest('.mfd[data-slot]'); if(slotEl) S.focusSlot = +slotEl.dataset.slot;
  const r = fn(el, el.dataset.arg); if(r!=='skip') render();
  ACTPAGE = null;
});
os.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.bind){ const [f,k] = t.dataset.bind.split('.'); S.drafts[f][k] = t.value; save(); return; }
  if(t.dataset.setin){ S.settings[t.dataset.setin] = t.value; save(); return; }
  if(t.dataset.micE){ const [i,k] = t.dataset.micE.split(':'); MIC.entries[+i][k] = parseFloat(t.value)||0; const c = os.querySelector(`[data-mic-conv="${i}"]`); if(c && k==='salt') c.textContent = `${nf(MIC.entries[i].salt,1)} g salt = ${nf(Math.round(MIC.entries[i].salt*393))} mg sodium`; }
});
os.addEventListener('change', e => { const t = e.target; if(t.dataset.setsel){ S.settings[t.dataset.setsel] = t.value; render(); } if(t.dataset.import){ ACTPAGE='settings'; say(`Read ${t.files[0]?t.files[0].name:'file'} · import is not built in this prototype`); ACTPAGE=null; render(); } });
os.addEventListener('focusin', e => { const t = e.target; if(t.dataset && t.dataset.bind && S.field){ S.field = null; const a = os.querySelector('.field.active'); if(a) a.classList.remove('active'); } });
os.addEventListener('scroll', e => { const t = e.target; if(t.dataset && t.dataset.scroll) S.scroll[t.dataset.scroll] = t.scrollTop; }, true);

/* keyboard */
document.addEventListener('keydown', e => {
  if(e.key==='`' && !(e.target.tagName==='INPUT')){ document.body.classList.toggle('hx-off'); return; }
  if(e.key==='Escape'){
    if(MIC.phase){ MIC.phase=null; clearInterval(MIC.timer); render(); const m = document.getElementById(isWide()?'mic-w':'mic-p'); if(m) m.focus(); return; }
    if(S.overlay){ closeOverlay(); e.preventDefault(); return; }
    if(S.pg.meds.skip){ S.pg.meds.skip=null; render(); return; }
    return;
  }
  const inText = e.target.tagName==='INPUT' || e.target.tagName==='SELECT';
  if(S.field && !inText && !S.overlay){
    if(/^[0-9]$/.test(e.key) || e.key==='.'){ keypad(e.key); render(); e.preventDefault(); return; }
    if(e.key==='Backspace'){ keypad('bk'); render(); e.preventDefault(); return; }
  }
  if((e.key===' '||e.key==='Enter') && e.target.dataset && e.target.dataset.mic && !e.repeat){ e.preventDefault(); micStart(e.target); }
});
document.addEventListener('keyup', e => { if((e.key===' '||e.key==='Enter') && e.target.dataset && e.target.dataset.mic && MIC.phase==='listen'){ e.preventDefault(); micRelease(); } });

/* ================= MIC (press and hold) ================= */
let micOrigin = null;
function micStart(btn){
  if(!S.signedIn) return;
  MIC.phase='listen'; MIC.t0=Date.now(); MIC.words=0; MIC.cancel=false;
  const r = btn.getBoundingClientRect(); micOrigin = {x:r.left+r.width/2, y:r.top+r.height/2, id:btn.id};
  render(); const nb = document.getElementById(micOrigin.id); if(nb) nb.focus({preventScroll:true});
  clearInterval(MIC.timer);
  MIC.timer = setInterval(()=>{ if(MIC.phase!=='listen'){ clearInterval(MIC.timer); return; }
    const el = Date.now()-MIC.t0; const w = Math.min(TRANSCRIPT.length, Math.floor(el/320));
    const p = document.getElementById('micp'); if(!p) return;
    p.querySelector('[data-mtime]').textContent = '0:'+String(Math.floor(el/1000)).padStart(2,'0');
    if(w!==MIC.words){ MIC.words=w; p.querySelector('[data-trans]').textContent = TRANSCRIPT.slice(0,w).join(' ');
      const level = w>=TRANSCRIPT.length ? 2 : [5,8,6,10,7,4,9][w%7]; p.querySelectorAll('[data-meter] i').forEach((m,i)=>m.classList.toggle('on', i<level)); }
  }, 100);
}
function micMove(x,y){ if(MIC.phase!=='listen'||!micOrigin) return; const far = Math.hypot(x-micOrigin.x, y-micOrigin.y) > 90;
  if(far!==MIC.cancel){ MIC.cancel = far; const p = document.getElementById('micp'); if(p){ p.classList.toggle('cancel', far); p.querySelector('[data-mt]').textContent = far?'Release to cancel':'Listening'; p.querySelector('[data-hint]').textContent = far?'Release now to cancel · slide back to keep':'Release to review · slide away to cancel'; } } }
function micRelease(){
  clearInterval(MIC.timer);
  if(MIC.cancel){ MIC.phase=null; say('Cancelled · nothing logged'); render(); return; }
  MIC.phase='review'; MIC.entries=[{kind:'coffee',ml:250,caffeine:95},{kind:'coffee',ml:250,caffeine:95},{kind:'food',salt:1.2}];
  render(); const b = os.querySelector('#micp [data-act="miclog"]'); if(b) b.focus();
}
function micLog(){
  const n = MIC.entries.length; ACTPAGE = null;
  withUndo(()=>addRecords(MIC.entries.map(e => e.kind==='coffee' ? {kind:'drink',label:'Coffee',ml:e.ml,caffeine:e.caffeine,t:'08:00',ai:true} : {kind:'food',label:'Ham sandwich',sodium:Math.round(e.salt*393),salt:`${e.salt} g salt`,sugar:0,ai:true})));
  MIC.phase=null; say(`Logged ${n} entr${n===1?'y':'ies'} from AI`, {undo:true});
}
os.addEventListener('pointerdown', e => { const b = e.target.closest('[data-mic]'); if(!b) return; e.preventDefault(); micStart(b);
  const nb = document.getElementById(b.id); if(nb){ try{ nb.setPointerCapture(e.pointerId); }catch(_){} } });
os.addEventListener('pointermove', e => { if(MIC.phase==='listen') micMove(e.clientX, e.clientY); });
os.addEventListener('pointerup', e => { if(MIC.phase==='listen') { micMove(e.clientX,e.clientY); micRelease(); } });
os.addEventListener('pointercancel', () => { if(MIC.phase==='listen'){ MIC.cancel=true; micRelease(); } });
os.addEventListener('contextmenu', e => { if(e.target.closest('[data-mic]')) e.preventDefault(); });

/* ================= SWIPE BETWEEN PAGES (phone) ================= */
let SW = null, SUPPRESS_CLICK = false;
os.addEventListener('pointerdown', e => { const pg = e.target.closest('[data-swipe]'); if(!pg || e.target.closest('input,select,.chipbar,.kpad')) return; SW = {x:e.clientX, y:e.clientY}; }, true);
os.addEventListener('pointerup', e => { if(!SW) return; const dx = e.clientX-SW.x, dy = e.clientY-SW.y; SW = null;
  if(Math.abs(dx)>70 && Math.abs(dy)<45){ SUPPRESS_CLICK = true; setTimeout(()=>SUPPRESS_CLICK=false, 50); cycle(dx<0?1:-1); render(); } }, true);

/* ================= HARNESS ================= */
function syncHarness(){
  document.querySelectorAll('[data-hx]').forEach(b => { const k=b.dataset.hx, v=b.dataset.v;
    b.setAttribute('aria-pressed', String(k==='vp'?S.vp===v : k==='theme'?S.theme===v : (S.signedIn?'in':'out')===v)); });
}
const hxTab = document.getElementById('hx-tab'), hxPanel = document.getElementById('hx-panel');
function hxToggle(open){ hxPanel.hidden = !open; hxTab.hidden = open; hxTab.setAttribute('aria-expanded', String(open)); }
hxTab.onclick = () => hxToggle(true);
document.getElementById('hx-close').onclick = () => { hxToggle(false); hxTab.focus(); };
document.querySelectorAll('[data-hx]').forEach(b => b.onclick = () => { const k=b.dataset.hx, v=b.dataset.v;
  if(k==='vp') S.vp = v; else if(k==='theme') S.settings.themePref = v; else { S.signedIn = v==='in'; if(!S.signedIn) MIC.phase=null; S.overlay = null; }
  render(); requestAnimationFrame(()=>render()); });
document.getElementById('hx-reset').onclick = () => { const vp = S.vp; S = initialState(); S.vp = vp; MIC.phase=null; render(); };
document.getElementById('hx-demo').onchange = e => { demo(e.target.value); e.target.value=''; };
if(/[?&#]clean\b/.test(location.href)) document.body.classList.add('hx-off');
let lastWide = null;
addEventListener('resize', () => { fit(); const w = isWide(); if(w!==lastWide){ lastWide = w; render(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(S.settings.themePref==='system') render(); });

function demo(n){
  const base = (vp, theme, signed) => { S = initialState(); S.vp = vp; S.settings.themePref = theme; S.signedIn = signed; MIC.phase=null; clearInterval(MIC.timer); };
  const three = () => { S.open=['log','meds','metrics']; S.pg.meds.tab='stock'; S.pg.metrics.range='30d'; S.pg.log.form='bp'; S.drafts.bp.sys='128'; S.field='bp.dia'; };
  switch(n){
    case '1': base('390','dark',true); break;
    case '2': base('390','light',false); break;
    case '3': base('390','dark',true); three(); S.cur='meds'; S.overlay='switcher'; break;
    case '4': base('1280','dark',true); break;
    case '5': base('390','dark',true); S.pg.log.form='food'; S.drafts.food={desc:'Tomato soup',src:'salt',unit:'g',amt:'1.5',sugar:''}; S.field='food.amt'; break;
    case '6a': base('390','dark',true); render(); { const b=document.getElementById('mic-p'); if(b){ micStart(b); MIC.words=5; } } return render();
    case '6b': base('390','dark',true); render(); MIC.phase='review'; MIC.entries=[{kind:'coffee',ml:250,caffeine:95},{kind:'coffee',ml:250,caffeine:95},{kind:'food',salt:1.2}]; break;
    case '7a': base('390','dark',true); three(); S.cur='meds'; S.overlay='settings'; break;
    case '7b': base('1280','dark',true); three(); S.overlay='settings'; break;
    case '8': base('390','dark',true); S.cur='meds'; S.pg.meds.tab='titrations'; break;
  }
  render(); requestAnimationFrame(()=>render());
}
render(); lastWide = isWide(); requestAnimationFrame(()=>render());
</script>
