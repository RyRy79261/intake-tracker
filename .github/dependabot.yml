# Dependabot config — see https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy:
# - npm: weekly version updates (grouped to keep PR volume manageable) +
#   Dependabot's automatic security updates. The pnpm audit job in ci.yml
#   gates merge on `--audit-level high`; Dependabot opens the PRs.
# - github-actions: weekly so pinned action versions stay current.
#
# We intentionally cap open PRs and group minor/patch bumps to avoid PR spam.
# Security advisories bypass the schedule and ignore `open-pull-requests-limit`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Group routine bumps so reviewers see one PR per ecosystem area
      # rather than ten. Major upgrades stay individual for blast radius.
      #
      # `react` and `react-dom` MUST move as one unit: react-dom's development
      # build throws "Incompatible React versions" at module load unless the two
      # versions match exactly, which wipes out every vitest suite (the global
      # setupFiles imports @testing-library/react). Left ungrouped, Dependabot
      # opens one PR per package and NEITHER can ever go green — see PRs #314
      # and #315. Dependabot assigns a dependency to the FIRST matching group in
      # file order, so this block must stay above `types:`.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      drizzle:
        patterns:
          - "drizzle-*"
          - "@drizzle/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
          - "@stryker-mutator/*"
          - "fast-check"
          - "msw"
          - "fake-indexeddb"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          # Belt-and-braces: the React typings belong to the `react` group above.
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "typescript"
    ignore:
      # Next.js 15 introduces RSC and other large surface changes; bump on a
      # scheduled major-upgrade PR, not as a routine Dependabot bump.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) rewrite. Two blockers make it unfit for a
      # routine bump: typescript-eslint crashes on it (`TypeError: Cannot read
      # properties of undefined (reading 'Cjs')`, so `pnpm lint` dies in every
      # package), and the Compiler-API-driven schema extractor
      # (apps/web/src/__tests__/dexie-schema-extractor.ts) breaks because TS 7
      # restructured the package exports (ts.createSourceFile/ScriptTarget/
      # forEachChild are gone from the entrypoint). Revisit as a deliberate
      # major-upgrade PR once the lint toolchain supports TS 7. See PR #293.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jsdom 30.1 removed the internal Blob `_buffer` field that vitest's jsdom
      # environment reads when it bridges jsdom's FormData/Blob to Node's fetch
      # (`makeCompatBlob`). Every `fetch(url, { body: formData })` under the
      # jsdom environment then throws "Cannot read properties of undefined
      # (reading '_buffer')" — it broke voice-panel.flow.test.tsx in PR #361.
      # Affects vitest 4.1.11 AND 5.0.1. apps/web pins `jsdom: ~30.0.1`; drop
      # this ignore and the pin once a vitest release handles jsdom >= 30.1.
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
